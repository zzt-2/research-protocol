<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <defs>
    <marker id="arrow-data" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M1,1 L11,6 L1,11 Z" fill="#2f4f68"/>
    </marker>
    <marker id="arrow-control" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M1,1 L11,6 L1,11 Z" fill="#3f7d55"/>
    </marker>
    <marker id="arrow-feedback" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M1,1 L11,6 L1,11 Z" fill="#8a5a2b"/>
    </marker>
    <style>
      .canvas { fill: #fbfbf7; }
      .title { font-family: "Microsoft YaHei", "Noto Sans CJK SC", Arial, sans-serif; font-size: 32px; font-weight: 700; fill: #26323a; }
      .subtitle { font-family: "Microsoft YaHei", "Noto Sans CJK SC", Arial, sans-serif; font-size: 18px; fill: #50606a; }
      .section-title { font-family: "Microsoft YaHei", "Noto Sans CJK SC", Arial, sans-serif; font-size: 20px; font-weight: 700; fill: #26323a; }
      .box-title { font-family: "Microsoft YaHei", "Noto Sans CJK SC", Arial, sans-serif; font-size: 19px; font-weight: 700; fill: #26323a; }
      .box-text { font-family: "Microsoft YaHei", "Noto Sans CJK SC", Arial, sans-serif; font-size: 15px; fill: #31414b; }
      .small { font-family: "Microsoft YaHei", "Noto Sans CJK SC", Arial, sans-serif; font-size: 13px; fill: #485962; }
      .formula { font-family: "Cambria Math", "Times New Roman", serif; font-size: 16px; fill: #26323a; }
      .tag { font-family: "Microsoft YaHei", "Noto Sans CJK SC", Arial, sans-serif; font-size: 13px; font-weight: 700; fill: #6f3c2d; }
      .legend { font-family: "Microsoft YaHei", "Noto Sans CJK SC", Arial, sans-serif; font-size: 13px; fill: #4c5a61; }
      .outer { fill: #ffffff; stroke: #cfd8dc; stroke-width: 1.6; rx: 12; }
      .green { fill: #e7f2ea; stroke: #92b59b; stroke-width: 1.6; rx: 10; }
      .blue { fill: #e6f0f8; stroke: #8eabc6; stroke-width: 1.6; rx: 10; }
      .orange { fill: #f8eadb; stroke: #d1a471; stroke-width: 1.6; rx: 10; }
      .yellow { fill: #fbf1c9; stroke: #d6c37a; stroke-width: 1.6; rx: 10; }
      .gray { fill: #eef1f3; stroke: #aab4ba; stroke-width: 1.6; rx: 10; }
      .whitebox { fill: #ffffff; stroke: #ccd6db; stroke-width: 1.3; rx: 8; }
      .dashed { fill: #f8faf9; stroke: #8ba399; stroke-width: 1.8; stroke-dasharray: 8 6; rx: 10; }
      .data-arrow { stroke: #2f4f68; stroke-width: 3; fill: none; marker-end: url(#arrow-data); }
      .control-arrow { stroke: #3f7d55; stroke-width: 2.6; fill: none; marker-end: url(#arrow-control); }
      .feedback-arrow { stroke: #8a5a2b; stroke-width: 2.6; fill: none; marker-end: url(#arrow-feedback); stroke-dasharray: 8 6; }
      .thin { stroke-width: 2; }
    </style>
  </defs>

  <rect class="canvas" x="0" y="0" width="1600" height="900"/>

  <rect x="44" y="28" width="1512" height="70" rx="16" fill="#fbf1c9" stroke="#d6c37a" stroke-width="1.8"/>
  <text class="title" x="800" y="72" text-anchor="middle">星地相干激光通信接收端信号处理研究框架</text>

  <text class="subtitle" x="64" y="128">核心问题：估计精度够不够？同步方法怎么选、参数怎么配？</text>

  <rect class="green" x="62" y="154" width="240" height="228"/>
  <text class="section-title" x="182" y="184" text-anchor="middle">星地链路与湍流信道</text>
  <circle cx="128" cy="230" r="19" fill="#ffffff" stroke="#6b9f7c" stroke-width="2"/>
  <path d="M119 232 L137 225 M128 211 L128 202 M110 247 L100 258 M147 247 L157 258" stroke="#6b9f7c" stroke-width="3" fill="none"/>
  <rect x="92" y="296" width="180" height="58" rx="10" fill="#ffffff" stroke="#92b59b" stroke-width="1.4"/>
  <text class="box-title" x="182" y="320" text-anchor="middle">地面相干接收端</text>
  <text class="small" x="182" y="344" text-anchor="middle">QPSK · 高速 DSP</text>
  <path class="data-arrow" d="M149 242 C190 250, 221 270, 252 300"/>
  <text class="small" x="195" y="258">LEO 星地链路</text>
  <path d="M86 276 C126 246, 167 260, 213 242 C235 234, 257 237, 283 224" stroke="#7fad8b" stroke-width="2" stroke-dasharray="5 5" fill="none"/>
  <text class="small" x="182" y="214" text-anchor="middle">大气湍流 · 多普勒频移</text>

  <rect class="yellow" x="333" y="154" width="254" height="228"/>
  <text class="section-title" x="460" y="184" text-anchor="middle">统一建模输入</text>
  <rect class="whitebox" x="361" y="206" width="198" height="54"/>
  <text class="box-title" x="460" y="230" text-anchor="middle">Gamma-Gamma</text>
  <text class="formula" x="460" y="252" text-anchor="middle">h = X · Y,  (α, β)</text>
  <rect class="whitebox" x="361" y="276" width="198" height="74"/>
  <text class="box-title" x="460" y="300" text-anchor="middle">相干接收模型</text>
  <text class="formula" x="460" y="323" text-anchor="middle">r[k] = √h · s[k] · e^{jφ[k]} + n[k]</text>
  <text class="formula" x="460" y="344" text-anchor="middle">γ = γ̄ · h</text>

  <path class="data-arrow" d="M302 268 L333 268"/>

  <rect class="outer" x="628" y="136" width="884" height="286"/>
  <text class="section-title" x="1070" y="168" text-anchor="middle">接收端信号处理链：信道估计 → 同步 → 判决</text>

  <rect class="blue" x="662" y="210" width="152" height="86"/>
  <text class="box-title" x="738" y="238" text-anchor="middle">信道估计</text>
  <text class="box-text" x="738" y="262" text-anchor="middle">LS / MMSE / KF</text>
  <text class="formula" x="738" y="285" text-anchor="middle">输出：ĥ, NMSE</text>

  <rect class="blue" x="846" y="210" width="150" height="86"/>
  <text class="box-title" x="921" y="238" text-anchor="middle">均衡与误差传播</text>
  <text class="formula" x="921" y="264" text-anchor="middle">Δh = ĥ - h</text>
  <text class="box-text" x="921" y="286" text-anchor="middle">级联影响分析</text>

  <rect class="orange" x="1030" y="210" width="150" height="86"/>
  <text class="box-title" x="1105" y="238" text-anchor="middle">频偏估计与补偿</text>
  <text class="box-text" x="1105" y="263" text-anchor="middle">FOE · FFT</text>
  <text class="formula" x="1105" y="286" text-anchor="middle">N_fft</text>

  <rect class="orange" x="1214" y="210" width="150" height="86"/>
  <text class="box-title" x="1289" y="238" text-anchor="middle">载波相位恢复</text>
  <text class="box-text" x="1289" y="263" text-anchor="middle">VV / BPS / DPLL</text>
  <text class="formula" x="1289" y="286" text-anchor="middle">M,  ω_n</text>

  <rect class="green" x="1398" y="210" width="82" height="86"/>
  <text class="box-title" x="1439" y="242" text-anchor="middle">符号</text>
  <text class="box-title" x="1439" y="266" text-anchor="middle">判决</text>
  <text class="box-text" x="1439" y="290" text-anchor="middle">BER</text>

  <path class="data-arrow" d="M587 268 L662 253"/>
  <path class="data-arrow" d="M814 253 L846 253"/>
  <path class="data-arrow" d="M996 253 L1030 253"/>
  <path class="data-arrow" d="M1180 253 L1214 253"/>
  <path class="data-arrow" d="M1364 253 L1398 253"/>

  <rect class="whitebox" x="696" y="323" width="260" height="70"/>
  <text class="tag" x="826" y="348" text-anchor="middle">估计精度够不够？</text>
  <text class="box-text" x="826" y="372" text-anchor="middle">BER 对 NMSE 灵敏度</text>

  <rect class="whitebox" x="1160" y="323" width="270" height="70"/>
  <text class="tag" x="1295" y="348" text-anchor="middle">同步方法怎么选怎么配？</text>
  <text class="box-text" x="1295" y="372" text-anchor="middle">性能边界 · 失效机制 · 参数敏感性</text>

  <path class="feedback-arrow" d="M921 296 C908 316, 880 322, 826 323"/>
  <path class="feedback-arrow" d="M1289 296 C1290 312, 1292 316, 1295 323"/>

  <rect class="outer" x="62" y="450" width="1450" height="226"/>
  <text class="section-title" x="787" y="482" text-anchor="middle">仿真分析与设计准则形成</text>

  <rect class="blue" x="105" y="515" width="286" height="110"/>
  <text class="box-title" x="248" y="542" text-anchor="middle">信道估计类实验</text>
  <text class="box-text" x="248" y="568" text-anchor="middle">NMSE vs SNR · 三档湍流</text>
  <text class="box-text" x="248" y="592" text-anchor="middle">受控 NMSE 注入 → BER 退化</text>
  <text class="small" x="248" y="615" text-anchor="middle">LS / MMSE / Kalman</text>

  <rect class="orange" x="437" y="515" width="326" height="110"/>
  <text class="box-title" x="600" y="542" text-anchor="middle">载波同步类实验</text>
  <text class="box-text" x="600" y="568" text-anchor="middle">VV / BPS / DPLL 性能对比</text>
  <text class="box-text" x="600" y="592" text-anchor="middle">M · ω_n · N_fft 参数扫描</text>
  <text class="small" x="600" y="615" text-anchor="middle">BER · 帧失败率</text>

  <rect class="yellow" x="810" y="515" width="312" height="110"/>
  <text class="box-title" x="966" y="542" text-anchor="middle">综合验证</text>
  <text class="box-text" x="966" y="568" text-anchor="middle">完整级联链路</text>
  <text class="box-text" x="966" y="592" text-anchor="middle">信道生成 → 估计 → 均衡 → FOE → CPR → 判决</text>
  <text class="small" x="966" y="615" text-anchor="middle">验证判据与端到端结果一致性</text>

  <rect class="dashed" x="1169" y="515" width="298" height="110"/>
  <text class="box-title" x="1318" y="542" text-anchor="middle">信号处理方法探索</text>
  <text class="box-text" x="1318" y="568" text-anchor="middle">① 准则完整性扩展</text>
  <text class="box-text" x="1318" y="592" text-anchor="middle">② 参数解析设计方法</text>
  <text class="box-text" x="1318" y="616" text-anchor="middle">③ 跨模块联合处理方法</text>

  <path class="control-arrow" d="M391 570 L437 570"/>
  <path class="control-arrow" d="M763 570 L810 570"/>
  <path class="control-arrow" d="M1122 570 L1169 570"/>

  <rect class="yellow" x="104" y="704" width="612" height="92"/>
  <text class="box-title" x="410" y="732" text-anchor="middle">输出一：面向同步的信道估计精度设计准则</text>
  <text class="box-text" x="410" y="758" text-anchor="middle">分湍流条件 / 分调制格式的 NMSE 需求阈值</text>
  <text class="small" x="410" y="782" text-anchor="middle">方法可用性边界：E[1/h] 与 β&lt;1 判据</text>

  <rect class="yellow" x="780" y="704" width="636" height="92"/>
  <text class="box-title" x="1098" y="732" text-anchor="middle">输出二：载波同步方法选择与参数设计准则</text>
  <text class="box-text" x="1098" y="758" text-anchor="middle">按 Gamma-Gamma 参数选择 VV / BPS / DPLL</text>
  <text class="small" x="1098" y="782" text-anchor="middle">推荐参数：M · ω_n · N_fft</text>

  <path class="feedback-arrow" d="M248 625 C255 660, 335 680, 410 704"/>
  <path class="feedback-arrow" d="M600 625 C620 665, 775 683, 966 704"/>
  <path class="feedback-arrow" d="M966 625 C996 656, 1062 675, 1098 704"/>

  <rect class="gray" x="104" y="828" width="1312" height="44"/>
  <text class="box-title" x="760" y="856" text-anchor="middle">底线交付：建立湍流鲁棒的星地相干激光通信接收端分析与设计框架</text>

  <rect class="dashed" x="1442" y="704" width="70" height="168"/>
  <text class="small" x="1477" y="730" text-anchor="middle">可选</text>
  <text class="small" x="1477" y="755" text-anchor="middle">Ch5</text>
  <text class="small" x="1477" y="780" text-anchor="middle">FPGA</text>
  <text class="small" x="1477" y="805" text-anchor="middle">定点</text>
  <text class="small" x="1477" y="830" text-anchor="middle">RTL</text>
  <text class="small" x="1477" y="855" text-anchor="middle">资源</text>
  <path class="control-arrow thin" d="M1416 750 L1442 750"/>

  <rect class="whitebox" x="1264" y="114" width="248" height="58"/>
  <line x1="1282" y1="133" x2="1324" y2="133" class="data-arrow thin"/>
  <text class="legend" x="1334" y="138">信号 / 数据流</text>
  <line x1="1282" y1="153" x2="1324" y2="153" class="control-arrow thin"/>
  <text class="legend" x="1334" y="158">准则 / 驱动关系</text>
  <line x1="1422" y1="133" x2="1464" y2="133" class="feedback-arrow thin"/>
  <text class="legend" x="1474" y="138">反馈 / 验证</text>
  <rect x="1422" y="145" width="42" height="16" rx="4" fill="#f8faf9" stroke="#8ba399" stroke-width="1.2" stroke-dasharray="5 4"/>
  <text class="legend" x="1474" y="158">拟探索 / 可选</text>
</svg>
