candidate_archetypes:
  - {id: U01, ap: AP01, problem: fixed shaping may underperform under GG-tail and domain shift, mechanisms: [GEN, PI, HYB], baseline: equal-net-rate uniform modulation, history_distance: far, evidence_gap: Tx controllability and fair-rate model}
  - {id: U02, ap: AP02, problem: fixed RRC/predistortion can mismatch bandwidth/quantization/front-end distortion, mechanisms: [PI, DU, COMP], baseline: RRC plus analytic predistortion, history_distance: far, evidence_gap: front-end model absent}
  - {id: U03, ap: AP03, problem: fixed pilot placement may be information-inefficient for time-varying Jones channels, mechanisms: [PI, META, RL], baseline: equal-overhead periodic pilots, history_distance: near-D055-not-identical, evidence_gap: frame constraints and direct competitors}
  - {id: U04, ap: AP05, problem: analytic GG plus SOP generator may miss joint rare-tail dynamics, mechanisms: [PI, GEN, BAYES], baseline: canonical generator, history_distance: far, evidence_gap: measured-data anchor}
  - {id: U05, ap: AP04, problem: LS-KF state estimation may degrade with low pilot density and fast SOP, mechanisms: [DU, BAYES, HYB], baseline: equal-pilot LS-KF-EKF, history_distance: near-pilot-Jones, evidence_gap: direct competitor closure}
  - {id: U06, ap: AP04, problem: handcrafted channel representation may not transfer across SNR-fG-SOP, mechanisms: [SSL, EQ, META], baseline: handcrafted statistics, history_distance: far-from-D043-fixed-label, evidence_gap: equivariance object definition}
  - {id: U07, ap: AP06, problem: fixed AGC/ADC range can clip deep dynamic channels or waste resolution, mechanisms: [OCL, RL, HYB], baseline: traditional AGC at same ADC bits, history_distance: far, evidence_gap: ADC and causal-control model}
  - {id: U08, ap: AP07, problem: classic TED-PLL timing jitter may propagate under dual-pol fades, mechanisms: [DU, META, HYB], baseline: Gardner-MM at same loop bandwidth, history_distance: adjacent-only, evidence_gap: reproduce an authentic failure}
  - {id: U09, ap: AP08, problem: segmented FOE may couple poorly to polarization and turbulence dynamics, mechanisms: [SL, PI, DU], baseline: FFT-FOE, history_distance: adjacent-carrier-work, evidence_gap: authentic M-C-A}
  - {id: U10, ap: AP09, problem: CPR cycle slips and lock loss may lack calibrated early warning, mechanisms: [SSL, GEN, BAYES], baseline: VV-BPS-DPLL plus threshold monitor, history_distance: far-from-QDP4-action, evidence_gap: event library}
  - {id: U11, ap: AP10, problem: fixed-weight supervised equalizer lacks unseen-SOP label stability, mechanisms: [SL, EQ, HYB], baseline: standard-CMA plus equal-pilot classical estimator, history_distance: inherits-fixed-ML-swap, evidence_gap: pilot information increment}
  - {id: U12, ap: AP10, problem: CMA-RLS may have slow or unstable adaptation in some valid domains, mechanisms: [DU, META, HYB], baseline: optimized standard-CMA-RLS, history_distance: near-D040-D041, evidence_gap: real failure domain}
  - {id: U13, ap: AP10, problem: offline equalizer may drift under unseen fG-SOP-SNR, mechanisms: [META, OCL, SSL], baseline: frozen-ML plus standard-CMA, history_distance: untested-E3, evidence_gap: forgetting and safe rollback}
  - {id: U14, ap: AP10, problem: blind equalization may need richer non-label supervision than constant modulus, mechanisms: [SSL, UL, EQ], baseline: standard-CMA-MMA, history_distance: inherits-D048-D049-only-monitor, evidence_gap: degenerate-solution proof}
  - {id: U15, ap: AP10, problem: explicit blind costs may not represent multimodal posterior ambiguity, mechanisms: [GEN, BAYES], baseline: CMA plus strongest legal blind ML, history_distance: collision-risk, evidence_gap: distinct mechanism boundary}
  - {id: U16, ap: AP11, problem: canonical DSP may leave context-dependent residual impairment, mechanisms: [SL, BAYES, HYB], baseline: standard-CMA plus simple DSP residual, history_distance: inherits-D044-DEFER, evidence_gap: residual information increment}
  - {id: U17, ap: AP24, problem: useful ML equalizers may exceed latency and compute budgets, mechanisms: [COMP, HYB], baseline: uncompressed model and equal-compute DSP, history_distance: far, evidence_gap: requires a useful teacher first}
  - {id: U18, ap: AP12, problem: serial DSP can amplify cross-module errors, mechanisms: [DU, SL, HYB], baseline: canonical serial chain, history_distance: far-from-single-point-kills, evidence_gap: diagnosability and stable training}
  - {id: U19, ap: AP13, problem: analytic detector may be mismatched to residual Jones/non-Gaussian errors, mechanisms: [SL, BAYES, HYB], baseline: analytic detector with same CSI, history_distance: far, evidence_gap: residual distribution evidence}
  - {id: U20, ap: AP14, problem: analytic LLR may be miscalibrated under residual channel uncertainty, mechanisms: [SL, BAYES, HYB], baseline: analytic LLR plus temperature scaling, history_distance: far, evidence_gap: coded-chain contract}
  - {id: U21, ap: AP15, problem: BP-minsum may underuse structured burst errors and mismatched LLR, mechanisms: [DU, SL, COMP], baseline: same-code same-iteration BP-minsum, history_distance: far, evidence_gap: code choice and net gain}
  - {id: U22, ap: AP16, problem: one-shot demap ignores decoder feedback, mechanisms: [DU, HYB], baseline: BICM plus BP at same iteration budget, history_distance: far, evidence_gap: complexity-benefit ratio}
  - {id: U23, ap: AP17, problem: online BER-GMI cannot be directly observed and thresholds may shift by domain, mechanisms: [SSL, BAYES, OCL], baseline: power-CMA-error threshold, history_distance: inherits-D048-D051, evidence_gap: reliable labels}
  - {id: U24, ap: AP18, problem: high-SOP standard-CMA has observed non-swap BER failures that simple blind thresholds missed, mechanisms: [SL, SSL, UL, BAYES], baseline: standard-CMA plus historical threshold detector, history_distance: changed-training-and-feature-mechanism, evidence_gap: event count and cross-domain validation}
  - {id: U25, ap: AP19, problem: fixed fallback/reset policy may trade recovery against false interventions, mechanisms: [META, RL, BAYES, HYB], baseline: fixed safe policy, history_distance: far-from-killed-QDP4-actions, evidence_gap: causal reward and safety}
  - {id: U26, ap: AP20, problem: fixed CMA step/window may be suboptimal across regimes, mechanisms: [DU, META, OCL, RL], baseline: optimized fixed grid, history_distance: near-clip-freeze-but-new-policy, evidence_gap: causal state and oracle action labels}
  - {id: U27, ap: AP21, problem: models may fail across SNR-modulation-SOP-fG-length shifts, mechanisms: [EQ, META, OCL, GEN], baseline: per-domain retrain and frozen model, history_distance: far, evidence_gap: domain matrix}
  - {id: U28, ap: AP22, problem: simulator-trained models may silently fail on hardware or measured channels, mechanisms: [SSL, META, OCL, GEN, BAYES], baseline: simulator-only training, history_distance: far, evidence_gap: measured dataset}
  - {id: U29, ap: AP23, problem: labels and pilots may be spent on redundant regions rather than tails, mechanisms: [BAYES, RL, SSL], baseline: uniform sampling, history_distance: far, evidence_gap: acquisition-cost model}
  - {id: U30, ap: AP24, problem: ML inference may violate OSL receiver latency-power constraints, mechanisms: [COMP, HYB], baseline: teacher and equal-budget DSP, history_distance: far, evidence_gap: target hardware}
  - {id: U31, ap: AP25, problem: a single receiver configuration may not balance quality-compute-latency across states, mechanisms: [META, RL, OCL, HYB], baseline: best fixed configuration, history_distance: far, evidence_gap: safe contextual state}
  - {id: U32, ap: AP26, problem: fixed diversity combining may waste branch-specific information under fades and polarization rotation, mechanisms: [SL, DU, RL, HYB], baseline: MRC-selection combining at same resources, history_distance: far, evidence_gap: multi-branch model outside current single-aperture anchor}

