    c05_label_from_oracle: "fairness-batch-b01/b01_candidates.py:629-636 (binary label = oracle_pi_ser > 0.3)"
    label_4cat_audit: "fairness-batch-b01r/b01r_detector.py:31-84 (inner_ring/awgn/healthy/ambiguous; binary projection excludes awgn+ambiguous)"
    degradation_onset_block: "fairness-batch-b01r/b01r_detector.py:213-251 (onset = first block z2_ratio < 0.5 sustained 2 blocks after warmup=2)"
    c05_alert_score_warmup_guard: "fairness-batch-b01r/b01r_detector.py:126-206 (alert cannot fire before warmup=2; score=-first_alert_block)"
    lead_time_computation: "fairness-batch-b01r/run_fairness_batch_b01r.py:469-475 (lead_time = onset - alert_block; >0 = detector precedes onset)"
    lead_time_aggregate_minus_5p95: "state/current.yaml:70-78 (DETECTOR_CONVENTIONAL_CEILING; mean -5.95 blocks); reproduced: aggregate over n=21 seeds = mean -5.9524 incl one -113 outlier"
    auroc_ceiling_1p0: "fairness-batch-b01r-v1-synthesis.md:135,142 (min_z2 AUROC=1.000 on snr25-short & snr20-fg100-short); harvest/current.yaml:46-51 (DETECTOR_CONVENTIONAL_CEILING_HARVEST)"
    block0_perfect_separation: "computed from fairness-batch-b01r-v1.json: block-0 z2_ratio perfectly separates collapse on all 6 two-class cells (max_pos 0.303 < min_neg 0.394)"
    zero_gradual_descents: "computed from fairness-batch-b01r-v1.json: 0/37 collapsed seeds transition from healthy(>0.5) to collapsed(<0.4)"
    shared_input_cluster1_2: "portfolio-refresh.v3-fairness.yaml:153,168 (shared_input: causal_cma_trace_features)"
    c02_gru_adapter: "portfolio-refresh.v3-fairness.yaml:102-103 (SSL training loop = GRU + masked reconstruction)"
