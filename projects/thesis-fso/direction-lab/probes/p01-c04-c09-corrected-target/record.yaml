probe_id: p01-c04-c09-corrected-target
question: >-
  Which receiver-visible corrected objective for the affine corrector has an
  input-dependent optimum (survives constant-collapse) vs an input-independent
  constant optimum?
budget: ~5 min compute
exit_condition: >-
  PASS = at least one objective has input-dependent optimum (full < constant-b,
  and optimal A varies across realizations). FAIL = all objectives collapse to
  constant b.
result: >-
  PASS — all THREE candidate corrected objectives have an input-dependent
  optimum and survive the constant-collapse test, on every one of 6 realizations
  (2 held-out cells x seeds 71-73). The reference OLD soft-expected-distance
  loss correctly FAILS (constant-b-only optimum 1.308402 reproduces the
  documented S010/V005/D016 collapse value ~1.30840175), validating the test.

  Per objective (mean const-b-only loss -> mean full (A,b) loss; full strictly
  lower on ALL 6 realizations):
    O1_hard_pseudo_mse   : 0.4515 -> 0.0393   (delta +0.4122; A varies,
                            max-pairwise |dA|=0.121, ||A||=1.40; torch ==
                            closed-form ridge-LS to 6 dp). PASS.
    O2_negentropy_kurtosis: 0.0000 -> -3.9842  (delta +3.9842; A varies,
                            max-pairwise |dA|=5.05, ||A||=3.42). The const-b
                            optimum collapses to b~0 (zero dispersion, loss 0);
                            full achieves strong dispersion minimization. PASS.
                            NOTE: the brief's literal formula E[|z|^2]^2 -
                            E[|z|^4] is UNBOUNDED below under output scaling
                            (loss -> -inf as |A|->inf), so the probe uses the
                            well-posed scale-invariant Godard measure
                            -E[|z|^4]/E[|z|^2]^2 instead (documented in probe.py).
    O3_blind_residual    : 0.4122 -> 0.0000   (delta +0.4122; full recovers the
                            blind-affine closed-form (A,b) EXACTLY, loss->0;
                            A varies, ||A||=1.40 == blind ridge-LS). PASS.

  Identity test (A=I, b=0): finite, non-degenerate for all three objectives
  (O1 ~0.04-0.06, O2 ~-1.4 to -1.5, O3 ~0.0005-0.0025).

  Why the OLD soft loss FAILS: its GLOBAL optimum is the constant A=0,
  b=(+-0.6075 per real coord) at 1.30840175 regardless of input — the const-b
  run reproduces this (1.308402) on all 6 realizations, while a full (A,b) Adam
  run from A=I init stays HIGHER (1.344), i.e. the input-dependent optimum is
  NOT strictly better (it is strictly worse locally), confirming constant
  collapse. The three corrected objectives have NO such constant optimum.

verdict: PASS
