# =============================================================================
# §6 Recommendation
# =============================================================================
recommendation:
  primary: INIT-STRATEGY (rank 1)
  reason: >-
    It is (a) the ONLY untested lever within the CMA trajectory, (b) the most
    consistent with the strongest single piece of evidence in the campaign —
    collapse is DETERMINED AT BLOCK 0 (C05 AUROC=1.000, lead time non-positive),
    which directly implicates the initial conditions, (c) CSI_NONE with no
    legal-input caveat, (d) HALF_DAY with a clean C10 precedent (new runner
    file, no action hook, no blocked axis), and (e) yields a publishable result
    in either direction (positive method, or init-invariant boundary).
  parallel_secondary: REDUCED-CONST-CMA (rank 2)
  reason: >-
    The second cost-function direction distinct from the failed MMA, also
    HALF_DAY and CSI_NONE. Runnable in parallel with rank 1 (independent
    runners, shared anchor/cells/seeds). If rank-1 (init) fails AND rank-2
    (cost) fails, the within-CMA space is exhausted across all three levers
    (cost/init/granularity) and the campaign must escalate to rank-3 (paradigm)
    or rank-4 (sub-problem) as a genuine new contribution line.
  escalation_trigger: >-
    If ranks 1 AND 2 both yield LOCAL_NEGATIVE (collapse init-invariant and
    cost-invariant within the modulus family), the "deep Godard-cost property"
    thesis spine is maximally strengthened and the next investment should be
    rank-3 NONMODULUS_BLIND_EQ — the only direction that can, by construction,
    refute "the collapse is fundamental to modulus-based equalization" by
    removing the modulus cost entirely. That is the single experiment that can
    convert the campaign from a negative-boundary thesis into a positive-method
    thesis.
  what_NOT_to_revive: >-
    Do NOT revive C04/C09 (post-hoc affine — CLOSED), C12 (soft-demapper —
    MECHANISM_NEGATIVE with zero oracle headroom), C13 (pilot-Jones — COLLISION),
    or further C08/C10/C11-style within-CMA tuning variants. The post-equalizer
    and adapt-within-CMA spaces are exhausted by the recurring conclusion.

