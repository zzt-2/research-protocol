schema_version: direction-lab.project-adapter.v1
adapter_id: dual-pol-osl
project_scope: dual-polarization-ground-to-satellite-OSL
profile: profiles/communications.yaml
anchor: anchor.yaml
canonical_baseline:
  identity: standard-CMA
  source_pointer: anchor.yaml::fact_contracts.baseline_identity
  mutable: false

runtime_trace_contract:
  standard_cma_blind_trace:
    source_pointer: projects/thesis-fso/direction-lab/tools/run_b001.py::_default_runner
    fields:
      output_start: {shape: scalar, dtype: int, unit: symbol_index, time: block_start}
      output_end: {shape: scalar, dtype: int, unit: symbol_index, time: block_end_exclusive}
      cm_error: {shape: scalar, dtype: float64, unit: normalized_power_squared, time: block}
      output_power: {shape: scalar, dtype: float64, unit: normalized_power, time: block}
      update_norm: {shape: scalar, dtype: float64, unit: equalizer_weight_norm, time: block}
    forbidden_runtime_inputs: [tx_bits, sX, sY, h, theta, true_jones, fixed_label_ber, pi_ber, future_window]

existing_runner:
  v3: projects/thesis-fso/direction-lab/tools/run_v3.py
  limitation: U24 observational detector path only; do not reuse for action/closed_loop candidates

candidate_triage_scope:
  - P02-U10
  - P03-U19

claim_scope_axes:
  semantics_owner: domain-comms.md
  project_declaration_owner: projects/thesis-fso/direction-lab/adapters/dual-pol-osl.yaml
  project_values:
    modulation_order: [QPSK, 16QAM, other_if_mechanism_relevant]
    SNR_or_operating_region: [low, waterfall_or_transition, high]
    channel_or_state_dynamics: [turbulence_timescale, SOP_rate, carrier_dynamics_when_applicable]
    observation_length: [short_interface_window, long_tracking_window]
    CSI_or_pilot_access: [CSI_NONE, receiver_estimated_CSI, explicit_pilot_budget]
    task_output: [hard_decision, soft_information_or_coded_metric, receiver_action]
  selection_rule: choose only mechanism-relevant axes, but justify every fixed or omitted axis before a DOMAIN-or-higher claim

historical_counterexamples:
  - id: P03_QPSK_SHORT_ZERO_HEADROOM
    evidence: scout/P03-U19-residual-headroom/residual-headroom-probe-status.yaml
    scope: QPSK, CSI_NONE, uncoded hard-decision, frozen short slice
    implication: local zero headroom; no inference about higher-order modulation, longer tracking, receiver-estimated CSI, or coded metrics
  - id: MODULATION_DYNAMICS_LENGTH_ORDERING_SIGNAL
    evidence: .sessions/2026-07-10-dual-pol-osl-groundwork/topic-index.md
    status: HISTORICAL_SIGNAL_REQUIRES_REVALIDATION
    implication: prior results report ordering changes across modulation, SNR, dynamics, and sequence length; future DOMAIN-or-higher exits must address them
  - id: HARD_DECISION_DOES_NOT_CLOSE_CODED_PATH
    evidence: scout/P03-U19-residual-headroom/residual-headroom-probe-status.yaml::implications_for_candidate_map.U20
    implication: zero hard-decision errors do not resolve LLR, GMI, FER, or decoder behavior

reuse_policy:
  old_results: import only with baseline SHA, valid parameter domain, metric contract and source closure
  old_kills: inherit only the original mechanism/implementation/domain/evidence scope
  canonical_baseline: never modified by candidate triage
