    source_value: "10-1000 Hz envelope"
    adaptation: "Three-point sweep {30,100,1000} Hz spanning slow/medium/fast scintillation; 1000 Hz is the stress corner (τ_c≈0.16 ms)."
    rationale: "f_g controls fade dynamics speed via τ_c=1/(2π f_g); sweeping it exercises the CMA-tracking-vs-divergence trade-off central to CB1."
    sensitivity_requirement: "Primary independent variable; reported on the x-axis."
    frozen: false
    shared_across_methods: true
  - parameter_id: P-SOP-RATE
    symbol: sop_rate
    value_range: [4.0e-6, 4.0e-5]
    unit: rad/symbol
    classification: experimental-design
    source_pointer: "sat.1553 §6.3 L745 (baseline ~10^-7 rad/sym) and L777 (tracking degrades >10^-6); code baseline 4e-7 (ber_16qam_vs_fg.py:80)"
    source_value: "baseline 4e-7 rad/sym; stress regime 10^-6-10^-5"
    adaptation: "CB1 sweeps {4e-6, 4e-5} = {10x, 100x} the 4e-7 baseline to probe near/above the CMA tracking edge (sat.1553 L777)."
    rationale: "SOP rotation speed is the second axis (with f_g) stressing CMA tracking; values bracket the L777 degradation onset."
    sensitivity_requirement: "Secondary independent variable; reported per curve."
    frozen: false
    shared_across_methods: true
  - parameter_id: P-GAMMA-BAR
    symbol: gamma_bar
    value: 100
    unit: "dimensionless (linear) = 20 dB"
    classification: experimental-design
    source_pointer: "_dual_pol_channel.py:29 (GAMMA_BAR_DEFAULT); ber_16qam_vs_fg.py:78 (SNR_DB=20 → gamma_bar=100)"
    source_value: 100
    adaptation: "γ̄ = 10^(SNR_dB/10); 20 dB ⇒ 100. Sets AWGN variance σ_n² = 1/(2·γ̄) = 0.005."
    rationale: "Single high-SNR operating point isolates turbulence/SOP effects from AWGN noise floor."
    sensitivity_requirement: "Frozen for CB1 (one SNR point); sensitivity deferred."
    frozen: true
    shared_across_methods: true
  - parameter_id: P-N-SYMBOLS
    symbol: N
    value_range: [512, 8192]
    unit: symbols
    classification: experimental-design
    source_pointer: "_dual_pol_channel.py:10 (N parameter); sat.1553 §6.3 L757 (CMA converges ~10^5 sym — long sequence); short N=512 for transient analysis"
    source_value: "sat.1553 uses 10^7 sym/sim; Qin 2025 block sizes"
    adaptation: "Two lengths: N=8192 (steady-state BER, still below sat.1553's 10^5 convergence for some configs) and N=512 (transient/short-seq stress)."
    rationale: "N controls whether CMA reaches steady state; short N exposes transient divergence."
    sensitivity_requirement: "Reported per series; not a primary axis."
    frozen: false
    shared_across_methods: true
  - parameter_id: P-BLOCK
    symbol: block
    value: 100
    unit: symbols
    classification: experimental-design
    source_pointer: "_gg_time.py:32 (BLOCK from _config); physical basis sat.1553 L167 (τ_c ≫ block·t_s ⇒ quasi-static within block)"
    source_value: 100
    adaptation: "block·t_s = 100·4e-10 = 4e-8 s = 40 ns ≪ τ_c (≥0.16 ms) ⇒ block-constant h is physically valid across the whole f_g sweep."
    rationale: "Sets the GG fade granularity; small enough that many blocks span a coherence time at f_g=1000 Hz."
    sensitivity_requirement: "Frozen; not swept."
    frozen: true
    shared_across_methods: true

  # ---- baseline-algorithm (CMA hyperparameters) ----
