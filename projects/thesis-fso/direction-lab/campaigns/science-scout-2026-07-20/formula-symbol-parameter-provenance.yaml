    unit: "dimensionless (unit power)"
    time_index: "symbol index n = 0..N-1"
    boundary: TX
    source: "sat.1553 §6.1 Eq.(28); code _dual_pol_channel.py:49-51"
    project_adaptation: "QPSK: (±1±j)/√2; 16QAM: (s_i + j s_q)/√10"
    conflict_note: "do not reuse 's' for channel envelope (we use h)"
  - symbol: s_Y
    meaning: "transmitted symbol, Y polarization"
    domain_shape: "complex, shape (N,)"
    unit: "dimensionless"
    time_index: "n = 0..N-1"
    boundary: TX
    source: "sat.1553 §6.1 Eq.(28); _dual_pol_channel.py:53-55"
    conflict_note: "none"
  - symbol: r_X
    meaning: "received sample, X polarization (after channel + AWGN)"
    domain_shape: "complex, shape (N,)"
    unit: "dimensionless"
    time_index: "n = 0..N-1"
    boundary: RX
    source: "sat.1553 Eq.(28); _dual_pol_channel.py:61-63"
    conflict_note: "none"
  - symbol: r_Y
    meaning: "received sample, Y polarization"
    domain_shape: "complex, shape (N,)"
    unit: "dimensionless"
    time_index: "n = 0..N-1"
    boundary: RX
    source: "sat.1553 Eq.(28); _dual_pol_channel.py:64-66"
    conflict_note: "none"
  - symbol: h
    meaning: "Gamma-Gamma fading envelope (irradiance proxy), E[h]=1"
    domain_shape: "real positive, shape (N,)"
    unit: "dimensionless (normalised irradiance)"
    time_index: "block-constant within block, AR(1) across blocks"
    boundary: runtime (channel realisation)
    source: "app12073331 §3 Eq.(5); Andrews & Phillips 2005 Ch.9; _gg_time.py:155"
    project_adaptation: "h = X·Y, X~Gamma(α,1/α), Y~Gamma(β,1/β); block-expanded via np.repeat"
    conflict_note: "formulas-master disambiguates: h is *irradiance/envelope*; do NOT use h for filter taps or channel impulse response. Code uses 'big'/'small' internally for X,Y."
  - symbol: theta
    meaning: "state-of-polarization rotation angle"
    domain_shape: "real, shape (N,)"
    unit: "radian"
    time_index: "theta[n] = sop_rate · n"
    boundary: runtime (channel realisation)
    source: "sat.1553 §6.1 Eq.(51), L740 θ(t)=ωt; _dual_pol_channel.py:57"
    conflict_note: "do NOT confuse with phase-noise θ (sat.1553 §4 Eq.(18)-(20), random walk) — different physical quantity; in code theta is SOP-only"
  - symbol: J
    meaning: "Jones 2x2 SOP rotation matrix"
    domain_shape: "real 2x2, [[cosθ, sinθ],[-sinθ, cosθ]]"
    unit: "dimensionless"
    time_index: "time-varying via θ(t)"
    boundary: runtime (channel)
    source: "sat.1553 §6.1 Eq.(51); _dual_pol_channel.py:58-66 (implicit in cos_t/sin_t)"
    conflict_note: "J here is the *channel* Jones matrix (real rotation); the equalizer uses 4 FIRs w_xx..w_yy (complex), not J"
  - symbol: z_X
    meaning: "CMA equalizer output, X polarization"
    domain_shape: "complex, shape (N,)"
    unit: "dimensionless"
    time_index: "n = 0..N-1"
    boundary: "runtime (equalizer output, mid-DSP)"
    source: "sat.1553 Eq.(28)/(50); _cma.py:123, 151, 156"
    conflict_note: "this is the 'z' in the Godard cost J=E[(R²-|z|²)²]; do NOT reuse z for Rytov log-amplitude (formulas-master §10.6 uses z that way — different scope)"
  - symbol: z_Y
    meaning: "CMA equalizer output, Y polarization"
    domain_shape: "complex, shape (N,)"
    unit: "dimensionless"
    boundary: runtime
    source: "sat.1553 Eq.(28)/(50); _cma.py:124, 152, 157"
    conflict_note: "none"
  - symbol: R² (R2)
    meaning: "Godard constant-modulus radius squared = E[|s|⁴]/E[|s|²]"
    domain_shape: "real scalar"
    unit: "dimensionless"
    boundary: "training (constellation-derived), then frozen at runtime"
    source: "Godard 1980 Eq.(12)-(13); _cma.py:43-52, 74-77"
    values: {QPSK: 1.0, "16QAM": 1.32}
    conflict_note: "we store R² (not R); sat.1553 Eq.(50) also writes R²"
  - symbol: μ (mu, cma_mu)
