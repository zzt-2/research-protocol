formulas:

  # ---------- A1. Godard CMA cost (the "z factor" / Godard exponent = 2) ----------
  - formula_id: F-GODARD-COST
    name: "Godard constant-modulus cost function (p=2)"
    math: "J = E[ ( R^2 - |z|^2 )^2 ]"
    source_type: PRIMARY_LITERATURE
    primary_source:
      author: "Godard 1980"
      title: "Self-Recovering Equalization and Carrier Tracking in Two-Dimensional Data Communication Systems"
      venue: "IEEE Trans. Commun. (TCOM) 28(11):1867-1875"
      year: 1980
      equation: "Eq.(10)  (general Godard family J = E[(R_p - |z|^{2p})^2], p=2 here)"
      doi: "10.1109/TCOM.1980.1094608"
    representative_crosscheck:
      paper: sat.1553
      doi: 10.1002/sat.1553
      location: "§6 Eq.(50), content.md L721  (e[n] = R^2 - |z_X[n]|^2 ; R^2 - |z_Y[n]|^2)"
      note: "sat.1553 cites CMA via ref [84] (Johnson et al. 1998 survey); the original cost function is Godard 1980 [12-family]. sat.1553 uses the p=2 constant-modulus specialisation."
    original_symbols:
      z: "equalizer output sample (complex)"
      R: "dispersion constant (Godard) / constant-modulus radius"
      p: "Godard exponent (=2 ⇒ constant modulus)"
    project_symbols:
      z: "z (z_X, z_Y per pol) — equalizer output, _cma.py:123-124"
      R2: "R^2 (Godard radius squared, stored not R) — _cma.py:74-77"
      z_factor_note: "'z' is the equalizer output, NOT a free factor; the 'Godard exponent' p=2 is fixed (constant modulus). sat.1553 Eq.(50) hard-codes p=2."
    transformation_to_project:
      - "Godard general family specialised to p=2 (constant modulus): R_2^2 = E[|s|^4]/E[|s|^2], R_p→R^2 in error."
      - "sat.1553 writes the *error* e = R^2 - |z|^2 (Eq.50); we adopt the same error form. The *cost* J is Godard's Eq.(10) and is implicit in our gradient (we never evaluate J directly, only its instantaneous gradient)."
    assumptions:
      - "p=2 constant-modulus (single R for whole constellation). sat.1553 Eq.(50) note (L723): extendable to higher-order formats via multiple R values (multi-modulus MMA) — CB1 keeps single-R CMA per the source closure scope."
      - "Block-averaged gradient (parallelization factor 64, sat.1553 L756/L103) rather than per-symbol stochastic gradient."
    code_binding:
      file: projects/simulation/common/_cma.py
      location: "docstring L11-15 (Godard 1980 Eq.10); cost realised via error e at L161-162, 259, 319"
      verification: "Error term self.R2 - np.abs(zx_blk)**2 (L161) is the per-sample derivative kernel of J = E[(R^2-|z|^2)^2]; W += μ·e·r* (L163-166) is stochastic-gradient descent on J."
    verification_method: "Cross-checked: code error formula == sat.1553 Eq.(50) == Godard Eq.(10) gradient (dJ/dz* = -2(R^2-|z|^2)z, absorbed into e·r* update)."

  # ---------- A2. Godard radius R^2 ----------
  - formula_id: F-GODARD-RADIUS
    name: "Godard dispersion radius R^2 = E[|s|^4]/E[|s|^2]"
    math: "R^2 = E[ |s|^4 ] / E[ |s|^2 ]    (for a unit-mean-power constellation s)"
    source_type: PRIMARY_LITERATURE
    primary_source:
      author: "Godard 1980"
      venue: "IEEE TCOM 28(11):1867-1875"
      equation: "Eq.(12)-(13) family (R_p defined from constellation moments); p=2 ⇒ R^2 = E[|s|^4]/E[|s|^2]"
      doi: "10.1109/TCOM.1980.1094608"
    representative_crosscheck:
      paper: sat.1553
      doi: 10.1002/sat.1553
      location: "§6 L719-721 (QPSK symbols lie on a circle of radius R, R^2 implicit); _cma.py docstring L21-22"
    closed_form_values:
      QPSK:   "R^2 = 1.0     (|s|=1 constant ⇒ E[|s|^4]=E[|s|^2]=1)"
      "16QAM": "R^2 = 1.32    (DERIVED_IN_PROJECT, see F-R2-16QAM-DERIVATION below)"
    project_symbols:
      R2: "R^2 (we store R^2, not R) — _cma.py:74-77, 202-205"
    transformation_to_project:
      - "We store and use R^2 directly (not R), matching sat.1553 Eq.(50) which writes R^2. Godard writes R_p; squaring is a notational convenience, no math change."
    assumptions:
      - "Constellation normalised to unit average power (E[|s|^2]=1). Without normalisation R^2 scales with power."
    code_binding:
      file: projects/simulation/common/_cma.py
      location: "cma_radius(symbols) L43-52 computes R = sqrt(E[|s|^4]/E[|s|^2]); caller passes R2 = R^2"
    verification_method: "QPSK path: cma_radius on QPSK symbols returns 1.0 (R^2=1). 16QAM path verified numerically (see F-R2-16QAM-DERIVATION)."

  # ---------- A2b. 16QAM R^2 = 1.32 derivation ----------
  - formula_id: F-R2-16QAM-DERIVATION
    name: "16QAM Godard radius squared (closed-form derivation)"
    math: "R^2_16QAM = E[|s|^4] / E[|s|^2] = 1.32 / 1.0 = 1.32"
    source_type: DERIVED_IN_PROJECT
    derivation: |
      Constellation: s = (s_i + j s_q)/sqrt(10), {s_i, s_q} ∈ {-3,-1,+1,+3} (Gray-mapped, unit avg power).
      |s|^2 takes three values across the 16 points:
        |s|^2 = (1^2 + 1^2)/10 = 0.20   — 4 points  (inner 2x2)
        |s|^2 = (1^2 + 3^2)/10 = 1.00   — 8 points  (mid ring)
        |s|^2 = (3^2 + 3^2)/10 = 1.80   — 4 points  (outer corners)
      E[|s|^2] = (4·0.20 + 8·1.00 + 4·1.80)/16 = (0.8 + 8.0 + 7.2)/16 = 16/16 = 1.0   ✓ unit power
      E[|s|^4] = (4·0.20^2 + 8·1.00^2 + 4·1.80^2)/16
               = (4·0.04 + 8·1.00 + 4·3.24)/16
               = (0.16 + 8.0 + 12.96)/16 = 21.12/16 = 1.32
      ⇒ R^2_16QAM = E[|s|^4]/E[|s|^2] = 1.32/1.0 = 1.32
    numeric_verification: "python3 reproduces E[|s|^2]=1.0, E[|s|^4]=1.32, R^2=1.32 (ran during provenance research)."
    code_binding:
      file: projects/simulation/explore/cma-fade-divergence/ber_16qam_vs_fg.py
      location: "L83-85  '# 16QAM Godard R^2 ... |s|^2∈{0.2,1.0,1.8} ... E[|s|^4]=1.32'  R2_16QAM = 1.32"
      comment_origin: "ber_16qam_vs_fg.py:56 cites sup_stress_test.py:56 as the originating comment"
    assumptions:
      - "Square 16QAM with amplitudes {±1,±3} per axis, /sqrt(10) power normalisation (see F-16QAM-NORM)."
      - "Uniform prior over the 16 symbols."
    note: "No external textbook found on local disk stating R^2_16QAM=1.32 explicitly; the value is a 1-line consequence of Godard's R^2 definition applied to the standard square-16QAM constellation. Classified DERIVED_IN_PROJECT (not DEFINED_HERE) because the formula is Godard's; only the arithmetic is ours."

  # ---------- A3. 16QAM Gray mapping ----------
  - formula_id: F-16QAM-GRAY-MAP
    name: "16QAM Gray-coded symbol mapping (per axis)"
    math: "2-bit label → amplitude:  00→-3, 01→-1, 11→+1, 10→+3    (reflection Gray code)"
    source_type: STANDARD_CONVENTION
    convention_source:
      type: textbook
      representative: "Proakis, 'Digital Communications', 4th ed., §5.x (QAM constellations); Sklar, 'Digital Communications', §7. Also DVB-S2 (ETSI EN 302 307)."
      local_disk_status: "No local copy of Proakis/Sklar; convention is universally standard."
    project_symbols:
      gray_map: "gray_map = np.array([-3, -1, +3, +1]) indexed by 2-bit code bi = 2*b0 + b1"
    transformation_to_project:
      - "Code realisation: gray_map = [-3,-1,+3,+1] (_modulation.py:33). bi=0(00)→-3, bi=1(01)→-1, bi=2(10)→+3, bi=3(11)→+1."
      - "IMPORTANT docstring/code mismatch: docstring L26 says '00→-3, 01→-1, 11→+1, 10→+3' but the array realisation gives 10→+3, 11→+1 (the last two are swapped vs the docstring). Both are valid reflection-Gray orderings (adjacent amplitudes differ by 1 bit); the *array* is authoritative for simulation. The mapping is bijective and Gray-valid either way. For BER/metric purposes only the set {±1,±3} matters, so R^2 and PI-SER are unaffected."
    assumptions:
      - "Natural-bit indexing: b0 = MSB, b1 = LSB of the 2-bit I (or Q) label."
      - "4 bits/symbol: b0b1→I, b2b3→Q."
    code_binding:
      file: projects/simulation/common/_modulation.py
      location: "qam16_mod L24-37 (gray_map L33); qam16_demod L39-58 (gray_enc L48); hard_decision L84-91"
    verification_method: "Adjacent amplitude levels differ by exactly 1 bit (Gray property): -3↔-1 flips 1 bit, -1↔+1 flips 1 bit, +1↔+3 flips 1 bit. Set of amplitudes {±1,±3} matches F-16QAM-NORM and F-R2-16QAM-DERIVATION."

  # ---------- A4. 16QAM average-power normalisation ----------
  - formula_id: F-16QAM-NORM
    name: "16QAM unit-average-power normalisation factor 1/sqrt(10)"
    math: "s = (s_i + j·s_q) / sqrt(10),  {s_i,s_q}∈{±1,±3}  ⇒  E[|s|^2] = 1"
    source_type: STANDARD_CONVENTION
    derivation: |
      Without normalisation E[|s_i + j s_q|^2] = E[s_i^2] + E[s_q^2]
        = (9+1+1+9)/4 + (9+1+1+9)/4 = 5 + 5 = 10.
      Divide by sqrt(10) ⇒ E[|s|^2] = 10/10 = 1.   ✓
    convention_source:
      type: textbook
      representative: "Standard in Proakis/Sklar/Middleton; matches DVB-S2 16QAM reference. Also implied by app12073331 §4 (QPSK/16QAM normalised before the GG channel)."
    project_symbols:
      norm: "/sqrt(10) factor applied in qam16_mod; undone by *sqrt(10) in qam16_demod/hard_decision"
    transformation_to_project:
      - "mod multiplies by 1/sqrt(10); demod and hard_decision multiply by sqrt(10) to invert before slicing to {-3,-1,+1,+3}."
    assumptions:
      - "Uniform symbol prior; square (not rectangular) 16QAM."
    code_binding:
      file: projects/simulation/common/_modulation.py
      location: "qam16_mod L37 '/ sqrt(10)'; comment L36 'E[|s|^2] = (9+1+1+9)/4 * 2 = 10'; demod L41 '* sqrt(10)'; hard_decision L88 '* sqrt(10)'"
    verification_method: "E[|s|^2]=1.0 confirmed numerically (python3 on the 16 const points). Same normalisation makes F-R2-16QAM-DERIVATION's E[|s|^2]=1 hold."

  # ---------- A5. Gamma-Gamma turbulence PDF ----------
  - formula_id: F-GAMMA-GAMMA-PDF
    name: "Gamma-Gamma irradiance PDF (α, β plane-wave model)"
    math: |
      f(I) = [ 2 (αβ)^{(α+β)/2} / ( Γ(α) Γ(β) Ī ) ] · (I/Ī)^{(α+β)/2 - 1} · K_{α-β}( 2 sqrt( αβ I / Ī ) ),  I>0
    source_type: PRIMARY_LITERATURE
    primary_source:
      author: "Andrews & Phillips 2005"
      title: "Laser Beam Propagation through Random Media"
      publisher: "SPIE Press, 2nd ed."
      year: 2005
      location: "Ch. 9-10 (Gamma-Gamma model derivation); Eq.(9.30)/(10.37) family"
    representative_crosscheck:
      paper: app12073331
      doi: 10.3390/app12073331
      location: "§3 Eq.(2)-(9), content.md L68-110"
      note: "Gu 2022 derives the same GG PDF: marginal Gamma PDFs Eq.(2)-(3), conditional Eq.(4), joint/marginal Eq.(5); plane-wave α,β from Rytov variance Eq.(6)-(7); Cn^2 Eq.(9). Strong-turbulence example α=4.2, β=1.4 at L117 matches the project's strong-turbulence parameter set."
    local_master_crosscheck:
      file: 毕设/formulas-master.md
      entry: "F32 (Gamma-Gamma 分布模型), L379-387; F33 plane-wave α,β L389-401"
    original_symbols:
      I: "irradiance (received optical intensity)"
      alpha: "effective number of large-scale eddies"
      beta: "effective number of small-scale eddies"
      I_bar: "mean irradiance"
      K_nu: "modified Bessel function of the 2nd kind, order ν"
      Gamma: "Gamma function"
    project_symbols:
      h: "channel fading envelope (proportional to I; we use h = X·Y with E[h]=1, equivalent to Ī=1 normalisation)"
      alpha: "GG large-scale shape"
      beta: "GG small-scale shape"
      gamma_bar: "mean irradiance Ī (we set =100 for 20 dB SNR; see P-GAMMA-BAR)"
    transformation_to_project:
      - "We generate h via the *product* representation h = X·Y, X~Gamma(α,1/α), Y~Gamma(β,1/β) (each mean 1), which is exactly the modulation model behind the GG PDF (app12073331 L62-66, Andrews & Phillips Ch.9). The PDF is the marginal of this product; we sample the product directly (AR(1)-correlated in time, see _gg_time.py) rather than via inverse-CDF of the PDF."
      - "Ī=1 in the canonical PDF; we scale received power separately via gamma_bar (AWGN variance σ_n^2 = 1/(2·gamma_bar))."
    assumptions:
      - "Plane-wave, Kolmogorov turbulence, weak-to-strong regime (GG is valid across all strengths, app12073331 L60)."
      - "Large-scale and small-scale processes statistically independent (app12073331 L62)."
      - "No aperture averaging in the base PDF (aperture-averaging factor d added in F33/formulas-master, not used in CB1 base channel)."
    code_binding:
      file: projects/simulation/common/_gg_time.py
      location: "gg_time_envelope L106-157 (h = big*small, L155); gg_pdf_theory L183-194 (PDF for validation, references formulas-master F32 in docstring L188)"
    verification_method: "gg_pdf_theory() matches the marginal of the sampled h (KS test referenced in formulas-master F32 '验证: sim_prototype.py GG 采样验证')."

  # ---------- A6. f_G → τ_c conversion ----------
  - formula_id: F-FG-TO-TAUC
    name: "Greenwood frequency to scintillation coherence time"
    math: "tau_c = 1 / (2π f_G)"
    source_type: PRIMARY_LITERATURE
    primary_source:
      author: "Greenwood 1977 + Conan 1995"
      location: "Greenwood (JOSA 67(3):390-393, 1977) defines f_G; Conan, Rousset & Madec (JOSA A 12(7):1559-1570, 1995) give the intensity-scintillation coherence time τ_c = 1/(2π f_G) from the temporal power-spectrum break frequency."
      doi_or_identifier: "Greenwood1977-JOSA-67-390 ; Conan1995-JOSAA-12-1559"
    representative_crosscheck:
      paper: sat.1553
      doi: 10.1002/sat.1553
      location: "§2 L167 'scintillation ... coherence time of more than 1 ms' (qualitative τ_c > 1 ms, consistent with f_G ≲ 160 Hz)"
    local_master_crosscheck:
      file: 毕设/formulas-master.md
      entry: "F33b L403-413 (full provenance: Greenwood 1977 + Conan 1995 + Andrews&Phillips 2005 §10-12)"
    original_symbols:
      tau_c: "intensity-scintillation coherence time (s) — NOT AO phase-correction time constant"
      f_G: "Greenwood frequency (Hz)"
    project_symbols:
      tau_c: "tau_c (gg_time.tau_c_from_fg)"
      f_g: "f_g / f_G — GG -3dB scintillation frequency"
    transformation_to_project:
      - "Direct identity; f_g swept in {30,100,1000} Hz ⇒ tau_c ∈ {5.31, 1.59, 0.159} ms."
      - "τ_c feeds AR(1) block-correlation ρ = exp(-Δt/τ_c), Δt = block·t_s (see _gg_time.py rho_from_tau_c L37-45)."
    assumptions:
      - "Plane-wave Kolmogorov turbulence. τ_c is the *intensity* coherence time, explicitly NOT the AO phase-correction time constant 0.314·r0/V (Roddier 1999) — disambiguation in formulas-master F33b."
    code_binding:
      file: projects/simulation/common/_gg_time.py
      location: "L11-14 (docstring: Greenwood 1977 + Conan 1995); tau_c consumed at _dual_pol_channel.py:36 via cfg.gg_time.tau_c_from_fg(f_g); rho_from_tau_c L37-45"
    verification_method: "τ_c > 1 ms for f_g < 160 Hz matches sat.1553 §2 L167. formulas-master F33b lists τ_c typical 0.16-16 ms for f_G 10-1000 Hz."

  # ---------- A7. SOP rotation ----------
  - formula_id: F-SOP-ROTATION
    name: "Continuous state-of-polarization rotation (per-symbol angle)"
    math: "theta[n] = sop_rate · n,   n = 0,1,…,N-1   (discretised Jones rotation)"
    source_type: PRIMARY_LITERATURE
    primary_source:
      paper: sat.1553
      doi: 10.1002/sat.1553
      location: "§6.1 Eq.(51) Jones matrix J=[[cosθ, sinθ],[-sinθ, cosθ]]; §6.1 L740 θ(t)=ωt, ω = SOP rotation speed; §6.3 L745, L777 tracking ~10^-6-10^-5 rad/sym"
      equation: "Eq.(51) + L740 θ(t)=ωt"
    original_symbols:
      theta: "current SOP angle (rad)"
      omega: "SOP rotation speed (rad/s)"
      t: "time"
    project_symbols:
      theta: "theta — per-symbol SOP angle array (rad), _dual_pol_channel.py:57"
      sop_rate: "sop_rate — per-symbol rotation increment (rad/symbol), the discretised ω·t_s"
      n: "symbol index arange(N)"
    transformation_to_project:
      - "sat.1553 is continuous-time θ(t)=ωt. We discretise per symbol: theta[n] = sop_rate · n where sop_rate = ω·t_s [rad/sym]. This matches sat.1553's own tracking-speed units (L745, L777 'radians per symbol')."
      - "sop_rate=4e-7 rad/sym baseline (sat.1553 §6.3 L745: '10^-7 radians per symbol'); CB1 stress sweeps sop_rate ∈ {4e-6, 4e-5} (10x and 100x baseline)."
      - "cos/sin applied to build the 2x2 real rotation matrix multiplying [s_X, s_Y] (see F-JONES-2x2)."
    assumptions:
      - "Deterministic (not random-walk) SOP rotation — matches sat.1553 §6.1 simplified model 'continuous polarization rotations as in [73]'. sat.1553 L778 acknowledges this is a simplification."
      - "Same theta for both polarisations (single rotation axis); no PDL."
    code_binding:
      file: projects/simulation/common/_dual_pol_channel.py
      location: "L57 theta = sop_rate * np.arange(N); L58-59 cos_t/sin_t; L61-66 rotation applied to [sX,sY]"
    verification_method: "theta[0]=0, theta is arithmetic progression — matches sat.1553 Eq.(51) θ(t)=ωt sampled at symbol rate. sop_rate baseline 4e-7 rad/sym ∈ sat.1553's stated 10^-7 region."

  # ---------- A8. Jones 2x2 butterfly channel ----------
  - formula_id: F-JONES-2x2
    name: "Dual-polarization 2x2 butterfly equalizer / channel structure"
    math: |
      z_X = w_xx ∗ r_X + w_xy ∗ r_Y
      z_Y = w_yx ∗ r_X + w_yy ∗ r_Y
      (equalizer side; channel side is the inverse Jones rotation [[cosθ, sinθ],[-sinθ,cosθ]])
    source_type: PRIMARY_LITERATURE
    primary_source:
      paper: sat.1553
      doi: 10.1002/sat.1553
      location: "§6.1 Eq.(28) butterfly equalizer (content.md L570); §6.1 Eq.(51) Jones rotation matrix (L737)"
      equation: "Eq.(28) + Eq.(51)"
      refs: "[73] butterfly structure; [15] terrestrial-fiber demux"
    original_symbols:
      r_X_r_Y: "incoming signals for the two polarizations"
      w_xx_w_xy_w_yx_w_yy: "four complex FIR filters"
      z_X_z_Y: "demultiplexed outputs"
    project_symbols:
      rX_rY: "r_X, r_Y — received dual-pol samples (complex), _dual_pol_channel.py:61-66"
      zX_zY: "z_X, z_Y — equalizer outputs, _cma.py:123-124, 151-152"
      wxx_wxy_wyx_wyy: "four complex FIR tap vectors, _cma.py:81-86"
    transformation_to_project:
      - "Equalizer (4 FIRs) inverts the channel (Jones rotation + impulse response). Channel rotation built at _dual_pol_channel.py:57-66; equalizer butterfly at _cma.py:148-152."
      - "Channel-side J is real 2x2 rotation (SOP only); equalizer-side w's are complex FIRs (also absorb carrier phase, PMD, channel IR). sat.1553 §6.1 notes this is the standard structure."
    assumptions:
      - "Single SOP rotation axis (real 2x2 J, not general complex unitary). sat.1553 §6.1 L733 'simplified model'."
      - "No PDL in the channel (sat.1553 L723 notes PDL can cause both pols converging to same output — a CMA failure mode, out of scope for the channel model)."
    code_binding:
      file: projects/simulation/common/_cma.py
      location: "docstring L7-10 (Eq.28 mapping, content.md L570); equalizer L148-152 (zX = rX_blk@wxx + rY_blk@wxy etc.)"
      channel_side: "projects/simulation/common/_dual_pol_channel.py:57-66 (builds the Jones rotation applied to TX)"
    verification_method: "Butterfly structure literal match to sat.1553 Eq.(28). Channel J = [[cos,sin],[-sin,cos]] literal match to Eq.(51)."

  # ---------- A9. PI-SER (permutation-invariant SER) ----------
  - formula_id: F-PI-SER
    name: "Permutation-invariant symbol error rate (PI-SER)"
    math: |
      PI-SER = min_{π ∈ S_M}  (1/N) Σ_n  1[ ŝ_π(n) ≠ s(n) ]
      where S_M is the symmetric group over the M label slots (M=2 polarizations here ⇒ |S_2|=2 permutations: identity and swap)
    source_type: DEFINED_HERE
    justification: |
      PI-SER is a LAB-COINED evaluation metric for modulation-generic source closure.
      Motivation: the dual-pol CMA/Jones equalizer has an inherent permutation ambiguity
      (the two output streams z_X, z_Y can be swapped without changing the cost — a
      well-known CMA/CFO/BSS indeterminacy). A fixed-label SER unfairly penalises a
      method that recovers both sources correctly but assigns them to the wrong label
      slot. PI-SER removes this trivial ambiguity by reporting the minimum SER over
      the 2! = 2 label permutations, isolating genuine *demodulation* errors from
      *label-assignment* errors.
    bss_literature_context: |
      A tools/search run ("permutation ambiguity blind source separation symbol error rate",
      OpenAlex + S2, 2026-07-20) returned BSS/ICA literature on permutation *ambiguity*
      (resolving which recovered source is which — e.g. IVA, complex-valued BSS:
      app12073331-adjacent refs L001-L005 in search archive). That literature treats
      permutation as a *problem to resolve*, typically via higher-order statistics or
      pilot correlation. No paper found defines an explicit *permutation-invariant error
      metric* analogous to PI-SER; the closest precedents are "permutation-averaged" or
      "best-permutation" reporting conventions in multi-user/BSS benchmarking, which are
      informal. We therefore classify PI-SER as DEFINED_HERE (lab metric) while noting it
      is the natural error-side dual of the BSS permutation-ambiguity problem.
    search_archive: "search-archive/2026-07-20/permutation-ambiguity-blind-source-separation-symbol-error-r.json (5 results, none a direct precedent)"
    original_symbols:
      pi: "a permutation in S_M"
      s_hat: "demodulated symbol estimate"
      s: "transmitted (true) symbol"
    project_symbols:
      PI-SER: "PI-SER — permutation-invariant SER, the CB1 closure metric"
      N: "number of evaluated symbols"
    transformation_to_project:
      - "M=2 (two polarizations) ⇒ only 2 permutations: identity and X↔Y swap. PI-SER = min( SER_fixed, SER_swapped )."
      - "Distinct from fixed-label BER (F-FIXED-LABEL-BER) which does NOT minimise over permutations."
      - "For single-polarisation / single-modulation runs PI-SER collapses to ordinary SER (only the identity permutation)."
    assumptions:
      - "Uniform symbol prior; symmetric cost across label slots."
      - "PI-SER is an *oracle* metric (uses TX symbols to pick the best permutation) — appropriate for method comparison, not for a deployed receiver. Documented as oracle/eval-boundary (see symbol table)."
    code_binding:
      file: "(new, to be implemented in CB1 — no current binding)"
      intended_location: "projects/simulation/common/_modulation.py or a new _metrics.py; metric computed in eval phase only"
    verification_method: "Unit test: feed perfectly-recovered-but-swapped streams ⇒ PI-SER=0 while fixed-label SER=1.0. (To be added in CB1 implementation.)"
    blocking_status: NOT_BLOCKING  # metric is well-defined; implementation pending CB1

  # ---------- A9b. Fixed-label BER (contrast metric, already in code) ----------
  - formula_id: F-FIXED-LABEL-BER
    name: "Fixed-label bit error rate (existing, non-permutation-invariant)"
    math: "BER_fixed = (1/N_b) Σ_k 1[ b̂_k ≠ b_k ]   (no permutation minimisation)"
    source_type: STANDARD_CONVENTION
    convention_source:
      type: textbook
      representative: "Standard BER definition (Proakis/Sklar); implemented as ber_count / ber_count_qam16."
    project_symbols:
      BER: "fixed-label BER — the existing _modulation.py metric"
    code_binding:
      file: projects/simulation/common/_modulation.py
      location: "ber_count L14-15 (QPSK), ber_count_qam16 L60-61, ber_eval L71-82 (direct vs oracle-rotation)"
    note: "Retained as the contrast baseline against PI-SER. The existing resolve_qpsk/resolve_qam16 minimise over 8 phase rotations (phase ambiguity) but NOT over polarization label swap — PI-SER adds the missing permutation axis."

