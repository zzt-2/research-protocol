# Harvest Addendum v3 — B01-R Correction Batch (2026-07-21)
# Supersedes nothing in v1/v2 (those entries remain valid); adds H029-H034.
# Source: fairness-batch-b01r/artifacts/fairness-batch-b01r-v1-synthesis.md

schema_version: direction-lab.harvest.v3-b01r
campaign_id: science-scout-2026-07-20.dual-pol-osl
batch: fairness-batch-b01r
date: 2026-07-21
verdict: B_B01R_FAIRNESS_SURVIVES_BUT_DETECTOR_TARGET_NOT_READY

harvest:

  - id: H029
    category: BASELINE_ADJUDICATION
    subcategory: rigorous_fairness_extension
    content: >-
      Under a no-leakage seed split (tuning [11-15], test [21-30]) with a
      validation-optimal fixed-μ CMA (μ=0.01, the comparator B01 never
      ran), the CB1 16QAM inner-ring collapse headroom remains on 6/7
      held-out cells. Only the AWGN-floor cell (snr05-short) closes.
      Fixed-μ CMA significantly beats the frozen-μ anchor on 7/7 cells
      (paired bootstrap CI excludes 0). Extends H022/H023 with the
      genuine fixed-μ comparator.
    evidence_pointer: fairness-batch-b01r/artifacts/fairness-batch-b01r-v1.json#paired_cis_held_out
    claim_ceiling: LOCAL_RESULT_SLICE
    thesis_spine_candidate: secondary_fairness_closure_evidence

  - id: H030
    category: FAILURE_MECHANISM
    subcategory: detector_target_not_ready
    content: >-
      The binary oracle_pi_ser > 0.3 collapse label (B01) conflates
      inner-ring recoverable collapse with AWGN-dominated error. A
      4-category audit (inner-ring/recoverable, AWGN-dominated, healthy,
      ambiguous) shows only 14/110 seeds (12.7%) are true inner-ring-
      recoverable collapses, and ZERO are in held-out long cells. A B02
      ML detector targeting "collapse" is therefore not viable without
      additional label infrastructure (richer oracle class, larger test
      seed budget, or representation learning).
    evidence_pointer: fairness-batch-b01r/artifacts/fairness-batch-b01r-v1.json#cells[*].aggregate.label_4cat_counts
    claim_ceiling: LOCAL_RESULT_SLICE
    thesis_spine_candidate: secondary_detector_label_audit_lesson

  - id: H031
    category: METHOD_SIGNAL
    subcategory: c11_scoped_honestly
    content: >-
      C11 (CMA + DD-LMS) significantly beats the frozen-μ anchor on 4/7
      held-out cells (paired bootstrap CI excludes 0): 3 short cells
      (snr15/snr25/snr20-fg100) + 1 long cell (snr15-fg1000). BUT |Δ| ≤
      0.026 PI-SER and headroom remains ≥ 6× MDE everywhere. The
      improvement is on AWGN-dominated / ambiguous regimes, NOT on
      inner-ring collapse (no held-out long cell has an inner-ring
      seed). The C11 contribution is therefore best framed as a modest
      DD-LMS refinement of AWGN/ambiguous residuals, not a collapse
      recovery.
    evidence_pointer: fairness-batch-b01r/artifacts/fairness-batch-b01r-v1.json#paired_cis_held_out
    claim_ceiling: LOCAL_RESULT_SLICE
    thesis_spine_candidate: secondary_c11_modest_refinement

  - id: H032
    category: EVALUATION_INSIGHT
    subcategory: single_class_auroc_honesty
    content: >-
      Single-class cells must report AUROC = NA/UNDEFINED, not 0.5. In
      this batch, 5 of 7 held-out cells are single-class under the
      strict binary projection (collapse vs healthy). Reporting these
      as 0.5 (as B01 did) inflates apparent detector coverage and
      misrepresents chance-level performance as a meaningful baseline.
    evidence_pointer: fairness-batch-b01r/artifacts/fairness-batch-b01r-v1-synthesis.md#section-5
    claim_ceiling: EVALUATION_INSIGHT
    thesis_spine_candidate: writing_evaluation_methodology

  - id: H033
    category: EVALUATION_INSIGHT
    subcategory: no_leakage_split
    content: >-
      Tuning [11-15] ∩ test [21-30] = ∅ is the minimum bar for honest
      evaluation. B01's leaky overlap (seeds 11-15 in both) was a
      silent validity flaw. Paired bootstrap CIs over test seeds give
      honest uncertainty; without them, small Δ (e.g. C11's 0.01)
      cannot be distinguished from noise. Future Scout/Sandbox batches
      must (a) seed-disjoint tuning vs test, (b) report paired CIs on
      all claimed method-beats-baseline statements.
    evidence_pointer: fairness-batch-b01r/batch-contract.v1.yaml#tuning_validation_split
    claim_ceiling: EVALUATION_INSIGHT
    thesis_spine_candidate: writing_evaluation_methodology

  - id: H034
    category: REUSABLE_ASSET
    subcategory: b01r_infrastructure
    content: >-
      The B01-R runner + detector module (4-category label audit,
      paired bootstrap CI, real detector metrics including PR-AUC,
      recall@5%FPR, false-alarm, degradation onset, warning lead time,
      Brier, ECE) is reusable fairness-batch infrastructure for any
      future detector or equalization work in this project. The
      no-leakage seed split pattern and the parameter-dependent detector
      score pattern are generalisable anti-overreach guards.
    evidence_pointer: fairness-batch-b01r/run_fairness_batch_b01r.py + b01r_detector.py
    claim_ceiling: REUSABLE_ASSET
    thesis_spine_candidate: infrastructure_reuse

rotation:
  next_action: >-
    VERDICT B triggers automatic rotation (per user prompt §九). Two
    legal paths: (1) stay on equalizer side — exploit C11's small
    significant improvement and fixed-μ CMA's dominance to test a
    learned corrector (C04/C09) against the fixed-μ CMA comparator;
    (2) rotate to a different mechanism family — C13 pilot-aided or
    C12 coded (both INFRASTRUCTURE_BLOCKED, unblockable with bounded
    adapters). The detector family (C01/C02/C06) is paused pending
    credible label infrastructure.
  b02_status: NOT_AUTHORIZED_pending_label_infra
