  - id: H011
    category: FAILURE_MECHANISM
    finding: >-
      standard-CMA Godard-with-z on 16QAM (R^2=1.32) exhibits a bimodal
      convergence failure: on ~50% of seeds at SNR >= 15 dB the equalizer
      collapses to the inner 16QAM ring (|z|^2 -> 0.2), producing per-seed
      PI-SER ~0.67-0.78, while the other ~50% converge normally (PI-SER=0).
      The collapse is NOT caught by the existing divergence criteria in
      _cma.py (weight-norm and amplitude thresholds) because the weights
      stay near init norm; it requires an E[|z|^2] << R^2 signal to detect.
      This is the U19 residual-aware detection signal — CMA trace features
      carry clear collapse signatures.
    evidence_scope: >-
      16QAM, SNR 15-25 dB, 10 paired seeds per cell. Per-seed collapse
      pattern independently verified at snr=25 (seeds 12,16,17,19,20 collapse;
      11,13,14,15,18 do not).
    claim_ceiling: SLICE
    artifact_pointers:
      - projects/thesis-fso/direction-lab/scout/cb1-modulation-generic-closure/baseline-atlas/artifacts/cb1-baseline-atlas-v1.json
    related: [standard-CMA, 16QAM, U19, U24, inner-ring-collapse, divergence-detection]
    thesis_destination: >-
      Results section (baseline failure boundary); Discussion (why modulus
      mismatch causes collapse); Limitations (current divergence criteria
      miss this mode).
    confidence: HIGH
    follow_up: >-
      Design ML Scout candidates that detect inner-ring collapse from CMA
      trace features (output power, weight-norm derivative, |z|^2 vs R^2
      ratio). Existing _cma.py divergence thresholds need an E[|z|^2] criterion
      to catch this mode (infrastructure improvement, not a result).
    status: HARVESTED

