  - id: H014
    category: EVALUATION_INSIGHT
    finding: >-
      The PI-SER evaluator for 16QAM must consider 4 quadrant rotations
      ({+1,+j,-1,-j} — the 16QAM 90-degree rotational symmetry), NOT the 8
      rotations used for 8PSK. Combined with the 2! stream permutation this
      gives 8 candidate assignments (not 16). Using 8 rotations would
      over-count and underestimate PI-SER. The fixed-label SER (no rotation
      search, identity assignment) should be reported alongside PI-SER per
      the metric contract.
    evidence_scope: 16QAM evaluator design (CB1)
    claim_ceiling: CONTRACT
    artifact_pointers:
      - projects/thesis-fso/direction-lab/scout/cb1-modulation-generic-closure/baseline-atlas/cb1_evaluator.py
    related: [PI-SER, 16QAM, metric-contract, evaluator-design]
    thesis_destination: Evaluation design section
    confidence: HIGH
    follow_up: >-
      Carry this convention forward to any 16QAM Scout/Sandbox. Document in
      formula-symbol-parameter-provenance.yaml (PI-SER entry).
    status: HARVESTED

