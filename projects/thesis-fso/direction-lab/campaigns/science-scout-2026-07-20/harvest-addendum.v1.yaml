  - id: H010
    category: POSITIVE_MECHANISM_SIGNAL
    finding: >-
      On the CB1 modulation-generic closure (QPSK+16QAM, hash-bound), the
      strongest legal non-ML baseline (standard-CMA Godard-with-z +
      nearest-16QAM hard decision) leaves large measurable PI-SER headroom
