  verdict: CONFIRM
  verified_claims:
    - QPSK anchor PI-SER=0.0 reproduces P03 v1 exactly (PASS)
    - 16QAM headroom ≥ MDE on tested cells (snr=20: 0.3117, snr=25: 0.3328, snr=5: 0.0)
