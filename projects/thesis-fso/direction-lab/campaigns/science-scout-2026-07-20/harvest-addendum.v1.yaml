      standard-CMA collapsing to the inner 16QAM ring on ~50% of seeds at
      SNR >= 15 dB; the oracle affine (scoring-only Kill tool) recovers
      collapsed seeds to PI-SER=0.0, confirming the gap is closable in
      principle.
    evidence_scope: >-
      CB1 closure, 16QAM, SNR sweep 5-25 dB, f_g 30-1000 Hz, sop 4e-6/4e-5,
      short (512) and long (8192) observation, CSI_NONE, uncoded hard
      decision, 10 paired seeds per cell. QPSK anchor reproduces P03 v1.
    claim_ceiling: SLICE  # runnable 16QAM representative subdomain; DOMAIN needs other axes closed
    artifact_pointers:
