# === Cross-cutting re-clusterings ===
cross_cutting_reclusterings:
  - id: RC1_modulation_generic_coded_closure
    members: [U19, U20, U34, U39, U47]
    shared_capability: coded-truth-strict input contract + decoder-extrinsic feedback interface
    why_more_informative: >-
      Spans families F03/F04/F05 and exposes the same legal-label boundary;
      unlocks coded claim ceiling (currently blocked). Depends on bundle-1
      (modulation-generic) and bundle-2 (coded evaluator).
  - id: RC2_causal_state_abstention_controller
    members: [U23, U24, U40, U41, U42, U43]
    shared_capability: causal representation + calibrated uncertainty + fixed safe fallback
    why_more_informative: >-
      Unifies monitoring/control across detector, fallback, and resource
      scheduling. U23/U24 already proposed two-head; extends to U42/U43.
      Requires no new actuator, only state/uncertainty contract.
  - id: RC3_pilot_aware_jones_inversion_stabilization
    members: [U03, U05, U35, U36, U37, U50, U52]
    shared_capability: block-pilot Jones estimator + overhead-stability contract
    why_more_informative: >-
      Consolidates pilot-Jones lineage into one testable closure rather than
      scattered archetypes. Inherits D055 narrowed scope.
  - id: RC4_test_time_adaptation_with_rollback
    members: [U13, U27, U28, U40, U42]
    shared_capability: online TTA with safe rollback
    why_more_informative: >-
      Cuts across F03/F05/F06; addresses D032's deferred online mechanisms
      with a safe-rollback constraint.

