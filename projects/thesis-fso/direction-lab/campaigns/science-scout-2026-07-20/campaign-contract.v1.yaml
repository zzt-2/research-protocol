# === Scientific goal (scoped, not formal promotion) ===
scientific_goal: >-
  Within the dual-pol ground-to-satellite OSL receiver chain, identify whether
  any legal ML information increment has a measurable, mechanism-relevant
  headroom region against the strongest legal same-information non-ML baseline,
  on an expanded runnable domain that closes at least one of the three
  INFRASTRUCTURE_BLOCKED axes (16QAM modulation, receiver-estimated CSI, or
  soft/coded output). Produce scoped scientific harvest (positive mechanism
  signals, scoped negatives, baseline failure boundaries, metric/evaluator
  insights, formula/parameter provenance, reusable runners, infrastructure
  gaps, figure seeds, writable methods/limitations paragraphs, future
  experiment designs) without auto-promoting to formal Groundwork / Contract /
  Execute or paper claims.

