# === Claim ceilings (per-level, pre-registered) ===
claim_ceilings:
  CELL: LOCAL_RESULT
  SLICE: LOCAL_RESULT
  DOMAIN: UNRESOLVED_unless_blocked_axes_closed_and_scope_certificate_issued
  CANDIDATE: OPEN_until_mechanism_proof_and_legal_comparator
  FAMILY: OPEN_until_mechanism_proof
  FORMAL_PROMOTION: BLOCKED_requires_user_strategy_decision

# === Statistical pre-registration (hard gate before any Atlas run) ===
statistical_preregistration_template:
  primary_metric: PI-SER (permutation-invariant symbol error rate)
  secondary_metric: fixed-label SER (swap-aware complement)
  MDE: 0.005_per_symbol
  MDE_rationale: >-
    Below this, a learned detector's training/evaluation budget cannot
    distinguish a real mechanism from implementation noise. Inherited from
    P03 Stage A contract; may be revisited ONLY if a new mechanism family
    plausibly produces smaller per-symbol effects AND a paired-seed power
    analysis supports a smaller MDE.
  zero_error_confidence: rule_of_three_one_sided_95pc_upper_bound
  sequential_sampling_budget: 10_to_40_paired_seeds
  insufficient_sensitivity_fallback: >-
    If every cell stays zero-error with rule-of-three UB > MDE at max budget,
    mark INSUFFICIENT_SENSITIVITY, do not claim LOCAL_NEGATIVE-as-baseline-perfect.
  oracle_role: Kill_tool_only_at_Step4a_dimension_D_per_FR21; never a Go baseline per FR25

# === Rotation policy (continuous progress) ===
rotation_policy:
  auto_rotate_without_asking_user_on:
    - single_candidate_failure
    - single_cell_no_headroom
    - local_interface_missing
    - single_model_does_not_beat_baseline
    - reviewer_rejects_local_synthesis
    - bounded_shared_repair_needed
    - single_capability_bundle_judged_low_leverage
  escalate_to_user_only_on:
    - change_dual_pol_ground_to_satellite_OSL_core_scenario
    - choose_formal_paper_main_line
    - large_scale_infrastructure_or_compute_investment
    - all_legal_shared_capabilities_and_candidates_evidence_backed_exhausted
    - provenance_problem_with_no_safe_handling
    - prepare_to_promote_from_Scout_or_Sandbox_to_formal_GW_Contract_Execute

