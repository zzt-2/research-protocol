project_id: thesis-fso.dual-pol-osl.direction-lab.read-only-preview.v1
formal_goal:
  statement: >-
    Systematically identify whether machine learning provides a real, legally
    comparable information increment anywhere in the complete dual-polarization
    ground-to-satellite OSL receiver chain.
  contribution_scope:
    - receiver algorithm or bounded mechanism under a legal standard-CMA baseline
    - adaptive or robust method tied to an explicit operating axis
    - performance boundary or scoped negative-result study
    - reusable benchmark, evaluator, runner, or evidence protocol that unlocks a scientific comparison
  thesis_constraints:
    - sandbox or Scout governance success is not formal scientific progress
    - B001-B003 numbers are exploratory-only and cannot enter thesis or paper materials automatically
    - fixed-label BER and permutation-invariant BER remain separate
    - blocked axes are not negative evidence
    - claim ceiling is the smallest evidence-backed level
  authorized_actions:
    - READ_ONLY_MIGRATION_PREVIEW
  prohibited_actions:
    - start B004 or any new Sandbox batch
    - run any new scientific experiment or train P03 ML
    - modify or rerun protected history, baseline, runner, canonical state, completion events, or receipts
    - create a Queue, Registry, promotion, formal Groundwork, Contract, thesis, or paper claim
    - select a new scientific direction in this migration task
anchor:
  scenario: dual-polarization ground-to-satellite OSL under Gamma-Gamma turbulence and SOP dynamics
  baseline_component: baseline.standard_cma.godard_z
  metrics:
    - fixed_label_ber
    - permutation_invariant_ber
  parameter_sources:
    - name: baseline_identity_and_forbidden_aliases
      pointer: projects/thesis-fso/direction-lab/anchor.yaml
    - name: standard_cma_frozen_implementation
      pointer: projects/simulation/explore/cma-fade-divergence/prompt013_swap_mechanism_q2.py
    - name: shared_dual_pol_channel
      pointer: projects/simulation/common/_dual_pol_channel.py
    - name: metric_contract
      pointer: .sessions/2026-07-10-dual-pol-osl-groundwork/decisions.md
  known_limitations:
    - current-CMA/no-z and common._cma.CMAEqualizer-as-standard are forbidden aliases
    - fixed-label and permutation-invariant metrics are not interchangeable
    - current frozen P03 closure supports QPSK, CSI_NONE, and uncoded hard decision only
    - B001-B003 and Atlas are sandbox/scout evidence with no formal promotion effect
    - tracked receipts and projections exist, but B001-B003 raw artifacts are absent from this checkout
    - anchor.yaml embedded source hashes are historical rather than fresh migration hashes
  evidence_status: VALID
