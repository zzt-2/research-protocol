score_scale: 1-low-to-5-high
score_semantics:
  problem_truth: 5 means direct foundation evidence of a current failure/problem
  ml_information_increment: 5 means ML consumes useful information unavailable to the traditional rule
  baseline_legality: 5 means a strong, same-budget canonical comparator exists
  novelty: 5 means low known collision risk; no novelty claim is made before literature closure
  improvement_space: 5 means large plausible headroom with a falsifiable mechanism
  implementation_cost: 5 means low cost
  evidence_readiness: 5 means small evidence gap
  history_distance: 5 means far from an exact historical dead end
  paper_contribution: 5 means plausible method contribution if later gates pass
