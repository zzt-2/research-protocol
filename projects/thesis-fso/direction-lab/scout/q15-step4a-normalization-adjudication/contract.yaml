  C: "dual-pol 16QAM receiver produces low-power inner-ring shell collapse on a subset of realizations/initializations"
  A: "conventional methods lack a receiver-visible collapse detector + safe identity fallback; or their fixed normalization cannot distinguish healthy vs collapsed output"
  output_form: "prefix-gated identity / monotone radius calibration policy (post-CMA frozen output map + identity fallback)"
  criteria_status: "1 PASS, 2 PARTIAL (to be closed empirically here), 3 PASS, 4 PASS"

