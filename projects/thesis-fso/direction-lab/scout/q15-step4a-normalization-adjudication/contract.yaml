# =============================================================================
# Q15 Step 4a Terminal Adjudication — Correct-Normalization comparator
#
# Schema: q15.step4a-normalization-adjudication.v1
# Authority: T023 (CANDIDATE_FORMALIZATION, CP021, epoch 53);
#   source decision formal D039 / live D030; accepted T022 = STEP3_PENDING_STEP35.
# Date: 2026-07-28
# Claim ceiling: STEP4A_RECOMMENDATION_READY or Q15_ABSORBED_BY_CONVENTIONAL_NORMALIZATION_NO_GO
#
# WHY THIS BATCH EXISTS (TL;DR)
#   V056/D030 found T020's M1 multiplies a COMPLEX signal by a POWER RATIO
#   (scale = E|s|^2 / E|z|^2 applied as scale*z). The correct complex amplitude
#   multiplier a satisfies |a|^2 = Ps/Pz, so a = sqrt(Ps/Pz). The evaluator
#   (cb1_evaluator.evaluate_dual_16qam) does an 8-way rotation {+1,+j,-1,-j} x
#   stream-permutation search + nearest-16QAM hard decision, which CANNOT
#   compensate an arbitrary magnitude scale (rotations are unit-modulus). So
#   M1's wrong scale over-corrects a collapsed stream by 1/c instead of 1.
#   This makes M4's "DIAGNOSTIC_METHOD_SIGNAL" suspect: M4's gate selects
#   identity on healthy prefixes and M2_transport on collapsed prefixes, but
#   M2_transport is a monotone radius MAP, not a pure scale. The open question
#   is whether a CORRECT pooled/per-pol sqrt-RMS normalization (the cheapest
#   conventional comparator) absorbs the M4 gain entirely.
#   This batch answers that with ONE bounded fair comparison. Negative result
#   => Q15 exits (NO-GO); positive => STEP4A_RECOMMENDATION_READY.
# =============================================================================

# === THEORETICAL EXPECTATION (written BEFORE any seed) ===
# Given z = a_true * s + noise, where |a_true|^2 = Pz/Ps maps received power Pz
# to target 16QAM power Ps (E|s|^2 = 1 for avg-power-normalized 16QAM):
#   - prefix power estimate: Pz_hat = robust_mean(|z_prefix|^2)
#   - to recover the constellation, the complex multiplier must satisfy
#     |a|^2 * Pz = Ps  =>  a = sqrt(Ps / Pz_hat).
#   - T020 M1 used scale = Ps/Pz_hat (= a^2) and multiplied scale*z; this
#     yields a^2 * z = a^2 * a_true * s, whose AMPLITUDE is a^2*|a_true| = a^2/a
#     (since |a_true|=1/a), i.e. amplitude too large by factor a = sqrt(Ps/Pz).
#     For a collapsed c=0.45 stream, a = 1/0.45 = 2.22, so M1 over-corrects 2.22x.
#   - The CORRECT comparator: a_correct = sqrt(Ps/Pz_hat); z' = a_correct * z.
#   - Per-pol version: estimate Pz separately on each polarization's prefix.
#   - These are the STRONGEST SIMPLE PRIORS (FR-14) and the contribution target
#     comparators (FR-25 Go comparator = conventional, task-matched).

