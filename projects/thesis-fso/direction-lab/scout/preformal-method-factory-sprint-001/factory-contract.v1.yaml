# === Frozen physical axes (inherited, DO NOT MODIFY) ========================
# All constructs reuse generate_shared_realization_dp with these exact axes.
# Modifying any of these = violation of discipline #6.
frozen_common_axes:
  alpha: 4.2            # Gamma-Gamma turbulence parameter
  beta: 1.4             # Gamma-Gamma turbulence parameter
  block: 100            # GG envelope block structure
  t_s: 4.0e-10          # symbol period (2.5 GBaud)
  method: gar           # GG envelope method
  cma_mu: 0.001         # CMA step size (frozen, sat.1553 L760)
  cma_taps: 11          # CMA filter length (frozen)
  r2_qpsk: 1.0          # CMA dispersion constant QPSK
  r2_qam16: 1.32        # CMA dispersion constant 16QAM
  cma_block_size: 64    # CMA block-end update size (frozen, prompt013 parity)
  affine_ridge: 1.0e-6  # ridge for blind/oracle affine fits
  constellation_amplitude_per_axis: 0.7071067811865475

# === Diagnostic cells (frozen subset) ========================================
# Reduced from Atlas v1's 11 cells to a 6-cell diagnostic slice that captures
# the failure mechanism across SNR x f_g axes. Two cells are anchor/stress,
# four are the core collapse regime. Selection: every short-N cell where
# nearest PI-SER >= 0.30 AND oracle PI-SER <= 0.03 (the clean collapse regime).
cells:
  - {id: snr20-nominal-short, modulation: qam16, snr_db: 20.0, f_g_hz: 30.0,   sop_rate: 4.0e-6, n_symbols: 512}   # head=0.31 core
  - {id: snr25-nominal-short, modulation: qam16, snr_db: 25.0, f_g_hz: 30.0,   sop_rate: 4.0e-6, n_symbols: 512}   # head=0.33 core
  - {id: snr20-fg1000-short,  modulation: qam16, snr_db: 20.0, f_g_hz: 1000.0, sop_rate: 4.0e-6, n_symbols: 512}   # head=0.32 high f_g
  - {id: snr20-sop40e-short,  modulation: qam16, snr_db: 20.0, f_g_hz: 30.0,   sop_rate: 4.0e-5, n_symbols: 512}   # head=0.31 high SOP
  - {id: snr15-nominal-short, modulation: qam16, snr_db: 15.0, f_g_hz: 30.0,   sop_rate: 4.0e-6, n_symbols: 512}   # head=0.22 mid-SNR
  - {id: snr20-nominal-long,  modulation: qam16, snr_db: 20.0, f_g_hz: 30.0,   sop_rate: 4.0e-6, n_symbols: 8192}  # head=0.23 long-N

