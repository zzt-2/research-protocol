# === Receiver-visible input/output contract (frozen) ========================
# Privileged inputs (FORBIDDEN in any construct's deployable action):
#   - true channel / Jones matrix
#   - TX truth symbols sX/sY or bitsX/bitsY
#   - future window (symbols not yet received)
#   - fixed-label BER (oracle assignment)
#   - oracle affine coefficients (Kill-tool only, FR-21/FR-25)
receiver_visible_input_contract:
  allowed_runtime_inputs:
    - z_stream: "equalizer output zX/zY (complex, length N) — the receiver-visible signal"
    - cma_trace: "block-level CMA trace {output_power, w_norm, cm_error, update_norm, z_amp_max} — causal, receiver-internal"
    - r_stream: "raw received rX/rY (complex, length N) — available to any equalizer re-init"
    - known_constellation: "public 16QAM alphabet (modulation is public knowledge)"
    - frozen_axes: "the frozen physical axes above (public, not TX/channel truth)"
  forbidden_runtime_inputs:
    - true_channel_or_jones
    - tx_truth_symbols_or_bits
    - future_window_symbols
    - fixed_label_oracle_assignment
    - oracle_affine_coefficients
  causal_contract: "construct at symbol index n may only consume inputs with index <= n (online) or <= calibration_end (offline calibration on z only)"

output_contract:
  deployable_output: "predicted 16QAM symbols (complex, length N) on the eval slice"
  evaluation: "evaluate_dual_16qam from cb1_evaluator (permutation+quadrant invariant PI-SER)"

# === Traditional baseline (frozen comparator) ===============================
traditional_baseline:
  id: standard_cma_godard_z
  implementation: cb1_cell_runner.standard_cma_godard_with_z
  cost_function: "J = E[(R^2 - |z|^2)^2], R2=1.32 for 16QAM"
  gradient: "Godard-with-z: Dw ∝ (R2-|z|^2)·z·r*"
  provenance: "Godard 1980 TCOM 28(11):1867-1875 Eq.(10); sat.1553 §6 Eq.(50)"
  identity_gate: "provenance.gradient == 'Godard-with-z'"
  frozen_hyperparams: {mu: 0.001, n_tap: 11, block_size: 64, R2: 1.32, init: center-tap}
  inherited_atlas_result: "nearest PI-SER 0.33 (core collapse); oracle PI-SER 0.02; headroom 0.31-0.33 on 8 short-N cells"
  note: "This is the FROZEN traditional baseline. Every construct is paired against it on the same (cell,seed) realization. Constructs must beat this (and ideally MMA) to register a diagnostic signal."

# Strong cheap alternative (run once, shared across constructs that need it):
strong_cheap_alternative:
  id: blind_affine_16qam
  implementation: cb1_evaluator.blind_affine_compare_16qam
  cost_function: "closed-form ridge LS, z-derived 16QAM pseudo-labels, single 2x2 complex affine"
  inherited_atlas_result: "PI-SER 0.30-0.33 (marginally better than nearest, far from oracle)"
  note: "Same-information as nearest decision. Run once per (cell,seed); shared."

# === Primary / secondary metric (frozen direction) ==========================
primary_metric:
  name: PI-SER
  definition: "permutation-invariant symbol error rate (min over 2! stream perms x 4 quadrant rotations)"
  direction: lower_is_better
  MDE: 0.005  # per-symbol, inherited
  evaluator: cb1_evaluator.evaluate_dual_16qam
secondary_metric:
  name: fixed_label_SER
  direction: lower_is_better

# === Paired-realization method (frozen) =====================================
paired_realization:
  generator: common._dual_pol_channel.generate_shared_realization_dp
  contract: "ONE call per (cell, seed) -> {rX,rY,sX,sY,bitsX,bitsY}. ALL methods (baseline + every construct) consume the SAME realization object. No method generates its own channel."
  receiver_visible_fields: [rX, rY]            # raw received
  truth_fields_for_eval_only: [sX, sY, bitsX, bitsY]  # NEVER enter a construct

