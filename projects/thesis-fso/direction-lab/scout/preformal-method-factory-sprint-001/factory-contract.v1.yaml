# === Terminal states (only these three may end the sprint) ==================
terminal_states:
  - DIAGNOSTIC_METHOD_SIGNAL   # >= 1 construct passes the diagnostic signal gate
  - NO_DIAGNOSTIC_SIGNAL       # >= 3 valid constructs compared, none pass the gate
  - BLOCKED_SHARED_TESTBED     # testbed identity/fairness cannot be established

# === Diagnostic signal gate (promotion screen, NOT paper significance) ======
diagnostic_signal_gate:
  all_of:
    - "not dependent on a single seed or single cell (no evaluator artifact)"
    - "primary paired delta (construct_PI_SER - baseline_PI_SER) direction is consistent across both non-overlapping seed halves"
    - "positive median improvement (negative median delta since lower_is_better) AND help_count > hurt_count across (cell,seed) pairs"
    - "no unacceptable clean-boundary collapse (QPSK regression still PI-SER=0; high-SNR 16QAM cell does not regress > MDE)"
    - "receiver-visible + causal contract passes (no privileged input in deployable action)"
  weak_signal_label: WEAK_DIAGNOSTIC_SIGNAL  # edge results preserved, not force-killed

