secondary_findings:
  - nearest-QPSK alone made zero fixed-label and PI decision errors in every preregistered evaluation slice
  - blind one-step complex 2x2 affine did not improve an already error-free nearest-QPSK decision result
  - oracle affine also had zero errors, so this slice contains no visible decision headroom to allocate among simple or learned comparators
  - analog residual energy was nonzero and variable across cells; two cells had nonzero tail mass, but this did not translate into BER or SER headroom
  - blind affine reduced mean analog residual energy from 0.285582447333862 to 0.0466822477909391 without changing any decision metric
  - fixed-label and permutation-invariant metrics remained separate and happened to agree at zero in this slice
  - the exact historical source difference was prefix-stable independent RNG streams in _gg_time.py plus mixed line endings; public simulator code and parameter truth sources were not modified

negative_results:
  - mechanism: nonzero nearest-QPSK residual magnitude as sufficient evidence for ML headroom
    result: REJECTED_IN_PREREGISTERED_SLICE
  - mechanism: one-step blind affine correction after standard-CMA
    result: NO_MEASURABLE_DECISION_GAIN_IN_PREREGISTERED_SLICE
  - mechanism: tune parameters to recover or create headroom
    result: NOT_ATTEMPTED_BY_CONTRACT
  - scope_limit: these results do not reject residual-aware detection across other parameter domains, receivers, CSI classes, coding metrics, or candidate families

