        disposition: EXCLUDED_WITH_JUSTIFICATION
        justification: >-
          the 16QAM-driven ordering changes live on the modulation axis, which
          is INFRASTRUCTURE_BLOCKED on the P03 frozen source closure (the
          channel generator hard-codes QPSK). Stage A therefore cannot test
          this counterexample; DOMAIN/CANDIDATE remain UNRESOLVED/OPEN.
      - reference: .sessions/2026-07-10-dual-pol-osl-groundwork/decisions.md#D023
        axes: [f_g_hz, snr_db, modulation]
        disposition: EXCLUDED_WITH_JUSTIFICATION
        justification: >-
          the modulation component is INFRASTRUCTURE_BLOCKED; the f_g_hz and
          snr_db components WERE tested in Stage A (no headroom found on the
          runnable QPSK cells).
      - reference: .sessions/2026-07-10-dual-pol-osl-groundwork/decisions.md#D015
        axes: [sequence_symbols, sop_rate, fixed_label_ber]
        disposition: EXCLUDED_WITH_JUSTIFICATION
        justification: >-
          Stage A exercised short (512) and long (8192) observation lengths
          and two SOP rates (4e-6, 4e-5) on QPSK; the fixed-label-BER
