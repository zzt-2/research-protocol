  tested_axes:
    modulation: [QPSK]
    snr_db: [5.0, 10.0, 15.0, 20.0, 25.0]
    channel_or_state_dynamics: [f_g_hz=30, f_g_hz=100, f_g_hz=1000, sop_rate=4e-6, sop_rate=4e-5]
