  coverage:
    denominator: 0.0003906250   # the only non-zero visible headroom found, used as denominator for coverage
    value: 0.0                  # 0 of the runnable headroom is captured by the strongest same-information comparator
    status: MEASURED
    pass: true
    decision_class: LOCAL_NEGATIVE
  statistical_sensitivity:
    status: PASS
    target_effect: 0.005        # pre-registered MDE
    achieved_upper_bound: 0.0003906250   # max visible_headroom across all runnable cells (13x below MDE)
    n_runnable_cells: 11
    n_paired_seeds_per_cell: 10
    n_cells_sensitivity_limited: 6   # zero errors with rule-of-three UB > MDE on 10 seeds
    rationale: >-
      On 5 of 11 cells the rule-of-three upper bound is below MDE (these cells
      observed non-zero errors so the bound is informative); on 6 of 11 cells
      the upper bound exceeds MDE because zero errors were observed, so those
      cells carry a sensitivity caveat rather than a "baseline perfect" claim.
