# === Sanity checks (frozen BEFORE running) ===
sanity_checks:
  - id: cma_anchor_byte_regression
    description: >-
      standard_cma_godard_with_z on QPSK anchor cell reproduces P03 v1
      PI-SER=0.0 (byte-identical to Atlas v1). Wiring unchanged.
  - id: c10_smoke_clean_16qam
    description: >-
      On a clean (no fading, no SOP, no AWGN) 16QAM input, C10 per-symbol CMA
      converges to PI-SER ~ 0 within N=512. Sanity that per-symbol gradient
      sign is correct.
  - id: c11_smoke_no_improvement_on_clean
    description: >-
      On a clean 16QAM input where CMA already converges, DD-LMS cascade
      does not degrade (PI-SER stays ~ 0). Sanity that warm-start is correct.
  - id: c05_detector_constant_input
    description: >-
      On a synthetic constant-|z|^2 input (no collapse), C05 detector emits
      no alert. Sanity that the threshold is not degenerate.
  - id: c08_bandit_smoke
    description: >-
      On 1 validation cell, C08 bandit selects a mu and completes without
      divergence. Sanity that LinUCB update is finite.

