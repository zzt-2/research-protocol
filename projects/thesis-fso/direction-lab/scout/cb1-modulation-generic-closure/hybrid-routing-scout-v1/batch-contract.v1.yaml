# ── Fairness (B3) ──
fairness:
  per_expert_mu_tuning: "grid {1e-4,3e-4,1e-3,3e-3,1e-2,3e-2,1e-1} on VALIDATION seeds [101-105]; freeze best per expert; never touch test"
  convergence_check: "record CM error trajectory; flag under-convergence"
  paired_channel_realizations: "same shared realization across experts (generate_shared_realization_dp)"
  budget_parity: "same n_tap=11, block_size=64, single pass, same eval window"

# ── Preregistered A/B/C/D verdict criteria (frozen before reading test results) ──
# Per prompt §四. Practical-effect threshold preregistered.
practical_effect_threshold:
  oracle_headroom_min: 0.03   # |CMA_macro - oracle_selector_macro| >= 0.03 to justify a router existing
  router_gain_min: 0.01       # end-to-end PI-SER improvement over always-CMA, >= MDE(0.005)*2
  source: "MDE=0.005 (campaign) scaled to practical; 0.03 headroom = ~6x MDE to leave room for router loss"

verdict_criteria:
  HYBRID_METHOD_SIGNAL: >-
    (a) legal experts have stable oracle headroom >= 0.03 on fresh test seeds AND
    (b) receiver-visible router (threshold then ML) significantly + practically beats
    always-CMA/always-fallback/threshold by >= 0.01 end-to-end PI-SER AND
    (c) clean-case degradation < 0.01 AND false-switch/latency acceptable.
  OBSERVABLE_BUT_ML_UNNECESSARY: >-
    simple traditional threshold router captures most of the oracle headroom; ML adds
    no significant end-to-end gain. Keep non-ML hybrid + ML local-negative.
  COMPLEMENTARITY_INVALID: >-
    after legal experts + fair mu-tuning + real failure definitions, oracle headroom
    < 0.03 (i.e. the original diagnostic complementarity was an implementation artifact
    of the illegal C16 expert + contaminated seeds). Close this specific hybrid contract;
    do NOT close the whole algorithm-selection family.
  ORACLE_HEADROOM_NOT_OBSERVABLE: >-
    legal experts have complementarity (headroom >= 0.03) but receiver-visible info
    cannot stably predict the selection; boundary result — needs pilot/model-prior/
    different state estimate; do NOT fabricate a runnable method.

# ── Automatic rotation (prompt §四) ──
rotation:
  - "single candidate fails -> rotate to next legal fallback automatically"
  - "traditional threshold fails -> test one mechanism-distinct low-complexity router"
  - "only train ML if traditional router leaves clear headroom"
  - "same mechanism, 2 consecutive rounds <10% improvement or no new info -> stop that mechanism"

# ── Prohibitions (prompt + invariants) ──
prohibitions:
  - "no TX symbols / final PI-SER / future outputs / post-hoc oracle state in INFERENCE"
  - "validation/test seeds CANNOT use truth to select action or threshold"
  - "oracle is Kill bound ONLY, never a Go comparator (FR-21/FR-25)"
  - "no claim of novelty from 'did not find it in search' (C1)"
  - "single PI-SER>0.3 does NOT stand for all failure mechanisms (A2)"
  - "blocked axis = INFRASTRUCTURE_BLOCKED, never written as negative"
  - "statistically significant but below practical threshold -> NOT method success"
  - "no fabrication of runnable method if headroom not observable (D)"

# ── Budget ──
budget:
  max_subagent_minutes: 15
  total_run_target_seconds: 120   # 11 cells x 10 seeds x 3 methods, similar to C16's 3.7s
