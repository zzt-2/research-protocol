# === 4-category collapse label (inherited, OFFLINE only) ===
collapse_labels:
  categories:
    inner_ring_recoverable_collapse:
      definition: baseline PI-SER >= 0.1 AND oracle_affine PI-SER < 0.1 (oracle recovers)
      oracle_use: LABEL ONLY
    awgn_dominated_error:
      definition: baseline PI-SER >= 0.1 AND (baseline - oracle) < MDE (oracle does NOT help)
      oracle_use: LABEL ONLY
    healthy:
      definition: baseline PI-SER < 0.1
    ambiguous:
      definition: none of the above cleanly applies
  rule: >-
    Oracle/TX truth used ONLY for offline 4-category labelling and headroom
    reporting. NEVER influences a deployable action, gate, mapping, or selection.

# === Eval window: SAME geometry as sprint-002, applied to each method's OWN z ===
eval_window:
  geometry: >-
    cb1_cell_runner.eval_window_for(n_symbols, cma_taps=11, window_symbols=256,
    block_size=64). Returns (eval_start, calibration_end, eval_end).
    N=512: es=133, cal=261, ee=389 (prefix 128, suffix 128).
    N=8192: es=2181, cal=2309, ee=2437 (prefix 128, suffix 128).
  scored_eval_suffix: [calibration_end, eval_end)   # 128 symbols, scored
  parity_rule: >-
    EVERY method (anchor + comparator + candidates + oracle) consumes the SAME
    eval window [cal, ee) of its OWN z-stream and is scored by the SAME
    evaluator on the SAME paired (cell, seed) realization. The equalizer runs
    over the FULL signal (it needs prefix to converge); only [cal, ee) is scored.
    This is the SAME window geometry the block-64 anchor uses — no method gets a
    different scored population.

# === Seeds (fresh disjoint, frozen; identical to sprint-002 collision-scan) ===
seeds:
  collision_scan: >-
    Repository-wide exact-token scan returned ZERO hits for [181..190] and
    [201..220]. B01-R used [11..15]/[21..30]; C11-legality used [31..35]/[41..50];
    T019 sprint-001 used [11..20]; sprint-002 used [181..190]/[201..220]. None
    collide with this batch.
  dev_seeds: [181, 182, 183, 184, 185, 186, 187, 188, 189, 190]
  test_seeds: [201, 202, 203, 204, 205, 206, 207, 208, 209, 210, 211, 212, 213, 214, 215, 216, 217, 218, 219, 220]
  forbidden_seeds: [71, 72, 73, 74, 75, 76, 77, 78, 79, 80]   # contaminated, FORBIDDEN
  leakage_check: >-
    set(dev) ∩ set(test) = empty (asserted in code);
    set({dev,test}) ∩ forbidden(71-80) = empty (asserted in code).
  rule: >-
    Dev seeds ONLY select the comparator mu grid and candidate granularity/mu;
    Test seeds are NEVER observed during dev and never feed back.

# === Identity gates (MUST PASS before any evaluation) ===
identity_gates:
  gate_1_qpsk_regression:
    description: >-
      QPSK anchor at mu=0.03 fixed-mu CMA reproduces PI-SER = 0.0 (wiring
      regression). Confirms the inherited anchor + comparator gradient identity.
  gate_2_eval_population_identity:
    description: >-
      All methods run on the SAME (cell, seed) realization with the SAME eval
      window; the equalizer divergence flag is the only accept/reject.
  gate_3_prefix_only_freeze_invariance:
    description: >-
      Re-running a method on the SAME raw rX/rY yields bit-identical z (the
      equalizer is deterministic given the realization; no suffix-dependent
      selection enters the equalizer itself). Each method's mu/granularity is
      frozen on dev and applied unchanged on test.
  gate_4_gradient_identity:
    description: >-
      The comparator and ALL candidates use the canonical Godard-with-z gradient
      (contains the z factor). Verified by TDD test that the per-symbol update
      vector equals mu*(R2-|z|^2)*z*conj(r) (NOT the scalar-error form without z).

# === Statistical preregistration (seed-cluster; comparator-aware gate) ===
statistical_preregistration:
  primary_metric: PI-SER (lower is better)
  MDE: 0.005
  paired_ci_method: cluster_bootstrap_over_seeds   # 10k resamples, 95% CI
  clustering_rule: >-
    Each SEED is ONE independent cluster. The 7 cells within a seed are NOT
    independent samples. Aggregate as:
      (1) per-seed, per-method mean PI-SER over the 7 cells;
      (2) per-seed paired delta vs the TUNED PER-SYMBOL COMPARATOR (not the
          inherited anchor) for the signal gate;
      (3) seed-cluster bootstrap CI on the per-seed mean delta vs comparator;
      (4) help/hurt/tie SEEDS (help = per-seed mean delta < -1e-9).
  comparator_aware_signal_gate:
    DIAGNOSTIC_METHOD_SIGNAL:
      all_of:
        - "seed-cluster mean ΔPI-SER ≤ −0.005 vs TUNED PER-SYMBOL comparator"
        - "95% CI upper < 0 (vs comparator)"
        - "help seeds > hurt seeds (vs comparator)"
        - "no catastrophic regression on healthy cells (per-seed delta not worse than +MDE on healthy cluster, measured vs comparator)"
        - "ablation rules OUT {tuning, more-updates-per-symbol, gradient-identity} as the sole explanation"
    PROBLEM_RESOLVED_BY_CONVENTIONAL_COMPARATOR:
      all_of:
        - "tuned per-symbol Godard-with-z CMA removes the block-64 collapse (collapse cells: comparator PI-SER < 0.1 where anchor >= 0.1)"
        - "no new construct stably beats the tuned per-symbol comparator"
      note: >-
        This is NOT a METHOD_SIGNAL and forms NO active carrier. It is the
        causal verdict on the gate-2 SUSPECTED lever: block-end update WAS a
        collapse contributor, but the conventional per-symbol update already
        resolves it.
    NO_DIAGNOSTIC_SIGNAL:
      all_of:
        - "no construct stably beats the tuned per-symbol comparator"
        - "the comparator did NOT remove the collapse"
    BLOCKED_SHARED_TESTBED:
      only_if: testbed cannot support fair comparison (identity gate cannot close)
    EXECUTION_INVALID:
      any_of:
        - "wrong gradient identity used as comparator (scalar-error _cma.py imitating Godard-with-z)"
        - "identity gate fail / causality leak un-repaired / smoke clobbered"

# === Required ablation (block_size × mu / effective-update budget) ===
ablation:
  purpose: >-
    A winner's advantage may be FULLY explained by "more weight updates per
    symbol" rather than the update-granularity MECHANISM. For any winner, check
    whether a block-64 CMA at an equivalent effective update budget (or the
    tuned per-symbol comparator at matched mu) ALREADY matches it.
  method: >-
    Effective-update-budget = number of weight updates per symbol.
    block-64 = 1/64 updates/sym; block-16 = 1/16; block-8 = 1/8;
    per-symbol = 1 update/sym. Report a winner's delta vs comparator AND vs a
    block-64 CMA given the SAME number of updates (matched mu sweep). If a
    matched-budget block-64 already ties the winner, the win is "more-updates",
    NOT granularity -> NO_SIGNAL.
  verdict_mapping:
    granularity: win survives matched effective-update-budget comparison
    more_updates: win disappears when block-64 given equivalent update budget
    tuning: win disappears at comparator's dev-optimal mu (pure mu sensitivity)

# === Gate-2 evidence-grade correction note (MANDATORY) ===
gate2_evidence_grade_correction:
  sprint_001_attribution: >-
    Sprint-001 synthesis §4/§8 attributed the collapse to "block-end update
    geometry + channel time-variation structural attractor" and listed it as a
    SUSPECTED bottleneck with per-symbol variants as the most-informative next
    lever.
  v052_rejection: >-
    V052 REJECTED_SCIENCE=STRUCTURAL_ATTRACTOR_OR_RECEIVER_GAP_ZERO. Reason: no
    basin/state-space scan was performed; the constructs overlapped existing
    candidates. So "block-end update = structural attractor cause" is NOT a
    confirmed mechanism.
  correct_statement: >-
    Block-end update is a SOURCE-BACKED, SUSPECTED lever (the update granularity
    is a real knob in cb1_cell_runner.py:106-129 and _cma.py:100-166), and the
    SUSPECTED lever coincides with the OBSERVED failure location. This sprint is
    the CAUSALITY TEST, not engineering on a confirmed mechanism.

# === Update-granularity DOF evidence (file:line, four-gate) ===
update_granularity_dof_evidence:
  gate1_physical_dof_exists: >-
    cb1_cell_runner.py:106-129 (block loop, intra-block vectorized filter at
    :114-116, block-end averaged Godard-with-z gradient at :124-129) and
    _cma.py:100-166 (same block structure). The block_size and the update
    instant (block-end vs per-symbol vs recursive) are REAL, code-imposed
    knobs. Finer granularity is a real transformation the receiver applies.
  gate2_failure_lever_coincidence: >-
    sprint-001 synthesis.v1.md §4 (L97-130) localized the collapse to block-end
    update geometry + channel time-variation; §8 (L176-179) listed the frozen
    block-64/mu protocol as a SUSPECTED bottleneck and per-symbol/finer
    granularity as the most-informative next lever — coincident with the
    observed failure location. (Evidence-grade: SUSPECTED, NOT confirmed — see
    gate2_evidence_grade_correction.)
  gate3_named_same_task_same_info_comparator: >-
    Per-symbol stochastic-gradient CMA = Godard 1980 original per-symbol form;
    same task (blind equalization of the same z-stream); same information
    (receiver-visible, no TX truth); independently tunable (own mu, dev freeze).
  gate4_file_line_evidence: cb1_cell_runner.py:124-129; _cma.py:100-166,159-166.

