# =============================================================================
# Pre-formal Method Factory Sprint 003 — update-granularity CMA family.
#
# Schema: direction-lab.preformal-method-factory-sprint-003.v3
# Authority: T027 (PREFORMAL_METHOD_FACTORY, epoch 61 / CP025); source decisions
#   D035 / V061 (problem-bearing testbed preflight, 4-gate pass);
#   V052 REJECTED_SCIENCE=STRUCTURAL_ATTRACTOR_OR_RECEIVER_GAP_ZERO (gate-2
#   evidence-grade correction: block-end update is a SUSPECTED lever, NOT a
#   confirmed mechanism).
# Date: 2026-07-29
# Claim ceiling: DIAGNOSTIC_ONLY_NOT_FORMAL_GW_MVE (no formal MVE, no Step 5,
#   no paper claim, no protected-owner edit).
# =============================================================================

# === Why this batch exists (TL;DR) ===
# Sprint-001/002 built z-only post-processing / triggering / initialization
# families that act on the OUTPUT of the block-64 CMA. Sprint-001 synthesis
# §4/§8 listed "block-end update geometry" as a SUSPECTED collapse lever and
# "per-symbol / finer update granularity" as the most informative next lever.
# That structural-attractor attribution was REJECTED by V052 (no basin scan,
# overlap with existing candidates) — so block-end update is only a
# source-backed, unconfirmed SUSPECTED lever. This sprint is the CAUSALITY
# TEST: does finer update granularity produce a stable signal beyond a TUNED
# traditional per-symbol Godard-with-z CMA comparator?
#   - constructs (a)/(b)/(c) act directly on RAW rX/rY, producing their OWN z
#     (NOT z-only post-processing of the block-64 output).
#   - The Go comparator is the tuned per-symbol standard CMA (canonical
#     Godard-with-z gradient). A win requires STABLY beating THAT comparator.

# === Shared anchor identity (reused, frozen) ===
shared_anchor:
  source: cb1-modulation-generic-closure/baseline-atlas
  generator: common._dual_pol_channel.generate_shared_realization_dp
  evaluator: cb1_evaluator.evaluate_dual_16qam
  paired_realization_rule: >-
    Every method on a given (cell, seed) runs on the SAME shared realization.
    A (cell, seed) realization is generated exactly ONCE per side.
  frozen_common_axes:
    alpha: 4.2
    beta: 1.4
    block: 100
    t_s: 4.0e-10
    method: gar
    cma_taps: 11
    cma_block_size: 64          # inherited block-end granularity (anchor only)
    r2_qam16: 1.32              # E[|s|^4]/E[|s|^2], Godard-with-z
    constellation_amplitude_per_axis: 0.7071067811865475  # {-3,-1,+1,+3}/sqrt(10)
    affine_ridge: 1.0e-6
  qpsk_identity_regression_pi_ser: 0.0
  source_hashes:                # frozen BEFORE running, unchanged vs sprint-002
    cb1_cell_runner.py: 2d9660338c302c3107b97c7e51a353b1c79b5ca3da565d8521f774b477e2a59e
    cb1_evaluator.py:  46b81b9dbbc508ecd961265252e523e2c4e51ba06f39ecdb7c03dc37d5c4f157d
    _dual_pol_channel.py: 5cefac97d120e5590905ae36ab20cabc8832a6c556368b1d9f154a2a8091818c
    _modulation.py: 036fb7aa4d0bef153ee53799f20a244492fb6294f93132d1ecc2b0530b5694d5

# === Inherited anchor (a): tuned block-64 CMA, mu FROZEN (NOT re-tuned) ===
inherited_anchor:
  id: block64_cma_mu0p03
  implementation: cb1_cell_runner.standard_cma_godard_with_z
  mu: 0.03                      # inherited from frozen-params-b01r-v1.yaml (NOT re-tuned here)
  R2: 1.32
  block_size: 64
  n_tap: 11
  update_granularity: block_end_averaged
  gradient: Godard-with-z
  gradient_provenance: cb1_cell_runner.py:124-129
  note: >-
    The inherited shared-anchor baseline AND identity reference. mu is FROZEN
    from B01-R hotfix v2 (frozen-params-b01r-v1.yaml, interior optimum
    best_score=-0.20390625). This batch does NOT re-tune its mu. Reported for
    context; it is NOT the Go comparator (the tuned per-symbol CMA is).

# === Traditional comparator (b): tuned per-symbol standard CMA ===
traditional_comparator:
  id: persymbol_cma_godard_with_z
  implementation: methods.persymbol_cma_godard_with_z
  update_granularity: per_symbol_immediate   # every symbol, canonical Godard 1980 form
  gradient: Godard-with-z
  gradient_provenance: >-
    cb1_cell_runner.py:124-129 formula. The block-end runner computes
    (eX*zx_blk)[:,None]*conj(rX_blk) then mean over the block (per-block
    averaged Godard-with-z). The per-symbol analogue DROPS the mean and updates
    weights immediately after every symbol: dw = mu*(R2-|z|^2)*z*conj(r).
    Gradient IDENTITY is identical (canonical Godard-with-z); only the update
    GRANULARITY changes (block-averaged -> per-symbol immediate).
  entry: per-symbol standard-CMA (canonical Godard-with-z)
  R2: 1.32
  n_tap: 11
  center_tap_init: true         # w[center]=1, others 0 (matches cb1_cell_runner)
  divergence_criteria: >-
    Same as cb1_cell_runner: w-norm > 10*init_norm OR max|z| > 1e3 OR
    non-finite. Checked every `check_every` symbols (default 64) so the
    per-symbol loop is not dominated by divergence checks.
  mu_tuning:
    grid: [1.0e-3, 3.0e-3, 1.0e-2, 3.0e-2, 1.0e-1]
    pool: dev cells x dev subseeds (prefix-only selection; test never observed)
    freeze: dev-optimal mu, then held-out test (no feedback)
    note: >-
      Per-symbol mu must be tuned SEPARATELY (each update is full-strength, no
      block-averaging attenuation, so the per-symbol mu is typically ~10x-30x
      smaller than the block-end mu). mu=1e-1 is expected to diverge on long
      cells.
  forbidden_imitation: >-
    MUST NOT use common/_cma.py CMAEqualizer2x2 as the comparator. That class
    implements the SCALAR-error gradient dw ∝ (R2-|z|^2)*conj(r) (missing the z
    factor; _cma.py:161-166). Using it as the comparator gives a WRONG gradient
    identity and is EXECUTION_INVALID. The comparator MUST be canonical
    Godard-with-z (contains the z factor), provenance cb1_cell_runner.py:124-129.

# === Deployable candidates (c): mechanism-distinct from (b) ===
# All candidates use the SAME canonical Godard-with-z gradient identity as the
# comparator; only the update GRANULARITY (when/how often weights move) differs.
deployable_candidates:
  - id: block8_cma_godard_with_z
    update_granularity: block_end_averaged (smaller block)
    difference_from_comparator: >-
      Same block-end averaged gradient, but block_size=8 (8x more weight updates
      per symbol than block-64). Tests whether a SMALLER block granularity beats
      per-symbol at a matched effective-update budget.
    mu_tuning: dev grid (per-block-size mu)
  - id: block16_cma_godard_with_z
    update_granularity: block_end_averaged (smaller block)
    difference_from_comparator: >-
      Same block-end averaged gradient, but block_size=16 (4x more weight updates
      per symbol than block-64). Intermediate granularity.
    mu_tuning: dev grid (per-block-size mu)
  - id: sliding_window_recursive_cma
    update_granularity: per_symbol_recursive_running_mean
    difference_from_comparator: >-
      Updates every symbol like per-symbol, BUT accumulates the gradient with a
      running exponential/recursive mean (a leaky block memory) instead of the
      pure instantaneous per-symbol gradient. Mechanism = recursive block memory
      on top of per-symbol update rate.
    mu_tuning: dev grid

# === Kill-only bound (NEVER a Go comparator, FR-21/FR-25) ===
kill_bound_only:
  - id: oracle_affine_bound_16qam
    implementation: cb1_evaluator.oracle_affine_bound_16qam
    use: OFFLINE_4_CATEGORY_LABEL_AND_HEADROOM_ONLY
    note: >-
      TX-truth affine fit. Used only for (1) offline 4-category collapse
      labelling and (2) visible-headroom reporting. NEVER a Go comparator.
      NEVER enters any deployable method action.

