    alpha_beta: {weak: [11.6, 10.1], moderate: [4.0, 1.9], strong: [4.2, 1.4]}
    sigma_R2: [0.2, 1.6, 3.5]
    headline_point_db: 9
    headline_range_db: "0.8-1.5"        # 三档全正
    comparator: "fixed NDA, common-payload BER-ratio"
    montecarlo: "30 seeds x 400 windows, 768-bit common payload"
