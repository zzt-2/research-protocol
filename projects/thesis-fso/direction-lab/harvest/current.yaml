    evidence: D013-amended / D016

  - id: BLIND_AFFINE_HARMFUL_HARVEST
    category: FAILURE_MECHANISM
    claim: blind_affine_compare_16qam locally net harmful (gain −0.00837).
    evidence: D013-amended / D016

  - id: MMA_NOT_BETTER_THAN_CMA_HARVEST
    category: FAILURE_MECHANISM
    claim: MMA not better than CMA on OSL (textbook MMA>CMA on fiber does NOT extrapolate).
    evidence: D006 / H018

  - id: CB1_COLLAPSE_DEEP_PROPERTY_HARVEST
    category: FAILURE_MECHANISM
    claim: Collapse survives fair tuning + per-symbol + DD-LMS cascade. (Now extended to init/cost/paradigm by H060.)
    evidence: D008 / D011 / D012

  # ── REUSABLE ASSETS ──
