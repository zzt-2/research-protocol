historical_e15ae60_snapshot:
  # ── PRIMARY THESIS SPINE: the collapse is a channel property ──
  - id: H060_COLLAPSE_CHANNEL_PROPERTY
    status: invalidated_by_D017
    category: FAILURE_MECHANISM
    claim: >-
      The 16QAM inner-ring collapse on dual-pol OSL (GG turbulence + SOP dynamics)
      is a FUNDAMENTAL PROPERTY OF THE BLIND EQUALIZATION PROBLEM, surviving all
      five tested mechanism axes: post-equalizer correction (C04/C09 affine,
      C12 GMI soft-demap), within-CMA adaptation (C08 mu, C10 per-symbol, C11
      DD-LMS cascade), cost variants (Godard, MMA, ring-aware/reduced-const C15),
      initialization (C14 center-tap, whitening, multistart, oracle Wiener), and
      equalizer paradigm (C16 non-modulus HOS source separation). TX-truth oracle
      shows the channel IS invertible, but the inversion information is not
      extractable from received statistics alone.
    ceiling: LOCAL_SLICE (11-cell atlas × 10 seeds each)
    evidence: C04/C09 O1-scout, C12 GMI-scout, C14 init-scout, C15 cost-scout, C16 HOS-scout

  # ── Per-axis mechanism negatives ──
  - id: H061_AFFINE_CORRECTION_NO_CONTEXT_VALUE
    status: invalidated_by_D017
    category: FAILURE_MECHANISM
    claim: >-
      A learned context-dependent affine corrector optimizing the hard pseudo-label
      MSE (input-dependent optimum confirmed by Probe p01) can only match the
      closed-form blind ridge-LS or overfit and blow up. Context-dependence adds
      no value over a single closed-form fit. C04/C09 route CLOSED on sound objective.
    ceiling: LOCAL_SLICE
    evidence: c04-c09-o1-corrected-scout

  - id: H062_GMI_DEMAPPER_BOUND_NOT_EQUALIZER_BOUND
    status: invalidated_by_D017
    category: FAILURE_MECHANISM
    claim: >-
      TX-truth oracle shows statistically ZERO GMI headroom over standard max-log
      demapper (Δ=−0.0001, CI [−0.0024,+0.0019]). The collapse's GMI loss is
      equalizer-bound, not demapper-bound. Soft-output correction cannot recover.
    ceiling: LOCAL_SLICE
    evidence: c12-gmi-soft-output-scout

  - id: H063_INIT_INVARIANT_COLLAPSE
    status: amended_scope_narrowed_by_D017
    category: FAILURE_MECHANISM
    claim: >-
      Collapse is init-independent: TX-truth Wiener init (cosine 0.9995 with
      center-tap) collapses on every collapsed seed. Data-driven init (whitening,
      multistart) is strictly WORSE (100% collapse rate). Block-0 determination
      reflects the cost surface, not init dependence.
    ceiling: LOCAL_SLICE
    evidence: c14-init-strategy-scout

  - id: H064_RING_AWARE_COST_SELF_CONSISTENT
    status: invalidated_by_D017
    category: FAILURE_MECHANISM
    claim: >-
      Ring-aware/reduced-constellation cost INCREASES collapse (Δcollapse +0.036,
      frac<0=0.00). Once symbols land on inner ring, ring-matching cost sees
      almost nothing wrong (error drops 19× from 1.18 to 0.06). Ring-mismatch
      hypothesis REFUTED as collapse cause. Combined with MMA angle-decomposition
      failure, rules out both geometric decompositions for blind modulus cost.
    ceiling: LOCAL_SLICE
    evidence: c15-reduced-const-cost-scout

  - id: H065_NONMODULUS_HOS_WORSE
    status: invalidated_by_D017
    category: FAILURE_MECHANISM
    claim: >-
      Non-modulus HOS source separation (kurtosis maximization, no |z|² term) is
      WORSE than Godard CMA on all cells (macro PI-SER 0.466 vs 0.251; collapse
      rate 0.791 vs 0.336). The 16QAM kurtosis signal is too weak for 2-source
      separation on short, time-varying blocks. The collapse is not a modulus-cost
      local minimum — it is a channel property.
    ceiling: LOCAL_SLICE
    evidence: c16-nonmodulus-jade-scout

  - id: H066_DETECTOR_STRUCTURAL_CEILING
    category: EVALUATION_INSIGHT
    claim: >-
      Collapse is fully determined at block 0 (conventional min_z2 AUROC=1.000).
      Lead time is non-positive by construction (mean −5.95 blocks). ML detectors
      using same CSI_NONE features cannot fire earlier. Detector family structurally
      ceilinged.
    ceiling: LOCAL_SLICE
    evidence: probe p02

  # ── PRIOR conclusions still valid ──
  - id: C11_NO_BENEFIT_HARVEST
    category: FAILURE_MECHANISM
    claim: C11 causal per-symbol DD-LMS no benefit (macro Δ +0.01445 worse). LOCAL_SLICE/DIAGNOSTIC.
    evidence: D012 / c11-legality-batch-v1

  - id: TRUTH_ASSISTED_BOUND_HARVEST
