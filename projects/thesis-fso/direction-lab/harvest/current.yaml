    ceiling: LOCAL_SLICE_WEAK
    validity: VALID_AS_WEAK_LOCAL_ONLY

  - id: H062_WITHDRAWN
    supersedes: H062_GMI_DEMAPPER_BOUND_NOT_EQUALIZER_BOUND
    current_claim: >-
      WITHDRAWN as a bound. C12 "zero GMI headroom" is a scale-artifact: the oracle
      only swaps a global sigma^2 estimate (TX-truth-conditioned) then runs the
      identical max-log, and the histogram-MI estimator is invariant to a common
      LLR scale. It is NOT evidence that soft-output correction cannot recover GMI.
      The GMI evaluator (H067) remains a valid reusable asset.

  - id: H063_SCOPE_NARROWED
    supersedes: H063_INIT_INVARIANT_COLLAPSE
    current_claim: >-
      SCOPE-NARROWED: C14 proves the strongest single init (oracle Wiener, TX-truth
      MMSE) collapses. It does NOT prove collapse is invariant across a genuinely
      diverse init family: the cosine~0.9995 with center-tap and the far-orthogonal
      (cosine 0.03-0.35) probes appear only in the synthesis narrative, not in the
      shipped src. Oracle Wiener is correctly a Kill-only bound (truth-conditioned).

  - id: H064_WITHDRAWN
    supersedes: H064_RING_AWARE_COST_SELF_CONSISTENT
    current_claim: >-
      WITHDRAWN mechanism claim. C15 used a shared mu=0.03 across costs whose
      gradient scales differ ~19x (Godard block-0 error +1.181 vs ring-aware +0.061),
      so the ring-aware update norm is 19x smaller — an unequal effective step size,
      not a clean test of the cost optimum. RCCMA cold-start freeze (n_active=0) is
      a documented behavior, not a mechanism finding.

  - id: H065_RECLASSIFIED
    supersedes: H065_NONMODULUS_HOS_WORSE
    current_claim: >-
      RECLASSIFIED (not a mechanism negative for closing an axis). C16 is a spatial
      2x2 whitening + real-Givens heuristic with NO FIR structure — NOT a legal
      capability-aligned expert vs the 11-tap 2x2 butterfly CMA anchor. The
      diagnostic complementarity (CMA macro 0.2507 vs HOS 0.4664; 26/37 HOS-better-
      in-collapse; oracle selector 0.1928) is reproducible in the data but rests on
      this task-mismatched expert + contaminated seeds 71-80 + post-hoc PI-SER
      oracle, so it is DIAGNOSTIC ONLY. It seeds the hybrid-routing study (S011),
      not a Go signal. The HOS equalizer (H068) remains a valid reusable asset.

  - id: SEEDS_71_80_INVALIDATED
    current_claim: >-
      seeds [71-80] lost held-out confirmatory status: reused as the test split in
      >=6 independent batches (c04/c09/c14/c15/c16/corrector) + c12 subset (71-76)
      + probes (71-73). Any confirmatory test must use fresh disjoint seeds.

