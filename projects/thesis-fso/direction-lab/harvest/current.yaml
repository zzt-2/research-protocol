thesis_spines:
  - spine: >-
      PRIMARY (negative boundary): The 16QAM inner-ring collapse on dual-pol OSL
      is a fundamental property of the blind equalization problem, surviving all
      five mechanism axes (correction, adaptation, cost, init, paradigm). Oracle
      shows the channel is invertible but the inversion info is not extractable
      from received statistics alone. This maps the entire blind-eq solution space.
    status: evidence-backed (5 axes, 11 cells × 10 seeds each)
    ceiling: LOCAL_SLICE
    paper_value: HIGH — complete boundary characterization

  - spine: >-
      SECONDARY (diagnostic boundary): TX-truth affine recoverable but receiver-
      visible target unconfirmed learnable; blind affine locally harmful; GMI loss
      is equalizer-bound not demapper-bound.
    status: evidence-backed (diagnostic)

  - spine: >-
      ASSET: GMI evaluator + HOS equalizer + Atlas gate enable future soft-output
      and paradigm-distinct comparisons.
    status: evidence-backed (reusable)

  - spine: >-
      POTENTIAL ESCAPE (untested): receiver-only model-based GG+SOP tracker
      (rank-4 from remap) using channel MODEL priors (not pilots) feeding a
      model-based MMSE equalizer. This is the only untested sub-problem axis that
      could open a positive contribution line. Requires ~1 day infrastructure.
    status: identified but not executed
    escalation: requires user strategy decision (material compute investment)
