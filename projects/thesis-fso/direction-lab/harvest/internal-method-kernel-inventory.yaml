candidates:
  - id: 2A
    name: Calibration-Aware Robust Adaptive CPR
    components: [ccisp, p01_snr_adapter, p02_weak_region_retune, continuous_GG_boundary]
    unified_chain: pilot_SNR_estimator -> operating_region_calibration -> CCISP_branch_action
    baseline: [original_CCISP_selector, global_retune, oracle_operating_point]
    grade: REJECT
    rationale: >-
      T004 bounded closure 已结束。历史诊断中 ordinary regional retune 相对 online candidate
      高 0.0961 dB（candidate-retune=-0.0961 dB，95% CI [-0.1060,-0.0862]）；新 truth-isolated
      dev full chain 中等容量 B2 regional retune 为 +0.30846 dB，online calibration 为 +0.26750 dB，
      后者仍低 0.04096 dB。包在 held-out 前又因 immutable evidence gate 用尽一次修复后仍 FAIL，
      terminal=REJECT；因此没有合法 held-out 增益，也不得把“吸收”扩大成正式科学 null。
    evidence:
      - "commit:1140134e89e8b0571274944cb44471ab6403481f:projects/thesis-fso/direction-lab/harvest/2a-calibration-aware-cpr-method-package.md"
      - "commit:1140134e89e8b0571274944cb44471ab6403481f:projects/thesis-fso/worker-logs/step-043-2a-calibration-aware-cpr-closure.md"
      - "commit:1140134e89e8b0571274944cb44471ab6403481f:projects/simulation/results/2a_calibration_aware_cpr_closure/independent-verifier-report.md"
    prohibited_revival: >-
      不得把 pilot-SNR online calibration、ordinary region retune 或 selector threshold 重调改名为新方法；
      不得声称 current-window pilot information 已证明 load-bearing、存在 held-out gain，或 T004 已形成 Ch4 方法。

  - id: 2B
    name: Low-Complexity Branch-Routed and Fixed-Point Adaptive CPR
    components: [branch_route_b, p03_fixed_point]
    unified_chain: quantized_receiver_statistic -> fixed_point_controller -> preselect -> execute_one_branch
    baseline: [route_A_dual_branch, float_route_B, uniform_precision_ladder]
    grade: SUPPORTING_ONLY
    rationale: >-
      T005 已闭合 396000 窗的 single-branch scheduling 身份与软件时延，但该动作签名就是 CCISP
      已有的 select-before-execute/只执行所选分支，不再构成独立 Ch5 方法。Q(8,6) 子链 verifier FAIL：
      360 shards 漏记 459 次 stage-2，13 dB 状态不可表示；只保留受限 BER/负面边界材料。
    evidence:
      - "commit:67970307a051dd8149e1a750498a20674dfcfe6f:projects/thesis-fso/direction-lab/harvest/2b-fixed-point-branch-routed-cpr-method-package.md"
      - "commit:67970307a051dd8149e1a750498a20674dfcfe6f:projects/thesis-fso/worker-logs/step-044-2b-fixed-point-branch-routed-cpr-closure.md"
      - "commit:67970307a051dd8149e1a750498a20674dfcfe6f:projects/simulation/results/2b_fixed_point_branch_routed_cpr_closure/final-disposition.json"
      - .sessions/2026-07-20-research-direction-lab-system/decisions.md#D023
    prohibited_revival: >-
      不得把 single-branch scheduling 从 CCISP 拆出后另称新方法；不得声称 Q(8,6) 全链 bit-true
      成本闭合、全 SNR 无损、FPGA/PPA 已验证或总接收机复杂度下降 74.6%。

  - id: 2C
    name: Receiver-Visible Coded Calibration Method
    components: [prefix_ls_coded_receiver]
    unified_chain: prefix_LS -> noise_channel_calibration -> coded_LLR
    baseline: [standard_prefix_LS_receiver, corrected_B0_B2, oracle]
    grade: SUPPORTING_ONLY
    rationale: 当前 action 主要修复 hidden-information bug；没有证明相对标准 receiver 的独立有用性或新的 coded decision。若未来另找 coded method，必须重走新 GW，不能续包装本资产

  - id: 2D
    name: Risk-Aware Rate/Outage Control
    components: [q_a_prime]
    unified_chain: receiver_state -> conditional_risk -> rate_or_no_transmit
    baseline: [conventional_outage_margin, fixed_rate, oracle]
    grade: NEEDS_NEW_GW
    rationale: 方法形状与传统 baseline 都可定义，但现有正结果 unauthorized，且 testbed/合同仍需重建

