strata:
  S1_natural_occurrence:
    injection: none
    first_stage_frames: 240
    maximum_dual_pol_frames: 600
    maximum_polarization_trajectories: 1200
    methods_before_event_filter: common_cpr_only
    gate:
      event_polarization_trajectories_min: 12
      distinct_seed_clusters_min: 4
      distinct_physical_cells_min: 2
    uncertainty: seed_cluster_bootstrap_rate_reported_descriptively_not_used_for_gate
    fail: NATURAL_DEFECT_NOT_ESTABLISHED

  S2_controlled_damage_recoverability_absorption:
    seeds: controlled_damage_recovery
    base_seed_cell_target_pol_clusters: 60
    injected_cases_per_cluster: 9
    maximum_injected_cases: 540
    cached_no_jump_twins: 60
    natural_rows_used: false
    damage_estimand: macro_mean_acwer_B1_on_minus_B1_off
    damage_gate:
      point_min: 0.10
      lower_ci_gt: 0
      positive_cell_points_min: 2
      fail: ZERO_PRACTICAL_CODED_DAMAGE
    recoverability_estimand: ratio_of_sums_errors_B1_on_minus_O1_on_over_errors_B1_on
    recoverability_gate:
      point_min: 0.10
      lower_ci_gt: 0
      positive_cell_points_min: 2
      fail: ZERO_RECOVERABLE_HEADROOM
    b2_absorption_gate:
      kill_if_coverage_lower_ci_gte: 0.95
      nonabsorbed_if_coverage_upper_ci_lt: 0.90
      grey_zone: >-
        Continue only with a pre-frozen later signal of at least 5 percent net
        goodput or at least 25 percent calls/latency at noninferior FER; otherwise Kill.

  S3_controlled_observability:
    dev_seeds: observability_fusion_dev
    test_seeds: controlled_observability
    candidates: 3_boundaries_times_3_rotations_plus_noop
    candidate_count: 10
    test_cases: 540
    full_restart_cw_decodes_per_case: 88
    maximum_test_cw_decodes: 47520
    pilot_only_score: >-
      For candidate c, define its no-op or one-transition four-state path over
      the ten registered actions. Sum known-pilot log emissions plus the
      log transition probabilities T(q)^distance between consecutive pilots,
      then divide by the number of pilot observations. Higher is better.
    decoder_score: >-
      Negative of (changed-CW re-encode NLL plus cached unchanged-CW NLL)
      divided by the same total evaluated coded bits for every candidate.
      Higher is better; raw touched-CW sums are forbidden.
    fusion:
      formula: pilot_score_plus_lambda_times_decoder_score
      lambda_grid: [0.25, 0.5, 1, 2, 4]
      lambda_selected_on_dev_only: true
      dev_aggregation: compute_MRR_and_top1_per_cell_then_equal_weight_the_three_cells
      dev_objective_lexicographic:
        - maximize_fused_macro_mean_reciprocal_rank
        - maximize_fused_macro_top1_rate
        - choose_smaller_lambda
      output: exactly_one_lambda_before_test
    deterministic_rank_tie_break: [noop, earlier_boundary, lower_rotation_k]
    unknown_data_maxlog_score:
      role: analytic_symmetry_null_only
      acceptance_role: none
    absolute_gate:
      combined_top1_point_min: 0.25
      combined_top1_lower_ci_gt: 0.10
    incremental_gate:
      combined_minus_pilot_mean_mrr_point_min: 0.10
      combined_minus_pilot_mean_mrr_lower_ci_gt: 0
      positive_cell_points_min: 2
    fail: NO_DECODER_INFORMATION_INCREMENT

  S4_clean_diagnostic:
    seeds: clean_diagnostic
    trajectories: 60
    applied_action_policy: none
    required:
      - no_slip_noiseless_B0_B1_O1_identity
      - all_rotation_boundary_noiseless_O1_zero_error
      - mapping_rotation_truth_metamorphic_pass
      - candidate_isolation_and_empty_decoder_state_pass
      - all_scores_finite_and_deterministic
      - no_truth_field_reaches_receiver_view
      - diagnostic_cost_ledger_complete
    false_action_and_fallback_gate: moved_to_post_d0_after_c1_policy_freeze
    fail: IDENTITY_INFORMATION_OR_COST_BLOCKER

gate_conjunction:
  pass_requires:
    - S1_natural_occurrence
    - S2_damage
    - S2_recoverability
    - S2_b2_nonabsorption_or_preregistered_grey_zone_signal
    - S3_absolute_observability
    - S3_incremental_observability
    - S4_clean_diagnostic
  pooling_across_strata_forbidden: true
  pass_result: CONDITIONAL_ENTRY_TO_POST_D0_C1_CONTRACT_ONLY
  fail_result: C1_HARD_TERMINAL_WITH_NAMED_GATE

post_d0_boundary:
  only_after_new_decision:
    - trigger_and_abstain_policy
    - applied_local_suffix_action
    - B1_or_B2_fallback
    - clean_false_action_and_goodput_gate
    - localization_trigger_repair_ablations
    - c1_dev_freeze
    - fresh_heldout_fair_comparison
  dev_and_heldout_must_use_seed_plan_above: true
  soft_decoder_callback_or_message_state: out_of_minimum_route

engineering_budget_days:
  D0:
    contract_source_and_asset_closure: 0.25
    receiver_truth_views_and_carrier_realization: 0.75
    B0_B1_O1_mapping_and_controlled_fixture: 0.50
    source_explicit_B2_adaptation_and_dev_freeze: 2.00
    strata_tests_statistics_and_cost_ledger: 0.50
    bounded_runs_raw_rows_ci_and_receipts: 0.50
    subtotal: 4.50
  post_D0_C1:
    hard_reencode_selector_trigger_local_action_and_fallback: 0.75
    identity_truth_clean_safety_ablation_and_cost_tests: 0.50
    disjoint_dev_freeze_heldout_run_ci_and_report: 0.75
    subtotal: 2.00
  base_total: 6.50
  contingency:
    days: 0.50
    may_cover: any_underestimated_required_line_item
    may_not_cover: deleting_identity_truth_safety_baseline_or_heldout_work
  hard_ceiling_total: 7.00
  blocker_if:
    - common_carrier_or_b2_requires_source_native_reproduction_beyond_the_explicit_adaptation
    - custom_unpruned_decoder_or_crc_is_required
    - required_work_plus_consumed_contingency_exceeds_7_days
    - shrink_would_remove_a_gate_or_complete_chain_identity
  runtime_gate:
    status: required_after_implementation_and_unit_gates_before_any_scientific_seed
    class: bounded_non_scientific_engineering_throughput_benchmark
    watchdog_minutes: 12
    required_decoder_batch_cw_sizes: [4, 8, 12, 16]
    required_slices:
      - one_unique_waveform_all_six_BPS_grid_pairs
      - one_B2_tuple_ten_unique_polarization_views
      - one_HMM_grid_chunk_with_primitive_and_aggregate_units
      - representative_atomic_JSONL_and_receipt_write
    record: [device, dependency_versions, physical_api_invocations, logical_batches, cache_hits, wall_time, peak_memory, projected_full_D0_time]
    allowed_adjustments: [vectorization, batch_size, content_addressed_cache, checkpoint_chunk_size]
    forbidden_adjustments: [drop_seed, drop_cell, drop_tuple, drop_grid, drop_fixture, drop_candidate, change_gate, reuse_decoder_message_state]
    pass: projected_required_work_plus_recorded_engineering_time_within_7_day_hard_ceiling
    fail: GREATER_THAN_7D_HARD_BLOCKER
  budget_class: BUDGET_RISK_REQUIRES_BOUNDED_BENCHMARK
  greater_than_7d_hard_blocker_established: false
  status: asset_preflight_verified_runtime_benchmark_pending
