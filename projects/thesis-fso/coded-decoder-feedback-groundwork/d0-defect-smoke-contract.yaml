statistics:
  primary_error_metric: affected_codeword_error_rate
  raw_row_required_fields:
    - stratum
    - seed
    - cell_id
    - target_polarization
    - fixture_id
    - boundary_after_cw
    - rotation_k
    - jump_present
    - method_id
    - affected_cw_errors
    - affected_cw_total
    - information_bit_errors
    - information_bit_total
    - total_transmitted_symbols
    - decode_calls
    - cw_decodes
    - bp_iterations
    - wall_latency_ms
  cluster_key: seed
  cluster_block: >-
    When a seed is sampled, include all three cells, both target polarizations,
    all nine injected fixtures, and their cached no-jump twins for that seed.
    Repeated sampled seeds repeat the entire block.
  cell_estimands:
    damage: acwer_B1_on_minus_acwer_B1_off
    recoverability: (errors_B1_on-errors_O1_on)/errors_B1_on
    coverage: (errors_B1_on-errors_B2_on)/(errors_B1_on-errors_O1_on)
