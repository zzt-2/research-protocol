purpose:
  question: >-
    Does a legal coherent-FSO coded slice contain a persistent within-frame
    pi/2 symmetry slip that damages the global reference B1, remains
    recoverable, is not absorbed by a frozen cheap B2, and is distinguishable
    by receiver-visible decoder evidence?
  not_mve: true
  not_c1_extension: true
  result_ceiling: conditional_entry_or_hard_terminal

invariants:
  - Natural occurrence and controlled injection are separate strata and are never pooled.
  - Natural events establish occurrence only; they do not supply a matched damage counterfactual.
  - All deployable scores use ReceiverView only; TruthView is evaluator-only after outputs freeze.
  - Changed LLRs always enter a full decoder restart with empty message state.
  - The diagnostic slice has no trigger, accept/reject threshold, fallback, or applied C1 action.
  - The four p05_run*.log files remain unmodified and unstaged.

views:
  ReceiverView:
    allowed:
      - received_and_equalized_samples
      - common_cpr_phase_trace
      - known_prefix_and_periodic_pilots
      - prefix_or_pilot_noise_estimate
      - frozen_code_layout_and_decoder_parameters
      - dev_frozen_b2_parameters
    forbidden:
      - tx_payload_or_information_bits
      - transmitted_coded_bits_or_data_symbols
      - true_phase_cfo_channel_snr_or_fade
      - true_slip_boundary_rotation_or_final_correctness
  TruthView:
    evaluator_only:
      - transmitted_bits_and_symbols
      - true_phase_channel_fade_and_noise_receipt
      - injected_or_natural_event_label
      - final_codeword_correctness

