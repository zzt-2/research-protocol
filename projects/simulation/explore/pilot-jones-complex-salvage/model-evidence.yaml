target_scenario:
  link: "coherent OSL downlink, LEO, single aperture, single link, 1550 nm"
  modulation: "dual-polarization (PolMUX) QPSK"
  symbol_rate: "R_SYM = 2.5e9 sym/s (T_S = 0.4 ns = 400 ps)  [params.py:49 SystemParams.R_SYM]"
  block_size: "100 symbols (40 ns)  [params.py:493 ExperimentParams.BLOCK]; pilot seam uses 64-symbol blocks historically"
  working_snr: "gamma_bar = 100 (20 dB)  [params.py:502 GAMMA_BAR_DEFAULT]"
  current_channel_model:
    file: "projects/simulation/common/_dual_pol_channel.py:127-132"
    equation: >
      rX = sqrt(h)*(cos(theta)*sX + sin(theta)*sY) + sqrt(nv)*nX;
      rY = sqrt(h)*(-sin(theta)*sX + cos(theta)*sY) + sqrt(nv)*nY;
      theta = sop_rate*arange(N); h = GG time envelope (gar AR1).
    structural_note: >
      The 2x2 polarization mixing is a REAL rotation [[cos,-sin],[sin,cos]] (unitary,
      cond==1) scaled by sqrt(h). NO complex phase, NO PDL, NO frequency-dependent
      PMD, NO X/Y skew. This is T002's known_simplification (source-closure.yaml
      L151-162).

# ---------------------------------------------------------------------------
# Question 1: does the target star-ground coherent OSL need PDL, PMD/DGD, X/Y
# skew, frequency-dependent Jones or complex phase?
# ---------------------------------------------------------------------------
Q1_need_each_impairment:
  complex_phase: >
    A real rotation only mixes X/Y with +/-sin; a COMPLEX Jones element
    e^{j*phi}*rotation is needed if the two polarizations acquire a relative
    phase (e.g. from a birefringent element). In a free-space downlink the
    atmospheric path is isotropic on average, but receiver optics (modulator IQ
    imbalance, 90 deg hybrid, fiber pigtails) do introduce phase. The canonical
    generator omits it. NEED: weak / optional (SOP already dominates).
  pdl: >
    PDL (polarization-dependent loss) makes the Jones matrix NON-unitary
    (singular-value ratio cond>1). Origin is almost entirely COMPONENT/OPTICS
    (dichroic coatings, fiber couplers, WDM, telescope coatings), NOT free-space
    atmospheric propagation. The atmospheric path is polarization-independent in
    the geometric-optics / weak-scintillation regime modeled here.
  pmd_dgd: >
    PMD / DGD is a differential delay between the two principal states; it is
    overwhelmingly a FIBER-OPTIC / COMPONENT impairment (modulator, LO, 90 deg
    hybrid, balanced receiver, fiber patch cables). Free-space vacuum/atmosphere
    does not generate first-order PMD at these aperture/symbol-rate scales.
    Vannucci et al. 2022 (Asilomar, 2022asil.conf..170V) explicitly warns against
    blindly reusing fiber PMD/CD models in FSO. APPROXIMATE source (abstract only).
  xy_skew: >
    X/Y timing skew is a DSP-sampling / component artifact (unequal electrical
    path lengths in the dual-polarization receiver), not an atmospheric effect.
  frequency_dependent_jones: >
    Frequency-dependent Jones (= genuine PMD) matters only when DGD is a non-
    negligible fraction of the symbol period. See Q3.
  conclusion: >
    Of the four, only PDL (component) and PMD/DGD (fiber/component) can make the
    Jones matrix genuinely NON-unitary or frequency-selective; complex phase keeps
    the matrix unitary (cond==1). Free-space propagation contributes neither. So
    a faithful upgrade is dominated by COMPONENT impairment, and the question
    becomes whether verified component magnitudes are large enough to matter at
    T_S=400 ps / block=100 sym. See Q3.

# ---------------------------------------------------------------------------
# Question 2: which impairments are fiber transceiver, which free-space, which DSP?
# ---------------------------------------------------------------------------
Q2_origin_categorization:
  free_space_propagation:
    - "Gamma-Gamma amplitude fade h(t)  [already modeled]"
    - "SOP rotation theta(t) (RSOP, mechanical/thermal)  [already modeled]"
    - "(atmospheric PMD/DGD: negligible at these scales per Q3)"
  fiber_transceiver_or_component:
    - "PMD/DGD (modulator, 90 deg hybrid, balanced detector, fiber pigtails)"
    - "PDL (coatings, couplers, WDM)"
    - "complex Jones phase (IQ imbalance, birefringent elements)"
  receiver_dsp:
    - "X/Y timing skew (unequal electrical paths, sampling offset)"
  implication: >
    The impairments that could resurrect a method-worthy gap (PMD, PDL) are
    COMPONENT impairment, NOT atmospheric. A salvage that ONLY adds them without
    a verified magnitude risks swapping to a "fiber transceiver" problem rather
    than an OSL atmospheric problem. Q3 + the physics gate decide if verified
    magnitudes are large enough at 2.5 GBaud / 100-symbol blocks.

# ---------------------------------------------------------------------------
# Question 3: at current symbol rate / bandwidth / frame / pilot budget, are
# DGD/PDL large enough to affect single-tap Jones?
# ---------------------------------------------------------------------------
Q3_magnitude_at_current_rate:
  # T_S = 400 ps at 2.5 GBaud; ISI/memory rule of thumb DGD >= ~10% T_S = 40 ps.
  dgd:
    verified_value: "6 ps -> 1 dB penalty at 32 GBaud DP-QPSK; DGD<1 ps minimizes penalty"
    source: "Valjus 2025, 'Review and Analysis of DSP Algorithms for Coherent Optical Satellite Links', doi:10.1002/sat.1553, ref [76] (quoted in text). VERIFIED (number read in source via sub-agent)."
    fraction_of_Ts: "6 ps / 400 ps = 1.5%; 1 ps / 400 ps = 0.25%"
    memory_effect: "Both far below the ~40 ps (~10% T_S) threshold for non-negligible ISI/memory. First-order PMD is effectively FLAT (memoryless) at 2.5 GBaud."
    conclusion: "VERIFIED physical DGD cannot produce frequency-selective memory at this symbol rate."
  pdl:
    verified_typical: "<0.5-1 dB for coherent receiver front-end / fiber components (cond<1.12)"
    source: "Typical coherent component spec; APPROXIMATE (no single FSO source with an exact dB value). ICSOS 2023 (doi:10.1109/ICSOS59710.2023.10490279) lists PDL among 6 impairments but full-text BLOCKED."
    pdl_to_cond: "PDL(dB) = 20*log10(cond)  [VERIFIED, multiple sources]. cond=1.12 -> 1 dB; cond=1.5 -> 3.5 dB; cond=2 -> 6 dB."
    conclusion: "Verified component PDL (<1 dB -> cond<1.12) barely perturbs a near-unitary Jones. cond>=1.5 requires 3.5 dB PDL which is large for a single receiver/telescope."
  rsop_rate:
    verified_value: "LEO satellite RSOP up to 600 krad/s; terrestrial up to 50 krad/s"
    source: "Valjus 2025 sat.1553. VERIFIED (read in source)."
    timescale: "SOP rotates on microsecond timescales >> symbol (0.4 ns) and block (40 ns) timescales -> Jones matrix is effectively constant within a 100-symbol block. Already modeled as theta=sop_rate*arange(N)."
  conclusion: >
    At 2.5 GBaud / 100-symbol blocks, VERIFIED magnitudes of DGD (<6 ps vs 400 ps)
    and component PDL (<1 dB -> cond<1.12) are too small to introduce frequency-
    selective memory or meaningful non-unitary conditioning that a single-tap
    block-LS Jones baseline cannot absorb. To probe whether ANY conditioning/
    memory axis exists at all we must additionally test STRESS ranges (tagged
    UNVERIFIED_STRESS_ONLY) that exceed verified OSL magnitudes; a positive signal
    there cannot support a positive verdict (only confirms the mechanism).

# ---------------------------------------------------------------------------
# Question 4: what do OE2021 / LCOMM2026 / sat.1553 each include / exclude?
# ---------------------------------------------------------------------------
Q4_read_papers_content:
  sat1553:
    ref: "Valjus 2025 sat.1553 (doi:10.1002/sat.1553)"
    includes: "DSP algorithm survey for coherent OSL; first-order PMD penalty (6 ps -> 1 dB at 32 GBaud); RSOP rates (LEO 600 krad/s); 2x2 butterfly equalizer architectures."
    excludes: "No time-domain GG deep-fade + sparse-pilot Jones stabilization analysis; no PDL magnitude for satellite; PMD limited to first-order."
  lcomm2026:
    ref: "LCOMM 2026 (doi:10.1109/LCOMM.2026.3651445) [L01, full-text read]"
    includes: "FPT/LPT frequency-domain pilot power in DSCM to depolarize-fade then solve Jones directly. Fiber DSCM scenario, NO atmospheric GG, NO sparse time-domain pilot."
    excludes: "No GG atmospheric deep fade; no time-domain LS+EMA seam; method-family direct competitor but different scenario."
  oe2021:
    ref: >
      Literature notes (lit notes line: 'OE 2021 explicitly limits to first-order
      PMD'). Sub-agent could NOT confirm an Optics-Express (10.1364/OE) 2021 DOI
      explicitly 'limiting to first-order PMD'; the cited paper may be
      mis-catalogued (a SPIE 10.1117/12.2582415 'Recent Trends in Coherent FSO'
      was found instead). TREAT the 'OE2021 first-order PMD' claim as UNVERIFIED
      provenance debt, not a confirmed full-text source.
  note: "The 4 D056 direct competitors remain BLOCKED_NO_FULLTEXT (D056 debt); no claim may rest on their full text."

