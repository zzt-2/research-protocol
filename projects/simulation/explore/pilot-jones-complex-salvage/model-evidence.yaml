# ---------------------------------------------------------------------------
# Physics gate (T003 Phase 1.4)
# ---------------------------------------------------------------------------
physics_gate:
  # Stop the performance MVE and give PIVOT_MODEL_NOT_JUSTIFIED if ANY of these holds.
  gate_conditions:
    - "PMD/PDL only from fiber segment outside the target link AND receiver already has legal compensation"
    - "sourced magnitude below estimated resolution by >=3 orders of magnitude in current time/bandwidth window"
    - "conditioning/memory can only be manufactured by source-less extreme parameters"
    - "task-matched conventional baseline fully covered by direct literature with no separable failure"
  assessment:
    g1_fiber_segment_compensated: "PARTIALLY HOLDS — PMD/PDL are component/fiber; but no source confirms a legal pre-compensation that fully removes them. Not a clean stop."
    g2_below_resolution: "HOLDS for VERIFIED range: DGD(<6ps)/T_S(400ps)=1.5% is 1.7 orders below the 10% (~40ps) memory threshold; PDL(<1dB) is cond<1.12 vs ~1.5 needed for an ill-conditioning axis. Verified magnitudes do NOT cross into memory/ill-conditioning."
    g3_sourceless_extreme: "HOLDS for any positive signal — to get cond>=1.5 or DGD>=40ps we MUST use UNVERIFIED_STRESS_ONLY ranges. A headroom that only appears under stress cannot support a positive verdict."
    g4_baseline_covered: "Does NOT hold — the 4 direct competitors are BLOCKED_NO_FULLTEXT, so no source confirms the task-matched conventional baseline fully covers the failure with no separable gap."
  gate_decision: >
    The physics gate does NOT cleanly fire PIVOT_MODEL_NOT_JUSTIFIED: the verified
    range is below the memory/conditioning thresholds (g2 holds for the verified
    range), BUT a positive signal could in principle appear under stress, and g4
    (baseline fully covered) does not hold. Therefore the honest path is to BUILD
    the model ladder, RUN the limiting-case tests and the verified-range probe,
    and let the empirical B3-vs-oracle headroom decide. The pre-registered rule is:
    if verified physical range shows NO headroom for P beyond task-matched B3, the
    verdict is PIVOT_MODEL_NOT_JUSTIFIED; if headroom ONLY appears under
    UNVERIFIED_STRESS_ONLY ranges, the verdict is PIVOT_UNVERIFIED_PHYSICAL_RANGE.
    A positive verdict requires headroom in the VERIFIED range AND P beating B3.
