  ceiling_impact: "Positive verdict capped at CONDITIONAL_GO_WITH_BLOCKING_LITERATURE_DEBT at best."

# ---------------------------------------------------------------------------
# Question 6: what should the strongest conventional baseline be?
# ---------------------------------------------------------------------------
Q6_strongest_conventional_baseline:
  for_pmd_memory:
    candidate: "2x2 tapped LS / CMA / LMS or frequency-domain (FDE) pilot Jones"
    reason: "PMD/frequency-selective channel cannot be inverted by a single-tap per-block LS; a tapped or FDE estimator matches the task."
  for_pdl_flat:
    candidate: "regularized / polar-decomposition / whitening single-tap baseline (correctly handles non-unitary cond>1)"
    reason: "Flat non-unitary PDL is still memoryless but ill-conditioned; the task-matched conventional baseline is a well-tuned regularized LS / whitening inverse, not a naive pinv."
  rule: "Go opponent MUST include a task-matched conventional 2x2 tapped/FDE/whitening baseline (B3). Beating only single-tap B0/B1 is NOT a method signal (T003 rule 4)."

# ---------------------------------------------------------------------------
# Question 7: does the model upgrade stay inside the dual-pol OSL scenario or
# switch to a pure fiber problem?
# ---------------------------------------------------------------------------
Q7_scenario_fidelity:
  assessment: >
    PMD/PDL are COMPONENT/fiber impairment, NOT atmospheric. Adding them is a
    legitimate part of a faithful satellite downlink receiver model (the receiver
    IS fiber+components after the telescope), but the dominant mechanism source
    shifts from atmosphere to transceiver. This does NOT make it a "pure fiber
    problem" as long as the GG atmospheric fade h(t) and RSOP are retained and
    the impairment magnitudes are bounded by VERIFIED satellite-component values
    (not fiber-long-haul values like 10s of ps DGD). The risk of scope-swap is
    HIGH if UNVERIFIED_STRESS_ONLY ranges are used to manufacture headroom.

