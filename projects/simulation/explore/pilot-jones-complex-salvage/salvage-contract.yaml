# ---------------------------------------------------------------------------
# Question / hypothesis / falsifier
# ---------------------------------------------------------------------------
question: >
  Does a physically more sufficient complex Jones / PMD / PDL channel
  reintroduce a Pilot-Jones problem where the strongest task-matched
  conventional baseline (B3) cannot close the oracle headroom, such that a
  receiver-visible method (P) can beat B3 — i.e. is there a method-worthy gap,
  or is the gap still absorbed by a task-matched conventional baseline?
hypothesis_H1: >
  A non-unitary (PDL) or frequency-selective (PMD) Jones makes the per-block
  pilot-LS estimate genuinely ill-conditioned / biased, producing a headroom
  that a task-matched whitening/tapped baseline (B3) only partly closes, and
  that a reliability-aware (energy-weighted) estimate (P1) closes further.
falsifier: >
  (a) In the VERIFIED physical range the channel stays near-unitary /
      memoryless (cond<1.12, DGD<6ps) -> B3 closes oracle headroom -> no
      method-worthy gap -> PIVOT_MODEL_NOT_JUSTIFIED.
  (b) Headroom appears ONLY under UNVERIFIED_STRESS_ONLY ranges -> positive
      signal cannot support a positive verdict -> PIVOT_UNVERIFIED_PHYSICAL_RANGE.
  (c) B3 already closes the oracle headroom even under stress -> no method
      signal -> KILL_PILOT_JONES_AFTER_PHYSICAL_MODEL_AND_TASK_MATCHED_BASELINE.
  (d) P1 does not beat B3 paired on the primary metric -> no method signal.

# ---------------------------------------------------------------------------
# Metric signature (T003 Phase 3.2 — corrected from T002)
# ---------------------------------------------------------------------------
metric_signature:
  primary_metric: fixed_label_ber
  secondary_metrics: [pi_ber, pilot_overhead, divergence, cond_p95, q2_db_fixed]
  denominator: "valid_data_samples = CMA-valid-mask AND data-mask (pilots excluded); SAME denominator for ALL arms (paired)"
  both_reported: "fixed_label_ber AND pi_ber reported together"
ber_to_q2_formula: >
  Q = sqrt(2)*erfcinv(2*BER); Q^2_dB = 20*log10(Q).
  QPSK only. BER=0 -> one-sided upper bound BER_ub = 0.5/N_eval (do NOT record
  infinite Q). BER>=0.5 -> Q invalid (return None). fixed and PI converted
  separately. BER ratio is NOT a dB and is NOT interchangeable with 0.5 dB.

# ---------------------------------------------------------------------------
# Baseline ladder (T003 Phase 3.1)
# ---------------------------------------------------------------------------
baseline_ladder:
  B0: {method: B0_pinv, role: "single-tap block LS + pinv, no smoothing"}
  B1: {method: B1_ema09, role: "single-tap fixed EMA09 (T002 reference)"}
  B2: {method: B2_tikhonov, role: "validation-tuned regularized LS (tikhonov)"}
  B3_pdl: {method: B3_whitening, role: "TASK-MATCHED conventional for non-unitary PDL: polar-decomposition / whitening regularized inverse (Go opponent for M2)"}
  B3_pmd: {method: B3_tapped, role: "TASK-MATCHED conventional for frequency-selective PMD: 2x2 tapped LS (n_taps=3) (Go opponent for M3)"}
  P1: {method: P1_energy_weighted, role: "PROPOSED: reliability (energy) weighted pilot-LS Jones estimate"}
  P1_variants: ["P1_energy_whiten (P1 + whitening)", "P1_energy_ema (P1 + EMA09)"]
  O: {method: O_jones_oracle, role: "true-Jones memoryless oracle (tagged upper bound / Kill only)"}
  O_fde: {method: O_fde_oracle, role: "true-Jones+PMD FDE MMSE oracle (headroom ceiling for M3, tagged, Kill only)"}
go_opponent_rule: >
  Go opponent = task-matched B3 (B3_whitening for M2 PDL, B3_tapped for M3 PMD).
  Beating only B0/B1/B2 is NOT a method signal (T003 rule 4). Oracle is ONLY an
  upper-bound/Kill tool, NEVER a Go opponent (T003 rule 8 / FR-25).

information_access:
  receiver_visible: [pilot_RX_rX_rY, pilot_symbols, pilot_mask, own_previous_H_estimate,
                     per_block_cond, per_block_RX_energy, per_block_innovation]
  truth_never_used_by_deployable: [true_h, true_theta, true_Jones, TX_data_sX_sY, future_symbols, true_PSP_delays]
  oracle_only_tagged: [true_Jones -> O arm; true_Jones+true_PSP_delays -> O_fde arm; scoring/kill only]

state_lifecycle:
  per_block: "estimate H_b from pilots (shared for B0/B1/B2/B3; P1 uses energy-weighted LS); form inverse; apply to data; CMA online"
  no_future: "causal per-block; no symbol reads ahead of its block"

