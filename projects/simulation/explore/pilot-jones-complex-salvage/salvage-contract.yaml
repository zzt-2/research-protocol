# ---------------------------------------------------------------------------
# Pass / fail thresholds (pre-registered, NOT post-hoc)
# ---------------------------------------------------------------------------
thresholds:
  primary_metric: fixed_label_ber
  pass_logic_gate: >
    PASSES (problem survives, proceed to MVE) require ALL of:
      1. in the VERIFIED range, B3 -> oracle headroom is non-negligible
         (Q^2_dB headroom > 0.5 dB on average), OR the verified range is at the
         boundary and stress clearly separates the axis; AND
      2. headroom appears across multiple seeds (not a single-seed artifact).
    If 1 fails -> PIVOT_MODEL_NOT_JUSTIFIED.
  pass_mve: >
    P (strongest proposed) beats task-matched B3: paired win >= 8/10 test seeds
    on primary metric AND exact sign-test p<0.05 in >=1 cell; clean controls
    show no material degradation; receiver-visible state has mechanism
    correspondence; gain not from different denominator/mask/future/oracle.
  fail_kill:
    - "falsifier (a): verified range near-unitary/memoryless, B3 closes oracle -> PIVOT_MODEL_NOT_JUSTIFIED"
    - "falsifier (b): headroom only under stress -> PIVOT_UNVERIFIED_PHYSICAL_RANGE"
    - "falsifier (c): B3 closes oracle even under stress -> KILL_PILOT_JONES_AFTER_PHYSICAL_MODEL_AND_TASK_MATCHED_BASELINE"
    - "falsifier (d): P does not beat B3 paired -> no method signal"
  threshold_source: >
    FR-21 (oracle headroom <0.5 dB-equivalent Q^2 -> KILL, with the corrected
    BER->Q^2 conversion above), gw-feasibility A0 §1 (gap <5% / non-existent ->
    fatal), FR-25 (Go = beat conventional B3; Kill = oracle headroom or MVE
    FAIL). Headroom reported as fixed_label_ber ratio AND Q^2_dB.

oracle_headroom_gate:
  scoring_oracle_info: "true Jones (memoryless O) + true Jones+PSP delays (FDE O_fde ceiling for M3)"
  pre_registered_kill: >
    If B3 (task-matched conventional) is within the FR-21 headroom of the oracle
    (Q^2_dB headroom < 0.5 dB, equivalently B3 BER ratio over oracle below the
    0.5 dB Q^2 line) on average in a given range, the practical headroom is
    structurally insufficient in that range -> KILL/Pivot for that range.

