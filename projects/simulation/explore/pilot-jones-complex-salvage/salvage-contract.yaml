# ---------------------------------------------------------------------------
# Architecture summary (FR-11)
# ---------------------------------------------------------------------------
architecture_summary:
  inputs_information_access: "pilot RX (rX,rY), known pilot symbols, pilot mask, per-block LS estimate H_b, cond(H_b), per-pilot RX energy, block innovation"
  state: "smoothed Jones matrix H_smooth (B1/P1_ema); per-block energy-weighted LS estimate (P1); CMA butterfly weights"
  output_action: "per-data-symbol derotation H^-1 @ [rX,rY], then blind CMA equalization"
  decision_granularity: "per-block Jones estimate; per-symbol CMA update"
  comparison_paradigm: "all arms share impaired realization/pilots/estimates/mask/window/CMA; differ only in how H^-1 is formed"
  objective: "minimize fixed_label_ber on data symbols (pilot positions excluded)"
  strongest_simple_prior: "B1 fixed EMA09"
  task_matched_conventional: "B3_whitening (M2) / B3_tapped (M3)"
  mechanism_distinct_method: "P1 energy-weighted LS (reliability-aware estimation, distinct from fixed EMA and post-hoc regularization)"
  known_simplification_bias:
    - "PMD modeled as a short 2x2 FIR (sinc fractional delay); a real fiber PMD has a longer statistical impulse response. Bias AGAINST memory (under-states ISI), so a positive PMD signal here is conservative."
    - "impairments are block-constant (consistent with GG block-constant); real component PMD may drift faster. Does not bias B3-vs-P."

# ---------------------------------------------------------------------------
# Stop conditions (T003 Phase 3.3)
# ---------------------------------------------------------------------------
stop_conditions:
  - "theory limiting-case test fails -> stop, fix model before any MVE"
  - "verified range shows B3 closes oracle (headroom <0.5 dB Q^2) -> PIVOT_MODEL_NOT_JUSTIFIED, no stress MVE needed for positive claim"
  - "headroom ONLY under stress -> PIVOT_UNVERIFIED_PHYSICAL_RANGE"
  - "B3 closes oracle even under stress -> KILL_PILOT_JONES_AFTER_PHYSICAL_MODEL_AND_TASK_MATCHED_BASELINE"
  - "result opposite to theoretical expectation -> component-level info-flow trace, not tuning (TL-22)"
