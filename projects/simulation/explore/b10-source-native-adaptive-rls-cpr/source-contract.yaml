source_native_identity:
  scope: estimator-only; source paper fiber link is not reproduced
  phase_b_status: SOURCE_IDENTITY_PASS_ACCEPTED
  channel_equation:
    formula: "r(k)=s(k)*exp(j*(2*pi*k*delta_f*T_s+theta(k)))+n(k)"
    source: "Deka et al. 2024 p.165 Eq.(1)"
  rls:
    source: "Deka et al. 2024 p.166 Eq.(3)-(7)"
    pilot_symbols: 128
    indexing: "k=1..128 training; k>128 decision-directed"
    units: radians
    x_training: "[1,k]^T"
    y_training: "unwrap(angle(r(k)/s(k)))"
    apriori_error: "e(k)=y(k)-h(k-1)^H*x(k)"
    gain: "kappa(k)=P(k-1)*x(k)/(lambda+x(k)^H*P(k-1)*x(k))"
    coefficient_update: "h(k)=h(k-1)+kappa(k)*e(k)"
    inverse_correlation_update: "P(k)=lambda^-1*(P(k-1)-kappa(k)*x(k)^H*P(k-1))"
    h0: [0.0, 0.0]
    p0: [[0.5, 0.0], [0.0, 0.5]]
    delta: 2.0
    freeze_period_formula: "F=2*pi/h1_at_k128"
    period_rule: "freeze once after the complete 128-pilot training interval; positive residual CFO only"
    prohibited_changes:
      - abs(h1)
      - P-norm reset
      - freeze on first nonzero h1
  decision_directed:
    source: "Deka et al. 2024 p.166-167 Eq.(8) and Fig.1"
    regressor: "[1,mod(k,F)]^T"
    order: predict phase; derotate; hard-decision 16-QAM; form residual; update RLS
    operational_residual: "angle(derotated_received*conj(hard_decision))"
    desired_output: "predicted_phase + operational_residual"
    information_boundary: receiver-visible samples, initial manifest pilots, hard decisions, and past/current residual only
    forbidden_information:
      - transmitted data symbols or bits after the pilot interval
      - true phase
      - true CFO
      - future residual or post-hoc decision correctness
  implementation_convention:
    statement: "The paper expresses F in degrees; T010 converts the entire phase chain consistently to radians."
    source_type: SOURCE_DERIVED_CONVENTION
