# ---------------------------------------------------------------------------
# Primary signal chain (T004 §3.1) — CORRECTED from T003
# ---------------------------------------------------------------------------
# TX full frame (pilots replaced BEFORE the channel)
#   -> sqrt(h) R(theta) atmospheric clean signal            [clean_atm]
#   -> passive component Jones / PMD / PDL channel          [component op]
#   -> post-component receiver AWGN (same canonical draw)   [n_post]
#   -> receiver
#
# The component channel operator acts on the CLEAN signal ONLY, never on the
# noise. This is the single most important correction (V038 defect #1).
primary_signal_chain:
  canonical_model: "r_canonical = sqrt(h)*R(theta)@s + n_post  (R=[[c,s],[-s,c]])"
  separation: "clean_original = sqrt(h)*R(theta)@s_original ; n_post = r_canonical - clean_original"
  repaired_model: "r_out = component_op(clean_pilot_frame) + n_post  (same n_post draw)"
  forbidden: "applying the component operator to n_post or to r_canonical (T003 defect #1)"

pdl_model:
  # PASSIVE PDL: max transmissivity <= 1 (a real component cannot amplify).
  primary_passive:
    singular_values: "[1, 10^(-PDL_dB/20)]"
    sigma_max: 1.0
    cond: "10^(PDL_dB/20)"
    note: "V038 defect #2 fix. T003 used g=[cond,1] -> sigma_max=cond>1 (amplifier)."
  sensitivity_avg_power_normalization:
    applied: false
    note: "Only as an explicit, separately-reported sensitivity; NEVER alters primary SNR. None added without a source."

pmd_model:
  pmd_acts_on: "the FULL pilot-bearing TX clean frame, not just pilot samples"
  dgd0_degeneracy: "DGD=0 must reduce to the SAME memoryless Jones"
  convolution_boundary: "explicit guard/overlap OR exclude theory-justified transient from metric denominator; report excluded count"
  m4_joint: "M4=PDL+PMD reuses ONE composable channel operator. Joint-axis verdict requires a legal joint oracle/B*; otherwise claim ceiling narrows."

# ---------------------------------------------------------------------------
# Paired realization (T004 §3.4)
# ---------------------------------------------------------------------------
paired_realization:
  per_cell_seed: "generate h/theta/TX/noise/component-truth ONCE per (cell,seed); ALL of B/P/O share it"
  seed_disjoint: "verified/stress/validation/test seeds explicitly disjoint; disjoint from T002/T003 observed seeds"

# ---------------------------------------------------------------------------
# Information access (unchanged spirit from T003, clarified)
# ---------------------------------------------------------------------------
information_access:
  receiver_visible: [pilot_RX_rX_rY, known_pilot_symbols, pilot_mask, own_previous_H_estimate, per_block_cond, per_block_RX_energy]
  truth_never_used_by_deployable: [true_h, true_theta, true_Jones, TX_data_sX_sY, future_symbols, true_PSP_delays]
  oracle_only_tagged: [full polarization channel (component + R(theta) + h) -> O arm; scoring/Kill only, NEVER a Go opponent]

# ---------------------------------------------------------------------------
# Baseline ladder (T004 §5) — Go opponent is B* chosen by VALIDATION
# ---------------------------------------------------------------------------
baseline_ladder:
  B0: {method: B0, role: "no-op / identity diagnostic"}
  B1: {method: B1, role: "single-tap block pilot LS + frozen EMA09 (historical conventional)"}
  B2: {method: B2, role: "regularized single-tap/polar inverse"}
  B3_pdl: {method: B3_pdl, role: "passive-PDL task-matched regularized inverse/whitening"}
  B3_pmd: {method: B3_pmd, role: "TRUE 2x2 tapped pilot-LS/LMS, target=known TX pilots (RX->TX, NOT RX->RX)"}
  B4_fde: {method: B4_fde, role: "conventional frequency-domain/tapped equalizer (same legal pilots/state), if pilot budget allows"}
  O: {method: O, role: "true full polarization channel + noise variance ZF/MMSE oracle, ceiling/Kill ONLY"}

baseline_adjudication:
  bstar_rule: "B* = the strongest LEGAL CONVENTIONAL baseline in each model family, FROZEN on VALIDATION. Candidates include B1 and task-matched B3/B4. A name 'B3' does NOT auto-make it strongest."
  bstar_selection: "B* chosen using validation seeds ONLY, never test seeds."
  fairness: "B* and P have same pilot overhead, same data mask, same eval window, same channel/noise, comparable tuning budget. Equal opportunity, not forced identical hyperparameters."
  if_b1_beats_b3: "B1 is B* for that slice; diagnose why B3 is task-misfit; do not hide it."
  if_no_b3_beats_noop_on_synthetic_pmd: "BASELINE_INVALID — no method verdict allowed."

