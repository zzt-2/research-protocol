# ---------------------------------------------------------------------------
# Gate separation (T004 §6 — THE core fix of defect #5)
# ---------------------------------------------------------------------------
gate_separation:
  problem_survives: >
    Determined ONLY by: (1) semantic gates all PASS; (2) legal B* -> valid O has a
    pre-registered practical headroom; (3) the gap is impairment-ADDED over paired M0,
    not a common deep-fade floor; (4) multi-seed direction-stable; (5) verified
    physical range supports a positive physical verdict. This gate NEVER reads P.
  method_succeeds: >
    Evaluated ONLY after problem survives. P (frozen on validation) beats B* (frozen on
    validation) on fresh test seeds. P losing B* => METHOD_CANDIDATES_FAIL_ON_
    SURVIVING_PROBLEM, NOT model-not-justified.
  forbidden: "AND-ing P1-beats-B3 into the problem-survival gate (T003 defect #5)."

