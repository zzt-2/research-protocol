  oracle_anomaly: "any receiver-visible arm systematically better than oracle -> ORACLE_INVALID, stop verdict, root-cause"
  problem_gap_q2_dB: 0.5              # defensible B*->O headroom to claim problem survives
  note_q2_mapping: "If no defensible 0.5 dB Q^2/SNR-equivalent mapping exists -> PARTIAL_BLOCKED_THRESHOLD_NOT_JUSTIFIED, never substitute a BER ratio."

# ---------------------------------------------------------------------------
# Architecture summary (FR-11)
# ---------------------------------------------------------------------------
architecture_summary:
  inputs_information_access: "pilot RX (rX,rY) where pilot/data share ONE channel operator; known pilot symbols; pilot mask; per-block LS/tapped estimate; cond; per-pilot RX energy"
  state: "per-block Jones/tapped estimate; optional EMA smoothing; CMA butterfly (secondary)"
  output_action: "per-data-symbol derotation/equalization, then optional blind CMA"
  decision_granularity: "per-block estimate; per-symbol CMA update"
  comparison_paradigm: "all arms share ONE impaired realization/pilots/mask/window/CMA; differ only in how the inverse/equalizer is formed"
  objective: "minimize fixed_label_ber (primary) and pi_ber (secondary) on data symbols"
  strongest_simple_prior: "B1 fixed EMA09"
  task_matched_conventional: "B3_pdl whitening (M2) / B3_pmd tapped RX->TX (M3)"
  known_simplification_bias:
    - "PMD as short 2x2 FIR (sinc fractional delay); under-states ISI vs real fiber PMD -> bias AGAINST memory (conservative for a positive PMD signal)."

# ---------------------------------------------------------------------------
# Stop conditions
# ---------------------------------------------------------------------------
stop_conditions:
  - "any semantic gate FAIL after one same-package repair attempt -> PARTIAL_SEMANTIC_REPAIR_BLOCKED, stop before headroom"
  - "any receiver-visible arm systematically better than oracle -> ORACLE_INVALID, stop verdict, root-cause"
  - "no B3/B4 beats no-op on synthetic PMD semantic case -> BASELINE_INVALID"
  - "no defensible 0.5 dB Q^2 mapping -> PARTIAL_BLOCKED_THRESHOLD_NOT_JUSTIFIED"
  - "M4 not closed -> claim ceiling narrows (no 'family/complex closed')"
  - "problem does NOT survive -> KILL_COMPLEX_AXIS_AFTER_VALID_SEMANTICS_AND_CONVENTIONAL_BASELINE"
  - "problem survives but all P candidates lose B* -> PROBLEM_SURVIVES_METHOD_CANDIDATES_FAIL"
