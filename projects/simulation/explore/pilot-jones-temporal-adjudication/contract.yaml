# ---------------------------------------------------------------------------
# Legal baselines + truth-assisted reference (§4)
# ---------------------------------------------------------------------------
baseline_ladder:
  B1:       {method: B1, role: "single-tap block pilot LS + frozen EMA09 (historical conventional)"}
  B2:       {method: B2, role: "single-tap Tikhonov, lambda frozen on VALIDATION only"}
  B_static: {method: B_static, role: "OPTIONAL pooled/cross-block tapped estimate; only if task-matched. Not added to pad the ladder."}
  O:        {method: O, role: "truth-assisted reference; ceiling / Kill only, NEVER a Go opponent"}

baseline_adjudication:
  bstar_rule: "B* = strongest LEGAL CONVENTIONAL baseline (B1 or B2) FROZEN on VALIDATION. B2 lambda scanned on validation only. B_static only if task-matched; not added to pad numbers."
  bstar_selection: "B* chosen using validation seeds ONLY, never test seeds. Test seeds only REUSE the frozen B*."
  fairness: "B* and reference share pilot overhead, data mask, eval window, base realization, CMA config. Equal opportunity, not forced identical hyperparameters."
  test_no_tuning: "B* frozen on validation; test seeds never feed back into B* selection or lambda."

truth_assisted_reference:
  M0_M2:
    method: "per-symbol TRUE full channel exact inverse"
    detail: "use the per-symbol true channel (sqrt(h)*R(theta) composed with the FIXED component Jones) to form the exact ML/nearest-channel decision on data symbols. For dual-QPSK implement >=16 joint symbol-pair candidates to avoid passing a colored-noise inverse off as an absolute ceiling."
    property: "ceiling on what a deployable single-tap conventional estimator could approach; NOT a method Go opponent."
  M3:
    method: "exact frequency-domain inverse of the TRUE fixed PSP + DGD"
    detail: "deconvolve the verified DGD=6 ps differential delay in the true PSP basis, then undo R(-theta) and /sqrt(h). Same FFT-circular convention as the forward apply."
    noise_property: "PMD (unitary in PSP basis at DGD>0 with sigma=1) is noise-preserving up to the MMSE regularization; state the unitary-PMD noise-preservation property explicitly."
    invalid_fallback: "if the reference cannot be proven a LEGAL ceiling, status = PARTIAL_ORACLE_INVALID and NO Kill is allowed from it."

gate_separation:
  problem_survives: >
    Determined ONLY by: (1) semantic gates all PASS; (2) legal B* -> valid O has a
    pre-registered headroom on the PRIMARY fixed/verified cells; (3) the gap is
    impairment-ADDED over the paired M0 (not a common deep-fade floor); (4)
    direction-stable across seeds (paired per-seed direction supports aggregate);
    (5) the verified physical range supports a positive verdict. This gate NEVER
    reads a proposed method (none are run in T005).
  forbidden: "reading any method candidate into the problem gate; AND-ing anything method-side."

# ---------------------------------------------------------------------------
# Pre-registered adjudication (§5) — written BEFORE any primary run
# ---------------------------------------------------------------------------
thresholds:
  semantic_oracle_recovery: 1.0e-10
  oracle_anomaly: "any receiver-visible arm systematically better than the reference -> ORACLE_INVALID, stop, root-cause"
  problem_gap_q2_dB: 0.5
  bootstrap_ci: "per-cell paired (impairment_added_over_M0) point estimate + bootstrap 95% CI across test seeds; report CI upper bound"

pre_registered_verdict:
  KILL: >
    M2 and M3 in BOTH conditions, at BOTH 4 and 6 pilots: the PRIMARY
    impairment-added headroom (impairment_added_over_M0) POINT ESTIMATE and the
    UPPER BOUND of its bootstrap 95% CI are BOTH <0.5 dB.
    -> KILL_COMPLEX_COMPONENT_RESCUE_AXIS_TEMPORAL_PRIMARY.
  SURVIVES: >
    ANY verified primary cell has impairment-added headroom point estimate >=0.5
    dB AND the CI / paired per-seed direction support it.
    -> PROBLEM_SURVIVES_FIXED_COMPONENT. T005 STILL does NOT run any method; hands
    back to main control for separate adjudication.
  UNRESOLVED: >
    CI straddles 0.5 dB OR the reference does not close (oracle anomaly / not a
    legal ceiling).
    -> UNRESOLVED_TEMPORAL_PRIMARY / PARTIAL_ORACLE_INVALID.
  iid_stress_rule: "iid-per-block stress (T004 artifact reproduction) is NEVER allowed to trigger a positive verdict, regardless of magnitude."

scope_ceiling:
  - "Does NOT close the whole Pilot-Jones family."
  - "The 4-paper fulltext debt (D056) remains BLOCKED."
  - "Does NOT enter Step 5/Contract/Execute."

# ---------------------------------------------------------------------------
# Architecture summary (FR-11)
# ---------------------------------------------------------------------------
architecture_summary:
  inputs_information_access: "pilot RX (rX,rY) where pilot/data share ONE fixed component operator; known pilot symbols; pilot mask; per-block single-tap LS estimate; per-block cond; per-pilot RX energy"
  state: "per-block single-tap LS Jones estimate; optional EMA smoothing (B1) / Tikhonov regularization (B2)"
  output_action: "per-data-symbol derotation (single-tap inverse); reference uses true fixed channel"
  decision_granularity: "per-block estimate; per-symbol derotation"
  comparison_paradigm: "all arms share ONE impaired realization / pilots / mask / eval window / CMA; differ only in how the inverse/reference is formed"
  objective: "minimize fixed_label_ber (primary) and pi_ber (secondary) on data symbols"
  task_matched_conventional: "B2 Tikhonov (M2) / B1 EMA09 (M3)"
  known_simplification_bias:
    - "Fixed passive component across frame under-states any real slow component drift -> biases AGAINST a positive signal (conservative for a Kill)."
    - "PMD as short 2x2 FIR (sinc fractional delay); under-states ISI vs real fiber PMD -> bias AGAINST memory (conservative for a positive PMD signal)."
