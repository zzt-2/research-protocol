# T005 contract — Pilot-Jones component TEMPORAL SEMANTICS adjudication
#
# FROZEN BEFORE any headroom probe (T005 Phase B, D065/V039 authorization).
# Scope: GW Step 4a dimension D ONLY. Does NOT cross Step 5/Contract/Execute.
#
# This contract supersedes the per-block iid temporal model of T004's
# `build_jones_truth()` (which redraws U/V every 64 symbols = every 25.6 ns
# with no physical source) and fixes the three reproducibility closure defects
# located by V039/D065 (Python `hash()` seed, contract N=50000 vs runner
# N=20000, 10-seed contract vs 8-seed run, fake `contract_sha256`). The T004
# signal/noise/pilot/target/gate engineering fixes (V038 defects #1-#5) are
# INHERITED unchanged; T005 re-establishes the component channel on top of them.
#
# T003/T004 artifacts are IMMUTABLE failure/reusable evidence. This contract is
# isolated in explore/pilot-jones-temporal-adjudication/ and must not modify any
# shared/protected path or import T003 salvage code.
#
# owner: T005 (PILOT_JONES_TEMPORAL_SEMANTICS_ADJUDICATION_PACKAGE), epoch 7.

