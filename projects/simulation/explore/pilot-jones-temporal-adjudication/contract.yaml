# ---------------------------------------------------------------------------
# PRIMARY temporal model — the single decisive change of T005 (§3.1)
# ---------------------------------------------------------------------------
# canonical TX
#   -> time-varying sqrt(h) R(theta)            [canonical, inherited]
#   -> ONE FIXED passive component Jones / fixed PSP+DGD for the WHOLE frame
#   -> same post-component AWGN (canonical n_post draw, inherited)
#
# The component truth (Jones / PSP basis / DGD) is generated ONCE per
# realization and copied to every block of the frame. A real passive optical
# component (fiber connector / PBS / ISO) does not redraw its principal states
# every 25.6 ns; the canonical R(theta) already models the time-varying SOP.
# Redrawing a random component basis per block is an UNSOURCED temporal model
# (V039) and is only retained as an explicit UNVERIFIED_STRESS_ONLY reproduction
# of the T004 artifact; it can never support a positive verdict.
primary_temporal_model:
  canonical_model: "r_canonical = sqrt(h)*R(theta)@s + n_post  (R=[[c,s],[-s,c]], inherited from T004)"
  separation: "clean_original = sqrt(h)*R(theta)@s_original ; n_post = r_canonical - clean_original  (T004 defect #1 fix, inherited)"
  repaired_model: "r_out = component_op_fixed(clean_pilot_frame) + n_post  (SAME n_post draw; component FIXED across frame)"
  component_temporal_law:
    primary: "ONE fixed component Jones U diag(1,10^(-PDL/20)) Vh / ONE fixed PSP basis + DGD, generated ONCE per realization, applied identically to every block"
    rationale: "V039: per-block iid redraw = unsourced 25.6 ns jumps; canonical R(theta) already carries SOP dynamics. A passive component does not time-share its principal states at block rate."
    sourcing_rule: "A SOURCED_SLOW_SENSITIVITY may be added ONLY if an already-read fulltext states a component time-scale; it must carry file:line and a time constant. No WebSearch. No file:line => not added."
    sournced_slow_sensitivity_added: false
  iid_per_block_retention:
    status: "UNVERIFIED_STRESS_ONLY"
    role: "ONLY to reproduce the T004 0.77-0.99 dB artifact and prove it vanishes under the fixed model; NEVER enters the primary table/verdict."

pdl_model:
  # PASSIVE PDL, sigma_max = 1 (a real component cannot amplify). Inherited
  # unchanged from T004 defect #2 fix.
  singular_values: "[1, 10^(-PDL_dB/20)]"
  sigma_max: 1.0
  cond: "10^(PDL_dB/20)"
  verified_pdl_db: 1.0          # APPROXIMATE-verified (D064/D065), cond 1.12
  note: "Primary cell uses verified 1 dB only. Stress PDL (3.5/6/9.5 dB) is UNVERIFIED_STRESS_ONLY."

pmd_model:
  pmd_acts_on: "the FULL pilot-bearing TX clean frame (T004 defect #3 fix, inherited)"
  dgd0_degeneracy: "DGD=0 reduces to the SAME memoryless Jones (limiting-case gate)"
  convolution_boundary: "FFT-circular forward AND oracle (identical convention) + PMD_GUARD=8 excluded from metric denominator (T004 §3.3, inherited)"
  verified_dgd_ps: 6.0          # VERIFIED (Valjus sat.1553), 1.5% of T_S=400 ps
  note: "Primary cell uses verified 6 ps only. Stress DGD (40/160 ps) is UNVERIFIED_STRESS_ONLY."
  ordering: "h/theta/component ordering fixed: clean = sqrt(h)*R(theta)*s; component applied to clean; oracle undoes component, then R(-theta), then /sqrt(h) (T004 defect #5 fix, inherited)."

# ---------------------------------------------------------------------------
# DETERMINISTIC seed — the second decisive change of T005 (§3.2)
# ---------------------------------------------------------------------------
# No Python built-in hash() may enter a seed (V039: hash(model_id) is process-
# randomized -> two subprocesses with the same seed/model/params disagree).
# A fixed integer model_id + the canonical seed + a fixed offset is used. Same
# params/seed -> bit-identical realization across two independent Python
# subprocesses (regression-tested).
deterministic_seed:
  rule: "component-truth RNG seed = 1_000_000 + 31*canonical_seed + MODEL_ID_INT[model_id]"
  forbidden: "built-in hash() of any object; string-derived seeds that depend on hash randomization"
  model_id_int: {M0: 0, M2: 2, M3: 3}
  reproducibility_target: "bit-identical realization fingerprint + jones_truth across two independent Python subprocesses with identical params/seed"

# ---------------------------------------------------------------------------
# FROZEN grid (§3.3) — two registered conditions, 4/6 pilots, three cells
# ---------------------------------------------------------------------------
# The grid is FROZEN here BEFORE any run. If runtime budget is insufficient, N
# is shrunk here (and the code uses this same N); never change the grid after a
# run. Total primary cells = 2 conditions x 2 pilots x 3 models = 12.
grid:
  conditions:
    operational:   {alpha: 4.2, beta: 1.4, gamma_bar: 100.0}
    adversarial:   {alpha: 2.0, beta: 1.0, gamma_bar: 50.0}
  common:
    block_size: 64
    t_s: 4.0e-10                  # params.py SystemParams.T_S = 1/R_SYM, R_SYM=2.5e9
    f_g: 100.0                    # params.py tau_c_from_fg -> tau_c=1.59 ms
    sop_rate: 8.0e-6              # within sat.1553 LEO RSOP envelope (D053)
    N: 20000                      # 20us << tau_c=1.59ms; bounded probe, runnable in-package
    warmup_frac: 0.1
    taps: 7
    mu: 1.0e-3
    r2: 1.0
    n_taps_b3: 3
  pilots: [4, 6]                  # registered sensitivity axis
  cells:                          # primary cells only
    - {model_id: M0, pdl_db: 0.0, dgd_ps: 0.0, verified: true,  tag: "M0_control"}
    - {model_id: M2, pdl_db: 1.0, dgd_ps: 0.0, verified: true,  tag: "M2_pdl1dB"}     # APPROX-verified
    - {model_id: M3, pdl_db: 0.0, dgd_ps: 6.0, verified: true,  tag: "M3_dgd6ps"}     # VERIFIED
  stress_cells_for_iid_reproduction_only:
    - {model_id: M2, pdl_db: 3.5, verified: UNVERIFIED_STRESS_ONLY}
    - {model_id: M2, pdl_db: 6.0, verified: UNVERIFIED_STRESS_ONLY}
    - {model_id: M2, pdl_db: 9.5, verified: UNVERIFIED_STRESS_ONLY}

