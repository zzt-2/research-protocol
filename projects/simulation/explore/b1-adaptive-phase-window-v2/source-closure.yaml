# ---------------------------------------------------------------------------
# Window definition (what "N" means in v2 — UNCHANGED from T007)
# ---------------------------------------------------------------------------
window_definition:
  vv_block_mean: >-
    Block-buffered Viterbi-Viterbi: raise rx to M=4, average the raised samples
    over a contiguous block of N symbols, take the angle, divide by M, subtract
    the modulation-dependent deterministic pi/4 bias. N = number of symbols
    averaged (the phase-estimation window length). Causal (reads only the
    current block). When N < block_size, the block is split into N-length
    mini-blocks; when N >= block_size, the whole block is averaged.
  pilot_moving_average: >-
    Pilot CPE: collect per-pilot phase estimates angle(rx[pilot]/s_pilot) over
    N pilot symbols and average; equal pilot overhead charged to all arms.
  block_latency: 0
  phase_ambiguity_oral: >-
    Deployable code corrects the deterministic pi/4 fourth-power bias; the only
    remaining legal ambiguity is pi/2 (4 spokes), resolved by legal pi/2 global
    resolve in the evaluator. The T006 "doc says 4 / code does 8 pi/4" mismatch
    is forbidden and tested.

