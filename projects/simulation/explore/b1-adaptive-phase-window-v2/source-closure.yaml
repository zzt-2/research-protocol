# ---------------------------------------------------------------------------
# Theoretical expectations (must be falsifiable) — UNCHANGED from T007
# ---------------------------------------------------------------------------
theoretical_expectations:
  e1_snr_down_n_up: "linewidth fixed; SNR down -> optimal N up (more averaging to suppress additive noise)"
  e2_innov_up_n_down: "SNR fixed; phase innovation up -> optimal N down (less averaging to track faster phase drift)"
  e3_no_universal_fixed: "if a single fixed N stays within 0.3 dB of per-cell oracle across ALL primary working cells, no adaptive space"
  falsifiable_relations: [e1_snr_down_n_up, e2_innov_up_n_down, e3_no_universal_fixed]

