# ---------------------------------------------------------------------------
# 5. Known simplifications + provenance debt
# ---------------------------------------------------------------------------
known_simplification:
  real_rotation_jones: >-
    The canonical generator models the 2x2 polarization mixing as a REAL
    rotation (theta = sop_rate*arange(N); matrix [[c,s],[-s,c]]), not a full
    complex Jones matrix with independent PMD/PDL. The historical pilot-assisted
    seam estimates a 2x2 COMPLEX matrix via LS but the ground-truth channel is a
    real rotation, so the "Jones estimate" effectively recovers a near-real
    rotation. Consequence: the pilot-LS estimate is well-conditioned except
    where h is deep (few pilots * noise) and where theta is near the
    assignment-flip axis. This is the SAME simplification as the source
    closure; it does not bias P vs B0/B1/B2 because all arms share it, but it
    bounds claim ceiling (see synthesis.md).
  no_frequency_dependent_pmd: >-
    OE 2021 explicitly limits to first-order PMD; the canonical generator has
    no frequency-dependent PMD at all. A real complex Jones with PMD would
    introduce frequency-dependent conditioning that could change the
    regularization-optimal point. Recorded as known divergence from OE 2021
    conditions; does not block the P-vs-B2 structural question.

