# ---------------------------------------------------------------------------
# Theoretical expectations (must be falsifiable)
# ---------------------------------------------------------------------------
theoretical_expectations:
  e1_snr_down_n_up: >-
    Hold linewidth fixed. As SNR decreases, the optimal window N should
    INCREASE (more averaging needed to suppress additive noise). A stable
    trend where N* shrinks as SNR drops, with no component-level explanation,
    FAILS the structural gate.
  e2_linewidth_up_n_down: >-
    Hold SNR fixed. As linewidth increases, the optimal window N should
    DECREASE (less averaging to track faster Wiener phase drift). A stable
    opposite trend FAILS the structural gate.
  e3_no_universal_fixed: >-
    If a single fixed N stays within 0.3 dB of the per-cell oracle window
    across ALL primary working cells, there is no adaptive space worth
    implementing (KILL condition 2).
  falsifiable_relations: [e1_snr_down_n_up, e2_linewidth_up_n_down, e3_no_universal_fixed]

# ---------------------------------------------------------------------------
# Identity separations (defend against V001-class confusion)
# ---------------------------------------------------------------------------
identity_separations:
  fixed_bstar: "B* fixed = single N chosen on validation across ALL conditions
    (deployable baseline)"
  fixed_per_condition: "one N per registered condition, chosen on validation
    (a stronger but still deployable comparator)"
  oracle_per_block: "per-block optimal N from the oracle (truth-assisted,
    KILL-only bound, NEVER a deployable Go opponent)"
  pilot_cpe: "legal pilot moving-average CPE (own arm, equal overhead)"
  validation_tuned_bps: "validation-tuned BPS (own arm, B/Nw frozen on validation)"
  v4_v8_oral_closing: >-
    QPSK/16-QAM M=4 raised-power has a deterministic pi/4 bias (the raised
    constellation lands on 4 spokes offset by pi/4) and a pi/2 global ambiguity.
    Deployable code MUST correct the pi/4 bias deterministically; evaluation
    uses ONLY legal pi/2 global resolve. The T006 "doc says 4 / code does 8"
    mismatch is forbidden and explicitly tested.

