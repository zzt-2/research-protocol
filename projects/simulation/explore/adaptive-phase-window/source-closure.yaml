sat1553:
  citation: "Valjus et al., Int. J. Satell. Commun. Netw. 2025 (DOI 10.1002/sat.1553)"
  fulltext: papers/doi/10.1002_sat.1553/content.md
  # The open problem (the source of the M-C-A gap). Quoted verbatim so no
  # equation is rebuilt from memory.
  open_problem_verbatim:
    location: content.md L440
    quote: >-
      "However, because the optimal number of symbols for phase estimation is
      a function of the ratio between SNR and phase noise [60], dynamically
      adjusting the number of symbols used for phase estimation should improve
      system performance in a channel with large SNR fluctuations. Further
      research is necessary to identify practical methods for dynamically
      adjusting the phase estimation window and to quantify the potential gain."
  theory_anchor_verbatim:
    location: content.md L440, citing [60] Leven
    quote: >-
      "the optimal number of symbols for phase estimation is a function of the
      ratio between SNR and phase noise [60]"
    ref60: "A. Leven, N. Kaneda, U.-V. Koc, Y.-K. Chen, IEEE PTL 19(6):366-368 (2007), DOI 10.1109/LPT.2007.891893"
  # The pilot-rate negative evidence (B1-Q2 risk signal, kept as honest
  # counter-evidence that adaptive space MAY be small).
  pilot_rate_negative_evidence_verbatim:
    location: content.md L440
    quote: >-
      "but the same pilot rate performs similarly for all scenarios as shown
      in Figure 9"
    context: "pilot rates tested 7/8, 15/16, 31/32 (content.md L435), 4 scenarios"
  pilot_snr_penalty_formula:
    location: content.md L424-430, Eq.(21)
    formula: "P = 10*log10(R_pilot)"
    note: >-
      R_pilot is the pilot rate (data fraction). P<0 dB (pilot rate<1) so the
      penalty is a SNR LOSS, consistent with overhead interpretation.
  modulation_and_baud:
    modulation: QPSK (content.md L434)
    baud: 28 GBaud (content.md L438, L778)
    symbols_per_snr_point: 1e7 (content.md L434)
  scenarios:  # Table 1, content.md L152-157
    s1_isl: {sigma_p2: null, theta0_urad: 25, sigma_jitt_urad: 3, desc: inter-satellite link}
    s2_downlink: {sigma_p2: 0.029, theta0_urad: null, sigma_jitt_urad: null, desc: downlink}
    s3_uplink_weak: {sigma_p2: 0.15, theta0_urad: 3, sigma_jitt_urad: 1.7, desc: uplink weak turbulence}
    s4_uplink_strong: {sigma_p2: 0.25, theta0_urad: 34.5, sigma_jitt_urad: 25.6, desc: uplink strong turbulence}
  window_n_settings:
    location: content.md L434-435
    quote: >-
      "The Viterbi-Viterbi algorithm was implemented with a window N of 32 for
      differential encoding ... a window of 64 and 256 is used for
      nondifferential encoding ..."
  pilot_filter:
    location: content.md L424, L435
    quote: >-
      "The estimate can then be filtered by combining the estimates of several
      pilot symbols [57]." + "linear interpolation is used between the pilots"
    note: >-
      sat.1553 does NOT give an explicit pilot moving-average tap count; the
      window N=32/64/256 references apply to Viterbi-Viterbi. Our pilot CPE is
      a finite moving-average over consecutive pilot phases (validation-tuned
      to match the finite window grid below), NOT a rebuilit sat.1553 equation.

# ---------------------------------------------------------------------------
# [60] Leven — the N ∝ SNR/phase-noise theory anchor
# ---------------------------------------------------------------------------
ref60_leven:
  citation: "Leven et al., IEEE PTL 19(6):366-368 (2007), DOI 10.1109/LPT.2007.891893"
  mechanism: Mth-power feedforward CFO/phase estimator (intradyne QPSK, 20 Gb/s)
  role: >-
    sat.1553 cites [60] as the theoretical anchor that optimal phase-estimation
    symbol count N is a function of SNR/phase-noise ratio. We use [60] as the
    DIRECTION anchor for B1 (window N should move with SNR/phase-noise ratio),
    not as a deployable equation (the closed-form N* function is not given in
    sat.1553 nor reconstructed here).

# ---------------------------------------------------------------------------
# [58] Martins — static pilot-rate x linewidth optimization (the baseline)
# ---------------------------------------------------------------------------
ref58_martins:
  citation: "Martins et al., OSA Continuum 4(11):2904-2917 (2021), DOI 10.1364/OSAC.438524"
  mechanism: dual-stage pilot-BPS CPE (pilot coarse + BPS fine)
  role: >-
    [58] optimizes pilot rate STATICALLY for a fixed linewidth (ground-fiber,
    no turbulence). It is the static-optimization baseline against which B1
    "dynamic" adaptation is compared. NOT used as an OSL transfer curve (it is
    ground-fiber 64 GBaud, per read-note p.72 line 27); per-task authorization
    forbids re-deriving its curves here.

# ---------------------------------------------------------------------------
# Window definition (what "N" means in T007)
# ---------------------------------------------------------------------------
window_definition:
  vv_block_mean_angle: >-
    Block-mean Viterbi-Viterbi: raise rx to M=4, average the raised samples
    over a contiguous block of N symbols, take the angle, divide by M. This is
    the common/_recovery.vv_cpr sliding Nw window restricted to a block. N is
    the number of symbols averaged (the phase-estimation window length).
  pilot_moving_average: >-
    Pilot CPE: collect the per-pilot phase estimates (angle(rx[pilot]/s_pilot))
    over N pilot symbols (NOT N data symbols) and average; interpolate the
    block carrier phase to data symbols. Equal pilot overhead is charged to
    all arms (fair-comparison rule, D004 pilot-overhead accounting).
  block_latency: 0
  block_latency_note: >-
    All comparators use block-buffered causal windows (read only the current
    block). No centered window is used, so no extra latency is owed to any
    arm; if a centered window were introduced it would report a fixed latency
    and every comparator would receive the same latency (B1 gate rule).
  phase_ambiguity_oral: >-
    Evaluation permits ONLY legal pi/2 global resolve (M=4 raised QPSK/QAM
    ambiguity). The forbidden "document says 4 rotations / code does 8 pi/4
    rotations" mismatch (V001 T006 defect) is closed here: deployable code
    applies the deterministic pi/4 fourth-power bias correction, then the only
    remaining ambiguity is pi/2 (resolved per-block by majority vote on hard
    decisions; evaluation uses legal pi/2 global resolve only).

