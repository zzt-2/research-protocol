# 帧内相位不变），DA CPR 消常数每偏振相位——单先验臂（ORC 型）不受影响。
# 修复：跨帧组合的**每帧输入项**先做公共相位规范化——EMA 平均 canon(w0)、
# RLS 累积 canon(X Y^H)、C40 正则解 (canon(X Y^H)+λ_r·W_{t-1})(Y Y^H+λ_r·I)^{-1}
# （W·exp(-j·angle(det W)/2)，det 变正实——注意符号：w~e^{-jφ}U ⇒ 因子
# e^{+jφ}=exp(-0.5j·angle(det W))；实现首版写成 +0.5j 曾把相位翻倍）；
