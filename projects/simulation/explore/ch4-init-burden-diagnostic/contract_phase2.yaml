# ch4-init-burden-diagnostic — 第二方法主选块阶段二：连续轨迹合同 + 跨窗跟踪臂对照
# R031 §六任务③④ | D055/D056 | 阶段一 ALIVE（O1S +8.6pp CI 不含 0）后条件启动
# 本合同在阶段二任何帧运行之前冻结；执行后不改，修订走新版本。

schema_version: continuous-tracking.phase2.v1.3
authority: R031-task3-4/D055/D056/PROMPT-025
action_class: GW_4A_D_TWO_LEVEL_MVE_SECOND_STAGE
status: FROZEN_BEFORE_EXECUTION

