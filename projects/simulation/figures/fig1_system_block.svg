<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" font-family="serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#333333"/>
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#0072B2"/>
    </marker>
    <marker id="arrow-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#D55E00"/>
    </marker>
  </defs>

  <!-- ========== Title ========== -->
  <text x="480" y="24" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">
    Satellite-to-Ground FSO Link with Dual Carrier Phase Estimation
  </text>

  <!-- ========== TX side ========== -->
  <rect x="20" y="60" width="120" height="70" rx="4" fill="#E8F0FE" stroke="#0072B2" stroke-width="1.2"/>
  <text x="80" y="85" text-anchor="middle" font-size="10" font-weight="bold" fill="#0072B2">16APSK Mapper</text>
  <text x="80" y="100" text-anchor="middle" font-size="8" fill="#444">symbols s[k]</text>
  <text x="80" y="115" text-anchor="middle" font-size="8" fill="#444">(8,8) constellation</text>

  <rect x="20" y="150" width="120" height="50" rx="4" fill="#E8F0FE" stroke="#0072B2" stroke-width="1.2"/>
  <text x="80" y="170" text-anchor="middle" font-size="10" font-weight="bold" fill="#0072B2">Pilot Insertion</text>
  <text x="80" y="185" text-anchor="middle" font-size="8" fill="#444">1 pilot / 4 symbols</text>
  <text x="80" y="196" text-anchor="middle" font-size="8" fill="#888">overhead: 1.25 dB</text>

  <text x="80" y="222" text-anchor="middle" font-size="9" font-weight="bold" fill="#333">Transmitter (Sat)</text>

  <!-- ========== Channel ========== -->
  <rect x="190" y="80" width="200" height="150" rx="6" fill="#FFF3E0" stroke="#D55E00" stroke-width="1.2"/>
  <text x="290" y="100" text-anchor="middle" font-size="10" font-weight="bold" fill="#D55E00">Atmospheric Channel</text>
  <line x1="210" y1="110" x2="370" y2="110" stroke="#D55E00" stroke-width="0.4" opacity="0.4"/>

  <text x="290" y="130" text-anchor="middle" font-size="9" fill="#444">Gamma-Gamma Turbulence</text>
  <text x="220" y="148" font-size="8" fill="#666">h = h_l · h_a</text>
  <text x="220" y="162" font-size="8" fill="#666">h_a ~ GG(α, β)</text>

  <!-- Turbulence tiers -->
  <text x="215" y="185" font-size="7.5" fill="#888">Weak: α=4.0, β=3.0</text>
  <text x="215" y="197" font-size="7.5" fill="#888">Mod:  α=2.5, β=1.8</text>
  <text x="215" y="209" font-size="7.5" fill="#888">Strong: α=1.5, β=0.8</text>

  <!-- impairments -->
  <text x="325" y="148" font-size="8" fill="#666">+ Phase noise</text>
  <text x="325" y="162" font-size="8" fill="#666">  (laser Δν=10kHz)</text>
  <text x="325" y="176" font-size="8" fill="#666">+ AWGN n[k]</text>
  <text x="325" y="190" font-size="8" fill="#666">+ Deep fades</text>

  <!-- received signal -->
  <rect x="190" y="245" width="200" height="30" rx="3" fill="#F5F5F5" stroke="#666" stroke-width="0.8"/>
  <text x="290" y="263" text-anchor="middle" font-size="9" fill="#333">r[k] = h·s[k]·e^{jθ} + n[k]</text>

  <!-- ========== RX side: Dual estimator ========== -->
  <!-- DA-ML box -->
  <rect x="450" y="50" width="140" height="80" rx="4" fill="#E8F0FE" stroke="#0072B2" stroke-width="1.2"/>
  <text x="520" y="72" text-anchor="middle" font-size="10" font-weight="bold" fill="#0072B2">DA-ML Estimator</text>
  <text x="520" y="88" text-anchor="middle" font-size="8" fill="#444">Pilot-aided ML</text>
  <text x="520" y="102" text-anchor="middle" font-size="7.5" fill="#666">θ̂_DA from known</text>
  <text x="520" y="114" text-anchor="middle" font-size="7.5" fill="#666">pilot symbols</text>
  <text x="520" y="124" text-anchor="middle" font-size="7.5" fill="#888">→ robust at low SNR</text>

  <!-- NDA-ML box -->
  <rect x="450" y="155" width="140" height="80" rx="4" fill="#FFF3E0" stroke="#D55E00" stroke-width="1.2"/>
  <text x="520" y="177" text-anchor="middle" font-size="10" font-weight="bold" fill="#D55E00">NDA-ML Estimator</text>
  <text x="520" y="193" text-anchor="middle" font-size="8" fill="#444">Blind, M₀-th power</text>
  <text x="520" y="207" text-anchor="middle" font-size="7.5" fill="#666">θ̂_NDA via r[k]^M₀</text>
  <text x="520" y="219" text-anchor="middle" font-size="7.5" fill="#666">block integration</text>
  <text x="520" y="229" text-anchor="middle" font-size="7.5" fill="#888">→ gain at high SNR</text>

  <!-- Switching logic -->
  <polygon points="690,95 690,190 760,167 760,118" fill="#E8F5E9" stroke="#009E73" stroke-width="1.2"/>
  <text x="715" y="128" text-anchor="middle" font-size="9" font-weight="bold" fill="#009E73">Switch</text>
  <text x="715" y="142" text-anchor="middle" font-size="7" fill="#444">Block-effective</text>
  <text x="715" y="153" text-anchor="middle" font-size="7" fill="#444">SNR criterion</text>
  <text x="715" y="168" text-anchor="middle" font-size="7" fill="#666">γ_eff vs th</text>
  <text x="715" y="180" text-anchor="middle" font-size="7" fill="#666">~13 dB</text>

  <!-- Output -->
  <rect x="820" y="110" width="120" height="60" rx="4" fill="#F5F5F5" stroke="#333" stroke-width="1.0"/>
  <text x="880" y="132" text-anchor="middle" font-size="9" font-weight="bold" fill="#333">Phase Comp.</text>
  <text x="880" y="146" text-anchor="middle" font-size="8" fill="#444">θ̂ → decision</text>
  <text x="880" y="160" text-anchor="middle" font-size="8" fill="#444">→ BER demapping</text>

  <!-- ========== Arrows ========== -->
  <!-- TX to channel -->
  <line x1="140" y1="95" x2="190" y2="95" stroke="#333" stroke-width="1.0" marker-end="url(#arrow)"/>
  <line x1="140" y1="175" x2="190" y2="175" stroke="#333" stroke-width="1.0" marker-end="url(#arrow)"/>

  <!-- Channel to RX -->
  <line x1="390" y1="260" x2="445" y2="100" stroke="#333" stroke-width="0.8" marker-end="url(#arrow)"/>
  <line x1="390" y1="260" x2="445" y2="195" stroke="#333" stroke-width="0.8" marker-end="url(#arrow)"/>
  <text x="415" y="180" font-size="7" fill="#666" transform="rotate(60 415 180)">r[k]</text>

  <!-- DA to switch -->
  <line x1="590" y1="90" x2="688" y2="120" stroke="#0072B2" stroke-width="1.0" marker-end="url(#arrow-blue)"/>
  <!-- NDA to switch -->
  <line x1="590" y1="195" x2="688" y2="165" stroke="#D55E00" stroke-width="1.0" marker-end="url(#arrow-orange)"/>

  <!-- Switch to output -->
  <line x1="760" y1="142" x2="818" y2="140" stroke="#009E73" stroke-width="1.0" marker-end="url(#arrow)"/>

  <!-- ========== Annotations ========== -->
  <!-- Deep fade region -->
  <text x="290" y="300" text-anchor="middle" font-size="8" fill="#D55E00" font-style="italic">
    Deep fades cause pilot-segment failures (BER waterfall flattens)
  </text>

  <!-- Crossover note -->
  <text x="640" y="280" text-anchor="middle" font-size="8" fill="#009E73" font-style="italic">
    Crossover ~13 dB: DA robust at low SNR, NDA superior at high SNR
  </text>

  <!-- ========== Legend ========== -->
  <rect x="20" y="340" width="920" height="60" rx="3" fill="#FAFAFA" stroke="#CCC" stroke-width="0.5"/>

  <line x1="40" y1="360" x2="70" y2="360" stroke="#0072B2" stroke-width="1.5"/>
  <text x="78" y="363" font-size="8.5" fill="#333">DA-ML: pilot-aided (uses known pilot symbols, 25% overhead)</text>

  <line x1="40" y1="378" x2="70" y2="378" stroke="#D55E00" stroke-width="1.5" stroke-dasharray="4,2"/>
  <text x="78" y="381" font-size="8.5" fill="#333">NDA-ML: blind (M₀-th power demodulation, no pilot needed)</text>

  <rect x="480" y="355" width="14" height="10" fill="#E8F5E9" stroke="#009E73" stroke-width="0.8"/>
  <text x="502" y="363" font-size="8.5" fill="#333">Switch: block-effective-SNR-based estimator selection</text>

  <rect x="480" y="373" width="14" height="10" fill="#FFF3E0" stroke="#D55E00" stroke-width="0.8"/>
  <text x="502" y="381" font-size="8.5" fill="#333">Turbulent channel: Gamma-Gamma model (3 tiers: weak/moderate/strong)</text>

  <text x="800" y="363" font-size="7.5" fill="#888">16APSK, 2.5 Gsps, 1550nm</text>
  <text x="800" y="378" font-size="7.5" fill="#888">N_DFT=256, N_blocks=400</text>
</svg>
