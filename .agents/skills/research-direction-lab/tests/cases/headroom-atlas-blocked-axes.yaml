allowed_actions:
  - harvest the runnable-subdomain local negative and reusable gate assets
  - return the unresolved candidate to the portfolio
  - establish a new hash-bound closure for a blocked axis
  - preserve blocked axes as explicit infrastructure gaps
forbidden_actions:
  - reinterpret an infrastructure-blocked axis as measured-negative
  - retire the domain candidate or family from the runnable-subdomain result
  - trigger Stage B without a cell above the registered effect threshold
  - train ML or publish a domain-wide no-headroom claim
claim_ceiling:
  level: SLICE
  statement: The runnable representative subdomain was locally negative, while blocked axes prevented domain, candidate, or family closure.
